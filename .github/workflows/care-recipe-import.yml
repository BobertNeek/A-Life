name: Care recipe import
on:
  pull_request:
    paths:
      - 'scripts/import_care_scenario_recipe.py'
      - 'scripts/test_import_care_scenario_recipe.py'
      - 'scripts/llm_care_scenarios.py'
      - 'scripts/care_frontier_sampler.py'
      - '.github/workflows/care-recipe-import.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/import_care_scenario_recipe.py'
      - 'scripts/test_import_care_scenario_recipe.py'
      - 'scripts/llm_care_scenarios.py'
      - 'scripts/care_frontier_sampler.py'
      - '.github/workflows/care-recipe-import.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s scripts -p 'test_import_care_scenario_recipe.py' -v
      - run: python -B scripts/import_care_scenario_recipe.py --help
