name: CI

on:
  push:
    branches: ["main", "codex/**", "phase3-**"]
  pull_request:
    branches: ["main"]

jobs:
  training-continuity:
    name: Training checkpoint continuity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check training CLI
        run: cargo check --locked -p alife_game_app --features foundation-training --bin train_n2048_care
      - name: Objective continuation CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_cycle::founder_refresh_tests::objective_continuation
      - name: Warmup lesson corpus CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_warmup::tests

  training-output-preservation:
    name: Training output preservation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check training CLI
        run: cargo check --locked -p alife_game_app --features foundation-training --bin train_n2048_care
      - name: Output ownership CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_output::tests

  rust:
    name: Rust workspace validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Source-bound evidence tests read their exact historical producer revision.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        id: check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: Benchmark smoke
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo test -p alife_tools --test benchmark_tiers benchmark_tiers_smoke_runs_tier_1_and_10_without_bevy_or_gpu

      - name: Clippy
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Core boundaries
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: bash scripts/check_core_boundaries.sh

      - name: Docs checks
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: bash scripts/docs_check.sh
