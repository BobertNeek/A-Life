name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  native-texture-decode:
    name: Native texture decode (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux controller build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Decode and reject zstd KTX2 through the production Bevy image path
        run: cargo test --locked -p alife_game_app --features production-voxel-frontend --test bevy_texture_decode
      - name: Check native production targets
        run: cargo check --locked -p alife_game_app --features production-voxel-frontend --all-targets
      - name: Strict texture regression Clippy
        run: cargo clippy --locked -p alife_game_app --features production-voxel-frontend --test bevy_texture_decode -- -D warnings

  island-output-changes:
    name: Island output-change frontend CPU regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_MIN_STACK: '33554432'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux controller build dependency
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Run island output change-tick and invalidation CPU tests
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib production_voxel_renderer::island::update_tests:: -- --test-threads=1 --color=never'
      - name: Run camera clamp and change-tick CPU tests
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib production_voxel_renderer::island::camera_tests:: -- --test-threads=1 --color=never'
      - name: Run selection highlight parity and neighboring pointer CPU tests
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib production_voxel_renderer::god_hand:: -- --test-threads=1 --color=never'
      - name: Run live food projection and carried-object CPU tests
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib production_voxel_renderer::live_food_projection::tests:: -- --test-threads=1 --color=never'
      - name: Run live sleep phase and lifecycle CPU tests
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib production_voxel_renderer::live_sleep_feedback::tests:: -- --test-threads=1 --color=never'
      - name: Run selected-creature HUD CPU data and layout tests
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib production_voxel_renderer::status_hud:: -- --test-threads=1 --color=never'
      - name: Run individual naming and shared speech input CPU regressions
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib production_conversation_lineage_ui:: -- --test-threads=1 --color=never'
      - name: Run Hearthling skin, shared-material and inherited-paw CPU regressions
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib hearthling -- --test-threads=1 --color=never'
      - name: Run saved-appearance identity and inheritance CPU regressions
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib appearance -- --test-threads=1 --color=never'
      - name: Run graphics-capture visibility and screenshot delivery CPU regressions
        run: 'cargo test --locked -p alife_game_app --features production-voxel-frontend --lib graphics_capture:: -- --test-threads=1 --color=never'

  training-continuity:
    name: Training checkpoint continuity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check training CLI
        run: cargo check --locked -p alife_game_app --features foundation-training --bin train_n2048_care
      - name: Strict foundation-training Clippy
        run: cargo clippy --locked -p alife_game_app --features foundation-training --all-targets -- -D warnings
      - name: Adaptive game exploration shader and host CPU contracts
        run: cargo test --locked -p alife_gpu_backend --all-targets --features training-rollout
      - name: Familiar-object unresolved-gap input chain CPU regression
        run: cargo test --locked -p alife_game_app --features foundation-training --lib repeated_sealed_mismatch_keeps_familiar_object_gap_evidence_target_local
      - name: Foundation scenario and replay CPU tests
        run: 'cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training::'
      - name: Bounded headless observation CPU tests
        run: 'cargo test --locked -p alife_game_app --features foundation-training --lib gpu_live_runtime::headless_trace::tests'
      - name: Group-50 native admission and replay CPU contracts
        run: 'cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_cycle::group::'
      - name: Residual critic batching CPU regression
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_cycle::critic_residual::
      - name: Compile opt-in residual critic hardware fixture
        run: cargo check --locked -p alife_training --features gpu-tests --lib --tests
      - name: Compile opt-in training hardware fixtures
        run: cargo check --locked -p alife_game_app --features foundation-training,gpu-tests --all-targets
      - name: Objective continuation CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_cycle::founder_refresh_tests::objective_continuation
      - name: Initial actor checkpoint CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_cycle::founder_refresh_tests::initial_actor_checkpoint
      - name: Warmup lesson corpus CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_warmup::tests
      - name: Acquisition rehearsal CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_acquisition_rehearsal::tests
      - name: Archived checkpoint inspection CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_archived_success_replay::tests
      - name: Read-only inspection CLI CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --bin inspect_archived_success

  training-output-preservation:
    name: Training output preservation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check training CLI
        run: cargo check --locked -p alife_game_app --features foundation-training --bin train_n2048_care
      - name: Care targeting inspection CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --bin train_n2048_care targeting_tests
      - name: Output ownership CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_output::tests

  rust:
    name: Rust workspace validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Source-bound evidence tests read their exact historical producer revision.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        id: check
        run: cargo check --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --all-targets --no-fail-fast

      - name: Clippy
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Core boundaries
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: bash scripts/check_core_boundaries.sh
