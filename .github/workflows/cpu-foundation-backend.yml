name: CPU foundation backend

on:
  push:
    branches: ["main"]
    paths: ["crates/alife_training/**", "crates/alife_archive/**", "crates/alife_semantic/**", "crates/alife_core/**", "crates/alife_runtime/**", "crates/alife_gpu_backend/**", "crates/alife_world/**", "crates/alife_game_app/**", "crates/alife_school/**", "Cargo.toml", "Cargo.lock", ".cargo/**", "rust-toolchain*", "scripts/run_cpu_care_serial.py", "scripts/test_cpu_care_serial.py", "scripts/compare_cpu_care_rounds.py", "scripts/test_compare_cpu_care_rounds.py", "scripts/check_current_checkpoint_native.py", "scripts/current_checkpoint_store.py", "scripts/run_current_care.py", "scripts/check_cpu_retention_native.py", "scripts/cpu_retention_report.py", ".github/workflows/cpu-foundation-backend.yml"]
  pull_request:
    branches: ["main"]
    paths: ["crates/alife_training/**", "crates/alife_archive/**", "crates/alife_semantic/**", "crates/alife_core/**", "crates/alife_runtime/**", "crates/alife_gpu_backend/**", "crates/alife_world/**", "crates/alife_game_app/**", "crates/alife_school/**", "Cargo.toml", "Cargo.lock", ".cargo/**", "rust-toolchain*", "scripts/run_cpu_care_serial.py", "scripts/test_cpu_care_serial.py", "scripts/compare_cpu_care_rounds.py", "scripts/test_compare_cpu_care_rounds.py", "scripts/check_current_checkpoint_native.py", "scripts/current_checkpoint_store.py", "scripts/run_current_care.py", "scripts/check_cpu_retention_native.py", "scripts/cpu_retention_report.py", ".github/workflows/cpu-foundation-backend.yml"]

permissions:
  contents: read

jobs:
  serial-care-round:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '33554432'
      VK_ICD_FILENAMES: /no-vulkan-icd.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Serial real-care rounds, founder continuation and heldout comparison
        run: cargo test --locked -p alife_game_app --features cpu-training --test cpu_care_round -- --nocapture
  cooperative-round:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '33554432'
      VK_ICD_FILENAMES: /no-vulkan-icd.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Bounded central round, optimizer continuity and publication recovery
        run: cargo test --locked -p alife_training --features cpu-backend --test cpu_cooperative_round -- --nocapture
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TEST_THREADS: '1'
      VK_ICD_FILENAMES: /no-vulkan-icd.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run CPU kernels and native continuation contracts without an ICD
        run: |
          cargo test --locked -p alife_training --features cpu-backend --lib native_receipt::
          cargo test --locked -p alife_training --features cpu-backend --lib cpu::
          cargo test --locked -p alife_training --features cpu-backend --test cpu_backend --test cpu_collector --test cpu_collect_only --test cpu_cli --test backend_handoff --test checkpoint_validation -- --nocapture
      - name: Inference-only founder merge contracts
        env:
          RUST_MIN_STACK: '33554432'
        run: |
          cargo test --locked -p alife_training --lib founder_merge::tests -- --nocapture
          cargo test --locked -p alife_training --features receipt-lineage --bin merge_founder_inference --test merge_inference_cli -- --nocapture
          cargo clippy --locked -p alife_training --features receipt-lineage --bin merge_founder_inference --test merge_inference_cli -- -D warnings
      - name: Preserve GPU evidence and offline-only CPU boundaries
        run: |
          cargo test --locked -p alife_core --test cpu_neural_evidence --test experience_neural_decision --test packed_experience_logging
          cargo test --locked -p alife_world --test cpu_policy_config
          cargo test --locked -p alife_game_app --features cpu-training --test cpu_policy_boundary
          ALIFE_CURRENT_FIXTURE_OUTPUT="$RUNNER_TEMP/current-synthetic-$GITHUB_RUN_ID.alife-checkpoint" cargo test --locked -p alife_game_app --features cpu-training --lib foundation_training_cycle::portable_handoff
          cargo build --locked -p alife_game_app --features cpu-training --bin export_native_training_handoff
          python -B scripts/check_current_checkpoint_native.py target/debug/export_native_training_handoff "$RUNNER_TEMP/current-synthetic-$GITHUB_RUN_ID.alife-checkpoint"
      - name: Exercise native CPU care episodes and resume contracts
        run: |
          cargo test --locked -p alife_game_app --features cpu-training --test cpu_care -- --nocapture
          cargo test --locked -p alife_game_app --features cpu-training --lib foundation_cpu_care::collect_only_tests -- --nocapture
          cargo test --locked -p alife_game_app --features cpu-training --lib foundation_cpu_care::evaluation::tests
          cargo test --locked -p alife_game_app --features cpu-training --lib declared_assessment_admission
          cargo test --locked -p alife_game_app --features cpu-training --lib assessment_exceptions
          cargo test --locked -p alife_game_app --features cpu-training --lib foundation_cpu_care::admission::tests
          cargo test --locked -p alife_game_app --features cpu-training --lib foundation_cpu_care::round::tests
          cargo test --locked -p alife_game_app --features cpu-training --lib collect_only_snapshot_imports_require_current_raw_ledger_bytes_and_keep_exclusions
          cargo test --locked -p alife_game_app --features cpu-training --lib explicit_training_prior
          cargo test --locked -p alife_game_app --features cpu-training --lib food_outcome
          python -B -m unittest discover -s scripts -p test_cpu_care_serial.py -v
          python -B -m unittest discover -s scripts -p test_compare_cpu_care_rounds.py -v
          cargo build --locked -p alife_game_app --features cpu-training --bin train_cpu_care --bin train_cpu_care_round
          python -B scripts/check_cpu_retention_native.py target/debug/train_cpu_care
          cargo clippy --locked -p alife_game_app --features cpu-training --lib --bin train_cpu_care --bin train_cpu_care_round --test cpu_care --test cpu_care_round -- -D warnings
      - name: Strict CPU source review
        run: cargo clippy --locked -p alife_training --features cpu-backend --lib --bins --test cpu_backend --test cpu_collector --test cpu_collect_only --test cpu_cooperative_round --test cpu_cli --test backend_handoff -- -D warnings
      - name: Compile hardware differential test without requesting an adapter
        run: cargo check --locked -p alife_training --features cpu-backend,gpu-tests --test cpu_backend --test backend_handoff
      - name: Package tested CPU executable
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import tarfile

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          revision = command('git', 'rev-parse', 'HEAD')
          if revision != os.environ['EXPECTED_SOURCE_REVISION']:
              raise SystemExit('Checked-out revision mismatch')
          binary = Path('target/debug/train_cpu_care')
          round_binary = Path('target/debug/train_cpu_care_round')
          versions = re.findall(r'GLIBC_(\d+(?:\.\d+)+)', command('readelf', '--version-info', str(binary)))
          minimum_glibc = max(set(versions), key=lambda value: tuple(map(int, value.split('.')))) if versions else None
          rustc = command('rustc', '-vV')
          with binary.open('rb') as handle:
              digest = hashlib.file_digest(handle, 'sha256').hexdigest()
          receipt = {
              'schema': 1,
              'source_revision': revision,
              'source_tree': command('git', 'rev-parse', 'HEAD^{tree}'),
              'executable_sha256': digest,
              'executable_bytes': binary.stat().st_size,
              'additional_executables': {round_binary.name: {
                  'sha256': hashlib.file_digest(round_binary.open('rb'), 'sha256').hexdigest(),
                  'bytes': round_binary.stat().st_size,
              }},
              'rustc': rustc,
              'target': next(line.removeprefix('host: ') for line in rustc.splitlines() if line.startswith('host: ')),
              'minimum_glibc': minimum_glibc,
              'dynamic_libraries': re.findall(r'Shared library: \[(.*?)\]', command('readelf', '-d', str(binary))),
              'build_host': {'system': platform.system(), 'machine': platform.machine(), 'libc': platform.libc_ver()},
              'features': ['cpu-training'],
              'build_profile': 'dev',
              'production_training_executed': False,
              'founder_promoted': False,
              'workflow_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          artifact = Path('target/cpu-training-artifact')
          artifact.mkdir()
          receipt_bytes = (json.dumps(receipt, indent=2) + '\n').encode('utf-8')
          with tarfile.open(artifact / 'cpu-training.tar.gz', 'w:gz') as archive:
              archive.add(binary, arcname=binary.name)
              archive.add(round_binary, arcname=round_binary.name)
              info = tarfile.TarInfo('build-receipt.json')
              info.size = len(receipt_bytes)
              info.mode = 0o644
              archive.addfile(info, io.BytesIO(receipt_bytes))
          PY
      - name: Upload CPU executable and receipt
        uses: actions/upload-artifact@v4
        with:
          name: cpu-training-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cpu-training-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
