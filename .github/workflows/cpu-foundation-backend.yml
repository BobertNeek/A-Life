name: CPU foundation backend

on:
  push:
    branches: ["main", "feat/cpu-foundation-backend", "codex/**"]
    paths: ["crates/alife_training/**", "crates/alife_core/**", "crates/alife_runtime/**", "crates/alife_gpu_backend/**", "crates/alife_world/**", "crates/alife_game_app/**", "crates/alife_school/**", "Cargo.lock", ".github/workflows/cpu-foundation-backend.yml"]
  pull_request:
    branches: ["main"]
    paths: ["crates/alife_training/**", "crates/alife_core/**", "crates/alife_runtime/**", "crates/alife_gpu_backend/**", "crates/alife_world/**", "crates/alife_game_app/**", "crates/alife_school/**", "Cargo.lock", ".github/workflows/cpu-foundation-backend.yml"]

permissions:
  contents: read

jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TEST_THREADS: '1'
      VK_ICD_FILENAMES: /no-vulkan-icd.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run CPU kernels and native continuation contracts without an ICD
        run: |
          cargo test --locked -p alife_training --features cpu-backend --lib cpu::
          cargo test --locked -p alife_training --features cpu-backend --test cpu_backend --test cpu_collector --test cpu_cli --test backend_handoff --test checkpoint_validation --test blocked_legacy_pipelines -- --nocapture
      - name: Preserve GPU evidence and offline-only CPU boundaries
        run: |
          cargo test --locked -p alife_core --test cpu_neural_evidence --test experience_neural_decision --test packed_experience_logging
          cargo test --locked -p alife_world --test cpu_policy_config
          cargo test --locked -p alife_game_app --features foundation-training --test cpu_policy_boundary
      - name: Strict CPU source review
        run: cargo clippy --locked -p alife_training --features cpu-backend --lib --bins --test cpu_backend --test cpu_collector --test cpu_cli --test backend_handoff -- -D warnings
      - name: Compile hardware differential test without requesting an adapter
        run: cargo check --locked -p alife_training --features cpu-backend,gpu-tests --test cpu_backend --test backend_handoff
