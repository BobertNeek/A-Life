name: Food transfer regressions

on:
  push:
    branches: ["main", "codex/**", "phase3-**"]
  pull_request:
    branches: ["main"]

jobs:
  food-transfer:
    name: Food transfer and acquisition credit CPU regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run existing food transfer and acquisition credit CPU regressions
        run: cargo test --locked -p alife_game_app --features foundation-training --test foundation_grab_food_world_gate
