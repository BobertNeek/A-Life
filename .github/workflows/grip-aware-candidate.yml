name: Life-free grip candidate qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'crates/alife_core/**'
      - 'crates/alife_world/**'
      - 'crates/alife_training/**'
      - 'crates/alife_runtime/**'
      - 'crates/alife_gpu_backend/**'
      - 'scripts/grip_qualification/**'
      - 'scripts/check_core_boundaries.sh'
      - '.github/workflows/grip-aware-candidate.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'

permissions:
  contents: read

concurrency:
  group: grip-candidate-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_TEST_THREADS: '1'
  RUST_MIN_STACK: '33554432'
  VK_ICD_FILENAMES: /no-vulkan-icd.json
  EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}

jobs:
  source-and-fixture-qualification:
    if: ${{ github.repository == 'BobertNeek/A-Life' && github.event.pull_request.head.repo.full_name == 'BobertNeek/A-Life' && github.event.pull_request.head.ref == 'experiment/grip-aware-reader-20261107' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Qualify public source and disposable fixture contracts only
        timeout-minutes: 26
        run: python3 -B scripts/grip_qualification/qualify.py
