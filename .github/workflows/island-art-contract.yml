name: Island artwork binding (CPU only)
on:
  push:
    branches: ["qualia/island-graphics-week-20261119"]
    paths:
      - .github/workflows/island-art-contract.yml
      - crates/alife_game_app/src/production_voxel_renderer/island.rs
      - crates/alife_game_app/src/production_voxel_renderer/island_update_tests.rs
      - crates/alife_game_app/assets/landscape/island/habitat-ground.glb
      - crates/alife_game_app/assets/landscape/island/habitats/**
      - crates/alife_game_app/assets/landscape/island/minerals/**
      - crates/alife_game_app/assets/landscape/island/canopy/**
      - crates/alife_game_app/assets/landscape/island/geology/**
      - crates/alife_game_app/assets/landscape/island/Boulder*.glb
      - crates/alife_game_app/assets/landscape/island/Cliff.glb
      - crates/alife_game_app/assets/landscape/island/Scree.glb
      - crates/alife_game_app/assets/landscape/island/strandline.glb
      - crates/alife_game_app/src/production_voxel_renderer/island/strandline.rs
      - crates/alife_game_app/src/production_voxel_renderer/island/marine_sky.rs
      - crates/alife_game_app/src/production_voxel_renderer/island/groves.rs
      - crates/alife_game_app/assets/landscape/island/grove-crowns.*
      - crates/alife_game_app/assets/landscape/island/marine-day.glb
      - crates/alife_game_app/src/production_voxel_renderer/island/atmosphere.rs
      - crates/alife_game_app/src/production_voxel_renderer/island/capture_pose.rs
      - crates/alife_game_app/assets/landscape/island/coastal-daylight.json
permissions:
  contents: read
jobs:
  static-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Export standard formatting for the focused island integration
        run: |
          mkdir -p "$RUNNER_TEMP/island-rustfmt"
          for file in island.rs island_update_tests.rs island/marine_sky.rs island/groves.rs; do
            mkdir -p "$(dirname "$RUNNER_TEMP/island-rustfmt/$file")"
            rustfmt --config skip_children=true --edition 2021 --emit stdout "crates/alife_game_app/src/production_voxel_renderer/$file" > "$RUNNER_TEMP/island-rustfmt/$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-island-integration
          path: ${{ runner.temp }}/island-rustfmt
          retention-days: 7
      - name: Install native controller build dependency
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Test shipping island light, range centres, camera and component integration
        run: |
          cargo test --locked -p alife_game_app --features production-voxel-frontend --lib production_voxel_renderer::island:: -- --test-threads=1
