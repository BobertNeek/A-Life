name: Isolated island art study
on:
  push:
    branches: ["qualia/island-graphics-week-20261119"]
    paths:
      - .github/workflows/island-art-study.yml
      - scripts/build_island_strandline.py
      - scripts/build_island_habitats.py
      - scripts/verify_island_habitats.py
      - scripts/island_habitat_field.py
      - scripts/island_habitat_tiles.py
      - scripts/island_habitat_massing.py
      - scripts/island_tidal_film.py
      - scripts/island_coast_plants.py
      - scripts/island_dune_communities.py
      - scripts/island_salt_sward.py
      - scripts/build_island_marine_sky.py
      - scripts/island_review_light.py
      - scripts/island_review_water.py
      - studies/island-art-week/water-inputs/**
      - crates/alife_game_app/assets/landscape/island/coastal-daylight.json
      - scripts/render_island_geology.py
      - scripts/verify_island_strandline.py
      - scripts/compare_island_art.py
permissions:
  contents: read
jobs:
  paired-strand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare the geometry bake independently of Blender installation
        run: |
          python3 -m venv "$RUNNER_TEMP/shore-py"
          "$RUNNER_TEMP/shore-py/bin/python" -m pip install --only-binary=:all: --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 Pillow==11.3.0
          echo "$RUNNER_TEMP/shore-py/bin" >> "$GITHUB_PATH"
      - name: Bake and verify the actual near-field shore asset
        run: |
          mkdir -p "$RUNNER_TEMP/shore"
          python3 scripts/build_island_marine_sky.py --out "$RUNNER_TEMP/shore/marine-day.glb"
          python3 scripts/build_island_strandline.py --out "$RUNNER_TEMP/shore/strandline.glb"
          python3 scripts/verify_island_strandline.py "$RUNNER_TEMP/shore/strandline.glb" > "$RUNNER_TEMP/shore/validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-geometry
          path: |
            ${{ runner.temp }}/shore/marine-day.glb
            ${{ runner.temp }}/shore/strandline.glb
            ${{ runner.temp }}/shore/validation.json
          retention-days: 7
      - name: Bake real habitat substrate meshes and verify invisible geometry invariants
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python3 scripts/build_island_habitats.py --out "$RUNNER_TEMP/substrates"
          python3 scripts/verify_island_habitats.py crates/alife_game_app/assets/landscape/island/terrain-chunks.glb "$RUNNER_TEMP/substrates/habitat-ground.glb" > "$RUNNER_TEMP/substrates/validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-habitat-material
          path: ${{ runner.temp }}/substrates/
          retention-days: 7
      - name: Reuse only the checksum-pinned official Blender archive
        if: hashFiles('studies/island-art-week/water-inputs/water.json') != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/blender-4.3.2-linux-x64.tar.xz
          key: qualia-art-blender-4.3.2-linux-x64-4da1c956673c0485
      - name: Install the cached official Blender or a signed Ubuntu package
        if: hashFiles('studies/island-art-week/water-inputs/water.json') != ''
        env:
          RELEASE: https://download.blender.org/release/Blender4.3
          ARCHIVE: blender-4.3.2-linux-x64.tar.xz
        run: |
          cd "$RUNNER_TEMP"
          if test -s "$ARCHIVE" || curl -fsS --retry 2 --max-time 120 "$RELEASE/$ARCHIVE" -o "$ARCHIVE"; then
            echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $ARCHIVE" | sha256sum -c
            tar -xJf "$ARCHIVE"
            echo "$RUNNER_TEMP/blender-4.3.2-linux-x64" >> "$GITHUB_PATH"
          else
            # The public vendor CDN intermittently returns 403/503 to hosted
            # runners. A signed distribution build is an independent tool,
            # not a reason to mark a missing render green. Record its version.
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -q update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -y --no-install-recommends install blender
          fi
      - name: Two neutral controls and one dressed shore-to-massif composition
        if: hashFiles('studies/island-art-week/water-inputs/water.json') != ''
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          D=crates/alife_game_app/assets/landscape/island
          S="$RUNNER_TEMP/shore"
          # Freeze the comparison in Git, even after the accepted replacements
          # themselves are checked in on this branch. No ungraded map is inferred.
          BASE=4bf90a3438bc160665580ba711c44c1c96526879
          git fetch --no-tags --depth=1 origin "$BASE"
          mkdir -p "$S/previous"
          git show "$BASE:$D/strandline.glb" > "$S/previous/strandline.glb"
          git show "$BASE:$D/geology/pigment.png" > "$S/previous/pigment.png"
          echo "2dd4cc7e1bb41903abe46b06c37b3e1b23e10bf7bf89709b503dfb07dcbb162a  $S/previous/strandline.glb" | sha256sum -c
          echo "1b0b041b5ffe6bd73950f4d475b66c136041746b5fa8c21f27b9eb6451ab6338  $S/previous/pigment.png" | sha256sum -c
          blender --version | head -1 > "$S/renderer.txt"
          render() { blender -b -t 2 --python-exit-code 1 -P scripts/render_island_geology.py -- "$D/terrain-chunks.glb" "$@"; }
          compare() { python3 scripts/compare_island_art.py "$S/before/$1.png" "$S/after/$1.png" "$S/$1.jpg" --title "$2"; }
          render "$S/before" --tidal-review --strandline "$S/previous/strandline.glb" --original-macro "$S/previous/pigment.png"
          render "$S/after" --tidal-review --strandline "$S/strandline.glb" --habitats "$RUNNER_TEMP/substrates/habitat-ground.glb"
          W=studies/island-art-week/water-inputs
          R="$RUNNER_TEMP/versioned-massif"
          python3 scripts/prototype_island_ridge.py "$R"
          cmp "$R/island-ridge-v2.bin" studies/island-ridge-v2/island-ridge-v2.bin
          showcase() {
            blender -b -t 2 --python-exit-code 1 -P scripts/render_island_geology.py -- "$R/terrain-chunks.glb" "$@" --cove-showcase --water-inputs "$W" --surface "$R/island-ridge-v2.bin" --placements "$R/props-ridge-v2.json"
          }
          python3 scripts/build_island_habitats.py --surface "$R/island-ridge-v2.bin" --terrain "$R/terrain-chunks.glb" --placements "$R/props-ridge-v2.json" --out "$R/substrates"
          python3 scripts/verify_island_habitats.py "$R/terrain-chunks.glb" "$R/substrates/habitat-ground.glb" --surface "$R/island-ridge-v2.bin" --placements "$R/props-ridge-v2.json"
          showcase "$S/before" --strandline "$S/previous/strandline.glb" --coastal-light "$D/coastal-daylight.json"
          showcase "$S/after" --marine-sky "$S/marine-day.glb" --strandline "$S/strandline.glb" --coastal-light "$D/coastal-daylight.json" --habitats "$R/substrates/habitat-ground.glb"
          compare strand-eye 'Eastern strand at 86 cm | Same neutral light and lens'
          compare strand-reach 'Eastern strand from the bank | Same neutral light and lens'
          compare cove-showcase 'Windrail cove | Same camera, sunlight and opt-in massif; rooted coastal habitats and marine sky | CPU Blender'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: hashFiles('studies/island-art-week/water-inputs/water.json') != ''
        with:
          name: island-paired-strand
          path: |
            ${{ runner.temp }}/shore/renderer.txt
            ${{ runner.temp }}/shore/cove-showcase.jpg
            ${{ runner.temp }}/shore/after/cove-showcase.png
            ${{ runner.temp }}/shore/strand-eye.jpg
            ${{ runner.temp }}/shore/strand-reach.jpg
          retention-days: 7
