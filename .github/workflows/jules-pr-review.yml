# Automatic code review on every pull request, powered by Jules.
#
# How it works:
#   1. A PR is opened/updated -> this workflow creates a Jules session
#      with a "review this PR" prompt.
#   2. It polls the session until it finishes (up to ~20 minutes).
#   3. It posts Jules' review as a PR comment (via github-actions bot).
#
# One-time setup (manual):
#   1. Connect this repo at https://jules.google.com (done).
#   2. Generate an API key at https://jules.google.com/settings#api
#   3. Add it as a repository secret named JULES_API_KEY:
#      Settings > Secrets and variables > Actions > New repository secret.

name: Jules PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: jules-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create Jules review session
        id: jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [ -z "$JULES_API_KEY" ]; then
            echo "::error::JULES_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          SOURCE="$(curl -sS -H "X-Goog-Api-Key: $JULES_API_KEY" \
            'https://jules.googleapis.com/v1alpha/sources?pageSize=100' | \
            jq -r --arg repo "$REPO" \
              '.sources[] | select((.githubRepo.owner + "/" + .githubRepo.repo) == $repo) | .name' | head -n 1)"

          if [ -z "$SOURCE" ] || [ "$SOURCE" = "null" ]; then
            echo "::error::No Jules source connected for $REPO. Connect it at https://jules.google.com first."
            exit 1
          fi
          echo "Jules source: $SOURCE"

          PROMPT="You are performing an automated code review of pull request #$PR_NUMBER in $REPO.

          1. Fetch the diff of the PR:
             curl -sL https://github.com/$REPO/pull/$PR_NUMBER.diff
             (Fallback: GET https://api.github.com/repos/$REPO/pulls/$PR_NUMBER with header 'Accept: application/vnd.github.diff')

          2. Review every changed hunk for:
             - correctness bugs and logic errors
             - non-exhaustive matches and unhandled enum variants
             - dead code and unused items
             - API misuse, type errors, off-by-one mistakes
             - anything that would break 'cargo check --workspace --all-targets', clippy, or the test suite
             - Rust specifics: ownership/borrow errors, missing error handling, panics on unwrap/expect in non-test code

          3. Be specific: file path and line number for each finding, with a brief quote of the offending code.

          4. Skip style nitpicks unless they signal a real problem. No filler praise.

          Write your review as plain markdown. Start with exactly one verdict line:
          VERDICT: APPROVE
          or
          VERDICT: NEEDS WORK
          Then a '## Findings' section listing each issue (or 'No issues found' if clean).

          Do not open pull requests, push branches, or modify any code. Review only."

          RESPONSE="$(curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -d "$(jq -n --arg prompt "$PROMPT" --arg source "$SOURCE" \
                        --arg branch "$BASE_REF" --arg title "PR #$PR_NUMBER review" \
              '{prompt: $prompt, title: $title, sourceContext: {source: $source, githubRepoContext: {startingBranch: $branch}}}')" \
            'https://jules.googleapis.com/v1alpha/sessions')"

          SESSION_NAME="$(echo "$RESPONSE" | jq -r '.name // empty')"
          SESSION_URL="$(echo "$RESPONSE" | jq -r '.url // empty')"
          if [ -z "$SESSION_NAME" ]; then
            echo "::error::Failed to create Jules session: $RESPONSE"
            exit 1
          fi
          echo "session_name=$SESSION_NAME" >> "$GITHUB_OUTPUT"
          echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
          echo "Created session: $SESSION_NAME"

      - name: Wait for review to complete
        id: wait
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_NAME: ${{ steps.jules.outputs.session_name }}
        run: |
          set -euo pipefail
          STATE=""
          for i in $(seq 1 60); do
            STATE="$(curl -sS -H "X-Goog-Api-Key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/$SESSION_NAME" | jq -r '.state // empty')"
            echo "Poll $i: state=$STATE"
            case "$STATE" in
              COMPLETED|FAILED|CANCELLED) break ;;
            esac
            sleep 20
          done
          echo "final_state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: always()
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_NAME: ${{ steps.jules.outputs.session_name }}
          SESSION_URL: ${{ steps.jules.outputs.session_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINAL_STATE: ${{ steps.wait.outputs.final_state }}
        run: |
          set -euo pipefail
          REVIEW=""
          if [ -n "$SESSION_NAME" ]; then
            ACTIVITIES="$(curl -sS -H "X-Goog-Api-Key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/$SESSION_NAME/activities?pageSize=100" || true)"
            REVIEW="$(echo "$ACTIVITIES" | jq -r '
              [.activities[]? | .. | objects
               | (.description // .text // empty)
               | select(type == "string")
               | select(length > 80)] | last // empty')"
          fi

          {
            echo "## Jules code review (automated)"
            echo ""
            if [ -n "$REVIEW" ]; then
              echo "$REVIEW"
            elif [ "$FINAL_STATE" = "COMPLETED" ]; then
              echo "Jules finished the review, but the review text could not be extracted automatically."
            else
              echo "The Jules review did not complete (final state: ${FINAL_STATE:-unknown})."
            fi
            echo ""
            echo "---"
            if [ -n "$SESSION_URL" ] && [ "$SESSION_URL" != "null" ]; then
              echo "*Automated review by Jules. [View the full session]($SESSION_URL)*"
            else
              echo "*Automated review by Jules.*"
            fi
          } > /tmp/review.md

          gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@/tmp/review.md
          echo "Review comment posted."
