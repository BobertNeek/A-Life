# Review pull requests, newly created codex/** branches, or a manually selected
# branch. Follow-up pushes to an existing branch do not start another review.
# Results are posted to the PR or branch-head commit.
# Requires a connected Jules source and the JULES_API_KEY repository secret.

name: Jules review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['codex/**']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to review (e.g. codex/training-readiness-20261001)'
        required: true
        type: string

permissions:
  contents: write # post commit comments on the branch head
  pull-requests: write # post PR comments

concurrency:
  group: jules-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Pushes: only review newly created branches, not every follow-up push.
    if: github.event_name != 'push' || github.event.created == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The notice gives November 11 without an exact time or timezone:
      # https://jules.google/docs/changelog/2026-10-29
      # Conservatively stop new requests at the start of that day in UTC;
      # this is our earlier cutoff, not a time specified by Google.
      - name: Check Jules retirement cutoff
        id: retirement
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/jules-creation-gate.py" <<'PYTHON'
          from datetime import datetime, timezone
          import os

          cutoff = datetime(2026, 11, 11, tzinfo=timezone.utc)
          allowed = datetime.now(timezone.utc) < cutoff
          value = str(allowed).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"creation_allowed={value}\n")
          if not allowed:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(
                      "## Jules review retired: no session created\n\n"
                      "New Jules sessions are disabled by this repository's conservative "
                      f"{cutoff:%Y-%m-%d %H:%M UTC} cutoff. No substantive code review or approval "
                      "was performed by this run.\n"
                  )
          print(value)
          PYTHON
          python3 "$RUNNER_TEMP/jules-creation-gate.py"

      - name: Resolve review target
        id: target
        if: steps.retirement.outputs.creation_allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_BRANCH: ${{ inputs.branch }}
          PUSH_REF: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            MODE=pr
            REF="$PR_REF"
            SHA="$PR_SHA"
            BASE="$PR_BASE"
            TITLE="PR #$PR_NUMBER review"
          else
            MODE=branch
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              REF="$INPUT_BRANCH"
              git check-ref-format --branch "$REF" >/dev/null
              SHA="$(gh api "repos/$REPO/commits/$REF" -q .sha)"
            else
              REF="$PUSH_REF"
              SHA="$PUSH_SHA"
            fi
            BASE="$(gh api "repos/$REPO/commits/main" -q .sha)"
            TITLE="Branch $REF review"
          fi
          DIFF_URL="https://github.com/$REPO/compare/$BASE...$SHA.diff"
          {
            echo "mode=$MODE"
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "base=$BASE"
            echo "diff_url=$DIFF_URL"
            echo "title=$TITLE"
          } >> "$GITHUB_OUTPUT"
          echo "Reviewing $MODE $REF @ $SHA"

      - name: Create Jules review session
        id: jules
        if: steps.retirement.outputs.creation_allowed == 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          DIFF_URL: ${{ steps.target.outputs.diff_url }}
          REF: ${{ steps.target.outputs.ref }}
          BASE: ${{ steps.target.outputs.base }}
          SHA: ${{ steps.target.outputs.sha }}
          TITLE: ${{ steps.target.outputs.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Target resolution may have crossed the deadline. Check before secrets/sources.
          CREATION_ALLOWED="$(python3 "$RUNNER_TEMP/jules-creation-gate.py")"
          [ "$CREATION_ALLOWED" = true ] || exit 0
          if [ -z "$JULES_API_KEY" ]; then
            echo "::error::JULES_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          SOURCE="$(curl -fsS -H "X-Goog-Api-Key: $JULES_API_KEY" \
            'https://jules.googleapis.com/v1alpha/sources?pageSize=100' | \
            jq -r --arg repo "$REPO" \
            '.sources[] | select((.githubRepo.owner + "/" + .githubRepo.repo) == $repo) | .name' | head -n 1)"
          if [ -z "$SOURCE" ] || [ "$SOURCE" = "null" ]; then
            echo "::error::No Jules source connected for $REPO. Connect it at https://jules.google.com first."
            exit 1
          fi
          PROMPT="Review commit $SHA of branch $REF in $REPO against base commit $BASE.
          1. Fetch and check out that exact commit, then read its immutable diff:
             git fetch origin $SHA
             git checkout --detach $SHA
             curl -fsSL $DIFF_URL
          Review repository changes at those commits, not files generated by your own review tools.
          2. Review every changed hunk for:
             - correctness bugs and logic errors
             - non-exhaustive matches and unhandled enum variants
             - dead code and unused items
             - API misuse, type errors, off-by-one mistakes
             - anything that would break 'cargo check --workspace --all-targets', clippy, or the test suite
             - Rust specifics: ownership/borrow errors, missing error handling, panics on unwrap/expect in non-test code
             - life-simulation code: behavior that would break believable emergent creature behavior
               (physics/contact math, genetics, biochemistry, learning) — flag world bugs, not just test bugs
          3. Be specific: file path and line number for each finding, with a brief quote of the offending code.
          4. Skip style nitpicks unless they signal a real problem. No filler praise.
          Write concise markdown with concrete findings and their impact.
          If no actionable issue is found, say so and identify material unverified behavior.
          Review only. Do not open pull requests, push branches, or modify any code."
          # Source discovery may also have crossed the deadline; do not submit late.
          CREATION_ALLOWED="$(python3 "$RUNNER_TEMP/jules-creation-gate.py")"
          [ "$CREATION_ALLOWED" = true ] || exit 0
          RESPONSE="$(curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -d "$(jq -n --arg prompt "$PROMPT" --arg source "$SOURCE" \
              --arg branch "$REF" --arg title "$TITLE" \
              '{prompt: $prompt, title: $title, sourceContext: {source: $source, githubRepoContext: {startingBranch: $branch}}}')" \
            'https://jules.googleapis.com/v1alpha/sessions')"
          SESSION_NAME="$(echo "$RESPONSE" | jq -r '.name // empty')"
          SESSION_URL="$(echo "$RESPONSE" | jq -r '.url // empty')"
          if [ -z "$SESSION_NAME" ]; then
            echo "::error::Failed to create Jules session: $RESPONSE"
            exit 1
          fi
          echo "session_name=$SESSION_NAME" >> "$GITHUB_OUTPUT"
          echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
          echo "Created session: $SESSION_NAME ($SESSION_URL)"

      - name: Wait for review to complete
        id: wait
        if: steps.jules.outputs.session_name != ''
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_NAME: ${{ steps.jules.outputs.session_name }}
        run: |
          set -euo pipefail
          STATE=""
          for i in $(seq 1 60); do
            STATE="$(curl -fsS -H "X-Goog-Api-Key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/$SESSION_NAME" | jq -r '.state // empty')"
            echo "Poll $i: state=$STATE"
            case "$STATE" in
              COMPLETED|FAILED|CANCELLED) break ;;
            esac
            sleep 20
          done
          echo "final_state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: always() && steps.retirement.outputs.creation_allowed == 'true' && steps.jules.outputs.creation_allowed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_NAME: ${{ steps.jules.outputs.session_name }}
          SESSION_URL: ${{ steps.jules.outputs.session_url }}
          FINAL_STATE: ${{ steps.wait.outputs.final_state }}
          MODE: ${{ steps.target.outputs.mode }}
          SHA: ${{ steps.target.outputs.sha }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          REVIEW=""
          if [ "$FINAL_STATE" = "COMPLETED" ] && [ -n "$SESSION_NAME" ]; then
            PAGE_TOKEN=""
            : > /tmp/jules-activities.jsonl
            while :; do
              ACTIVITIES="$(curl -fsS -G -H "X-Goog-Api-Key: $JULES_API_KEY" \
                --data-urlencode 'pageSize=100' --data-urlencode "pageToken=$PAGE_TOKEN" \
                "https://jules.googleapis.com/v1alpha/$SESSION_NAME/activities")"
              echo "$ACTIVITIES" | jq -c '.activities[]?' >> /tmp/jules-activities.jsonl
              PAGE_TOKEN="$(echo "$ACTIVITIES" | jq -r '.nextPageToken // empty')"
              [ -n "$PAGE_TOKEN" ] || break
            done
            REVIEW="$(jq -sr 'sort_by(.createTime) | [.[].agentMessaged.agentMessage
              | select(type == "string" and length > 0)] | last // empty' /tmp/jules-activities.jsonl)"
          fi
          {
            echo "## Jules code review (automated)"
            echo "Commit: \`$SHA\`"
            echo ""
            if [ -n "$REVIEW" ]; then
              echo "$REVIEW"
            elif [ "$FINAL_STATE" = "COMPLETED" ]; then
              echo "Jules finished the review, but the review text could not be extracted automatically."
            else
              echo "The Jules review did not complete (final state: ${FINAL_STATE:-unknown})."
            fi
            echo ""
            echo "---"
            if [ -n "$SESSION_URL" ] && [ "$SESSION_URL" != "null" ]; then
              echo "*Automated review by Jules. [View the full session]($SESSION_URL)*"
            else
              echo "*Automated review by Jules.*"
            fi
          } > /tmp/review.md
          if [ "$MODE" = "pr" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" -F /tmp/review.md
          else
            gh api --method POST "repos/$REPO/commits/$SHA/comments" -F body=@/tmp/review.md
          fi
          echo "Review comment posted."
