name: M2 actual-contact Phase A v1
on:
  push:
    branches: [qualification/m2-actual-contact-phase-a-v1]
    paths: [docs/experiments/m2-actual-contact-phase-a-v1/ACTIVATE.json]
permissions:
  contents: read
concurrency:
  group: m2-actual-contact-phase-a-v1
  cancel-in-progress: false
jobs:
  fixed-qualification:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.ref == 'refs/heads/qualification/m2-actual-contact-phase-a-v1' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SEAL_SHA256: cfcc18d678fa56083c5a6f832c7e0fd56e136fa19ac69e444bac824a70efc07d
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read exact activation and prepared parents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
          fetch-depth: 3
          lfs: false
          submodules: false
      - name: Read exact accepted research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3aec16df33861f1316d127736f5f60eea327ede
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Read pinned published reconstruction source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 80332c3a4b30a8a84f5bcb6a7ee0a20a47c7b19d
          path: reuse
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Read immutable V5 source capsule and manifest only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 849348efcd1191e2a69d96b33be15a4ecbace37d
          path: qualified-source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/experiments/m2-channel-native-play-recovery-list-v5/host-source-capsule.tar.gz
            /docs/experiments/m2-channel-native-play-recovery-list-v5/source-manifest.json
      - name: Admit and run the frozen zero-forward owner qualification once
        shell: bash
        run: python3 bundle/docs/experiments/m2-actual-contact-phase-a-v1/run_hosted.py
