name: M2 fixed source fixtures v2
on:
  push:
    branches: [qualification/m2-fixed-fixtures-v2]
    paths: [docs/experiments/m2-hosted-qualification-v2/ACTIVATE.json]
permissions:
  contents: read
concurrency:
  group: m2-fixed-fixtures-v2
  cancel-in-progress: false
jobs:
  fixed-fixtures:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.ref == 'refs/heads/qualification/m2-fixed-fixtures-v2' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [boredom, reflex]
    steps:
      - name: Read immutable source packet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
          fetch-depth: 2
          lfs: false
          submodules: false
      - name: Read exact accepted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3aec16df33861f1316d127736f5f60eea327ede
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Qualify exact disposable fixtures with private native output
        shell: bash
        env:
          EXPECTED_SEAL_SHA256: 84c4921137a9473519007679c2af8567c771341deba90d698cf4587480156f94
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 bundle/docs/experiments/m2-hosted-qualification-v2/run_hosted.py
          '${{ matrix.variant }}' "$GITHUB_WORKSPACE/source"
