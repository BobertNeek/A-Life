name: M2 fixed source fixtures v3
on:
  push:
    branches: [qualification/m2-fixed-fixtures-v3]
    paths: [docs/experiments/m2-hosted-qualification-v3/ACTIVATE.json]
permissions:
  contents: read
concurrency:
  group: m2-fixed-fixtures-v3
  cancel-in-progress: false
jobs:
  fixed-fixtures:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.ref == 'refs/heads/qualification/m2-fixed-fixtures-v3' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [boredom, reflex]
    env:
      EXPECTED_SEAL_SHA256: f8851a756d5e5420a286f854ec76362325d8cb46c89b30013be7dd3c39072110
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read immutable source packet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
          fetch-depth: 2
          lfs: false
          submodules: false
      - name: Read exact accepted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3aec16df33861f1316d127736f5f60eea327ede
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Install exact official toolchain using audited private-output adapter
        # Audited dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        # recipe, not an unmodified composite uses invocation (it tees raw output).
        shell: bash
        run: >-
          python3 bundle/docs/experiments/m2-hosted-qualification-v2/run_hosted.py
          --setup '${{ matrix.variant }}' "$GITHUB_WORKSPACE/source"
      - name: Qualify exact disposable fixtures with private native output
        shell: bash
        run: >-
          python3 bundle/docs/experiments/m2-hosted-qualification-v2/run_hosted.py
          '${{ matrix.variant }}' "$GITHUB_WORKSPACE/source"
