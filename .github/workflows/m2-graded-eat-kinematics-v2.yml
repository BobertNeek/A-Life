name: M2 contacted Eat kinematic matched regression v2
on:
  push:
    branches: [qualification/m2-graded-eat-kinematics-v2]
    paths: [docs/experiments/m2-graded-eat-kinematics-v2/ACTIVATE.json]
permissions:
  contents: read
concurrency:
  group: m2-graded-eat-kinematics-v2
  cancel-in-progress: false
jobs:
  fixed-qualification:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.ref == 'refs/heads/qualification/m2-graded-eat-kinematics-v2' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SEAL_SHA256: 1fb5298eb6c6e7bc0c81eb77f4b4dda9da9ec5e5cd413a4e9e335479eaed5563
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read exact activation and prepared parents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
          fetch-depth: 3
          lfs: false
          submodules: false
      - name: Read exact research source base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3aec16df33861f1316d127736f5f60eea327ede
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Admit and run frozen disposable qualification once
        shell: bash
        run: python3 bundle/docs/experiments/m2-graded-eat-kinematics-v2/run_hosted.py
