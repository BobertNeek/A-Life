name: M2 grip fixed fixtures v3
on:
  push:
    branches: [qualification/m2-grip-fixed-fixtures-v3]
    paths: [docs/experiments/m2-grip-fixed-fixtures-v3/ACTIVATE.json]
permissions:
  contents: read
concurrency:
  group: m2-grip-fixed-fixtures-v3
  cancel-in-progress: false
jobs:
  source-typecheck:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.ref == 'refs/heads/qualification/m2-grip-fixed-fixtures-v3' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SEAL_SHA256: 39bdfe1847b05567a7725eb58f6e03b6d3e03860c0fddba6f820d20dea1649dc
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read immutable grip source packet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
          fetch-depth: 2
          lfs: false
          submodules: false
      - name: Read exact accepted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3aec16df33861f1316d127736f5f60eea327ede
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Admit, restore, compile exact targets, list names, and run fixed fixtures once
        shell: bash
        run: python3 bundle/docs/experiments/m2-grip-fixed-fixtures-v3/run_hosted.py
