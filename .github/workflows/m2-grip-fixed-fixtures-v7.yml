name: M2 grip CPU upload contracts v7
on:
  push:
    branches: [qualification/m2-grip-fixed-fixtures-v7]
    paths: [docs/experiments/m2-grip-fixed-fixtures-v7/ACTIVATE.json]
permissions:
  contents: read
concurrency:
  group: m2-grip-fixed-fixtures-v7
  cancel-in-progress: false
jobs:
  source-typecheck:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.ref == 'refs/heads/qualification/m2-grip-fixed-fixtures-v7' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SEAL_SHA256: 29e33bfcc012012a19cf62eeebb4882af427eb14d171236bb5f0d6b58f57f144
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read immutable grip source packet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
          fetch-depth: 2
          lfs: false
          submodules: false
      - name: Read exact accepted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3aec16df33861f1316d127736f5f60eea327ede
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Admit, restore, compile exact targets, list names, and run fixed fixtures once
        shell: bash
        run: python3 bundle/docs/experiments/m2-grip-fixed-fixtures-v7/run_hosted.py
