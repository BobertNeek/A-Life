name: Pass 2 fast gates

on:
  push:
    branches: ["main", "codex/**", "phase3-**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      speech_cpu:
        description: Run the focused CPU speech regressions
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  speech-cpu-regressions:
    name: CPU speech regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: speech-cpu-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: target/speech-cpu
      RUST_MIN_STACK: "33554432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select relevant changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          OPT_IN: ${{ inputs.speech_cpu }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import fnmatch, os, subprocess
          patterns = (
              '.github/workflows/pass2-fast-gates.yml', 'scripts/check_speech_cpu.sh',
              'scripts/rust_env.sh', 'Cargo.toml', 'Cargo.lock', '.cargo/*',
              'crates/*/Cargo.toml', 'crates/alife_game_app/src/lib.rs',
              'crates/alife_game_app/src/bevy_shell.rs',
              'crates/alife_game_app/src/gpu_live_runtime.rs',
              'crates/alife_game_app/src/production_conversation_lineage_ui*',
              'crates/alife_game_app/src/production_voxel_renderer.rs',
              'crates/alife_game_app/src/production_voxel_renderer/care_dock*',
              'crates/alife_world/src/headless*', 'crates/alife_world/src/speech*',
              'crates/alife_world/src/persistent_voxel.rs', 'crates/alife_core/src/math.rs',
              'crates/alife_core/src/language*', 'crates/alife_semantic/src/translation*',
              'crates/alife_core/src/lib.rs', 'crates/alife_world/src/lib.rs',
              'crates/alife_semantic/src/lib.rs',
          )
          event, head = os.environ['EVENT'], os.environ['HEAD']
          base = os.environ['PR_BASE'] if event == 'pull_request' else os.environ['BEFORE']
          if event == 'workflow_dispatch':
              run = os.environ['OPT_IN'] == 'true'
          elif not base or set(base) == {'0'}:
              # New branches have no trustworthy before-SHA; do not miss a regression.
              run = True
          else:
              if event == 'pull_request':
                  base = subprocess.check_output(['git', 'merge-base', base, head], text=True).strip()
              paths = subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', base, head]).decode().split('\0')
              run = any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in patterns)
          print(f'Focused speech CPU tests selected: {run}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run={str(run).lower()}\n')
          PY

      - name: Install Rust
        if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux input build dependency
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config

      - name: Resolve compiler cache key
        if: steps.changes.outputs.run == 'true'
        id: compiler
        run: echo "key=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache focused CPU build
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/speech-cpu
          # One immutable cache per compiler/dependency/build configuration, not per commit.
          key: speech-cpu-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml', 'scripts/check_speech_cpu.sh') }}

      - name: Run focused CPU speech regressions
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/check_speech_cpu.sh

  host-fast-gates:
    name: Tier 0-1 host fast gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: List Tier 0-3 command surface
        shell: pwsh
        run: pwsh -NoProfile -File scripts/pass2_fast_gates.ps1 -List

      - name: Resolve Tier 0 cache key
        id: tier0-cache
        shell: pwsh
        run: |
          $key = (& pwsh -NoProfile -File scripts/pass2_fast_gates.ps1 -Tier 0 -ResolveCacheKey).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($key)) { exit 1 }
          "cache_key=$key" >> $env:GITHUB_OUTPUT

      - name: Restore Tier 0 receipt cache
        uses: actions/cache@v4
        with:
          path: target/artifacts/pass2/tier0
          key: ${{ steps.tier0-cache.outputs.cache_key }}

      - name: Run Tier 0 source gates
        shell: pwsh
        run: pwsh -NoProfile -File scripts/pass2_fast_gates.ps1 -Tier 0

      - name: Resolve Tier 1 cache key
        id: tier1-cache
        shell: pwsh
        run: |
          $key = (& pwsh -NoProfile -File scripts/pass2_fast_gates.ps1 -Tier 1 -ResolveCacheKey).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($key)) { exit 1 }
          "cache_key=$key" >> $env:GITHUB_OUTPUT

      - name: Restore Tier 1 receipt cache
        uses: actions/cache@v4
        with:
          path: target/artifacts/pass2/tier1
          key: ${{ steps.tier1-cache.outputs.cache_key }}

      - name: Run Tier 1 host smoke
        shell: pwsh
        run: pwsh -NoProfile -File scripts/pass2_fast_gates.ps1 -Tier 1

      - name: Upload compact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass2-fast-gate-receipts
          path: target/artifacts/pass2
          if-no-files-found: error
