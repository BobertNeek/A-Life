name: Portable save access controls

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["codex/preserve-save-permissions-20261105"]

permissions:
  contents: read

jobs:
  portable-save:
    name: Atomic portable save (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Preserve save content and native access controls
        run: cargo test --locked -p alife_world --test atomic_portable_save -- --nocapture
      - name: File-sync failure after a complete staged write
        run: cargo test --locked -p alife_world --lib persistence::atomic_save::tests::file_sync_failure_after_write_preserves_previous_save_and_recovery -- --nocapture
