name: PPO rollout diagnostics

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ppo-rollout-diagnostics.yml"
      - "crates/alife_world/src/headless.rs"
      - "crates/alife_world/src/organism.rs"
      - "crates/alife_world/tests/*signature.rs"
      - "crates/alife_core/src/foundation.rs"
      - "crates/alife_game_app/src/foundation_training.rs"
      - "crates/alife_game_app/src/foundation_training/**"
      - "scripts/*foundation_probe*.py"
      - "scripts/testdata/foundation_probe_sensory_v1.json"
      - "crates/alife_game_app/src/foundation_training_cycle.rs"
      - "crates/alife_game_app/src/foundation_training_cycle/**"
      - "crates/alife_game_app/src/foundation_archived_success_replay.rs"
      - "crates/alife_game_app/src/foundation_critic_correction.rs"
      - "crates/alife_game_app/src/foundation_critic_correction/**"
      - "crates/alife_game_app/src/critic_qualification.rs"
      - "crates/alife_training/src/ppo/critic_calibration.rs"
      - "crates/alife_training/src/ppo.rs"
      - "crates/alife_game_app/tests/actor_advantage_centering_cli.rs"
      - "crates/alife_game_app/src/bin/train_n2048_care.rs"
      - "crates/alife_training/shaders/critic_residual.wgsl"
      - "scripts/*ppo_diagnostics.py"
      - "scripts/*continued_critic.py"
      - "Cargo.toml"
      - "crates/alife_game_app/Cargo.toml"
      - "Cargo.lock"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ppo-rollout-diagnostics.yml"
      - "crates/alife_world/src/headless.rs"
      - "crates/alife_world/src/organism.rs"
      - "crates/alife_world/tests/*signature.rs"
      - "crates/alife_core/src/foundation.rs"
      - "crates/alife_game_app/src/foundation_training.rs"
      - "crates/alife_game_app/src/foundation_training/**"
      - "scripts/*foundation_probe*.py"
      - "scripts/testdata/foundation_probe_sensory_v1.json"
      - "crates/alife_game_app/src/foundation_training_cycle.rs"
      - "crates/alife_game_app/src/foundation_training_cycle/**"
      - "crates/alife_game_app/src/foundation_archived_success_replay.rs"
      - "crates/alife_game_app/src/foundation_critic_correction.rs"
      - "crates/alife_game_app/src/foundation_critic_correction/**"
      - "crates/alife_game_app/src/critic_qualification.rs"
      - "crates/alife_training/src/ppo/critic_calibration.rs"
      - "crates/alife_training/src/ppo.rs"
      - "crates/alife_game_app/tests/actor_advantage_centering_cli.rs"
      - "crates/alife_game_app/src/bin/train_n2048_care.rs"
      - "crates/alife_training/shaders/critic_residual.wgsl"
      - "scripts/*ppo_diagnostics.py"
      - "scripts/*continued_critic.py"
      - "Cargo.toml"
      - "crates/alife_game_app/Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  prepared-targets:
    name: Optional PPO targets and committed reporting CPU regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Policy-only comparison and rejected context/provenance differences
        run: python -m unittest discover -s scripts -p 'test_compare_foundation_probes.py' -v
      - name: Canonical world identity and narrowly projected policy-weight identity
        run: cargo test --locked -p alife_world --test headless_world_signature --test policy_weight_comparison_signature -- --test-threads=1
      - name: Native comparison receipt binds policy and executable without GPU work
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training::comparison_identity::tests -- --test-threads=1
      - name: Native sensory serialization matches the shared Python admission fixture
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training::lesson_trace::tests::native_sensory_json_matches_comparison_fixture -- --exact
      - name: Prepared values, advantages, disabled I/O and row cap
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_cycle::ppo_diagnostics::tests -- --test-threads=1
      - name: Actor-only centering preserves raw targets and full-batch windows
        run: cargo test --locked -p alife_training --lib ppo::tests::actor_ -- --test-threads=1
      - name: Actor-centering CLI rejects incompatible and unsealed sources without GPU work
        run: cargo test --locked -p alife_game_app --features foundation-training --test actor_advantage_centering_cli -- --test-threads=1
      - name: Sealing, exact signed targets and copied diagnostic reporting
        run: python -m unittest discover -s scripts -p 'test_summarize_ppo_diagnostics.py' -v
      - name: Native checkpoint admission rejects truncated, swapped and stale artifacts
        run: cargo test --locked -p alife_game_app --features foundation-training --lib checkpoint_only_ -- --test-threads=1
      - name: Preserved critic correction admission CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_critic_correction::tests -- --test-threads=1
      - name: Residual checkpoint admission and preserved continuation CPU tests
        run: |
          cargo test --locked -p alife_game_app --features foundation-training --lib residual_checkpoint_ -- --test-threads=1
          cargo test --locked -p alife_game_app --features foundation-training --lib inspection_binds_declared_residual_sidecar_before_archive_loading -- --test-threads=1
          cargo test --locked -p alife_game_app --features foundation-training --lib terrain_continuation_preserves_full_heads_and_rejects_tampering -- --test-threads=1
          cargo test --locked -p alife_game_app --features foundation-training --lib critic_correction_continuation_preserves_policy_actor_and_actual_critic_age -- --test-threads=1
      - name: Critic residual WGSL parse and validation
        run: cargo test --locked -p alife_training --lib ppo::critic_calibration::tests::residual_shader_parses_and_validates
      - name: Continued critic real boundaries, scalar derivatives and initial-window slices
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_cycle::critic_residual::tests -- --test-threads=1
      - name: Continued critic separate validation gates
        run: python -m unittest discover -s scripts -p 'test_qualify_continued_critic.py' -v
      - name: Critic GPU fixture rejects nonfinite observations and expectations
        run: cargo test --locked -p alife_game_app --features foundation-training --lib critic_qualification::fixture_tests -- --test-threads=1
