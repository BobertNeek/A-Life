name: Qualia Contact211 F0 source check

"on":
  push:
    branches: ["bob/qualia-contact211-f0-check-20261127"]
    paths:
      - ".github/workflows/qualia-contact211-f0-check.yml"
      - "docs/r41-saved-life/contact211-f0-source.patch"
      - "docs/r41-saved-life/contact211-f0-source-pins.json"

permissions:
  contents: read

concurrency:
  group: qualia-contact211-f0-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-only:
    if: github.repository == 'BobertNeek/A-Life' && github.ref == 'refs/heads/bob/qualia-contact211-f0-check-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    defaults:
      run:
        shell: bash
    env:
      PIN_B00: b00de30b27b8d501c5e01f8df527ffa3471a2d10
      PIN_TREE: a1f474ce9feb2dd70356d93004698525fe7d2bad
      PIN_LEGACY_PARENT: 7a5061285be79275d914f3f8852eaace75c9af1b
      PIN_SOURCE: f466b83791cccb97568e6f718b92b052999cfb2b
      PIN_ANCHOR: c5d250178cb70a10f99f78ebcc974e0ad5533b41
      PIN_RESEARCH: 0cd14f12a8012a9b00119a7b33939ca5e3dbeb53
      PIN_SOURCE_MANIFEST: 16a63a8f3fb12262f7da2830e3721fc727e20073a8795e91ccfb0765913288ad
      PIN_RESTORE: bd554f6fa39054ddc08d17487e18ee4edc314c249eabfad2261bf8c1a53c3cef
      PIN_RESEARCH_PATCH: 3dcf657b2b1149a7da52e7867c3bdbc4c4dfe8d4785b53c95f429c78aa1cd490
      PIN_REPAIR_PATCH: c2815992c4e3e70a7b7bc42b307dc1d96e8c34483ea36cf2c98e06b9920282e6
      PIN_LEGACY_PATCH: 692ec25acc620f502581e7299d952471c039812646e41f85cdd1d6f87ed5c66d
      PIN_V2_PATCH: f0a836086d20e47e434eb947ebc9083f52dc50c344403d24e8ede08ae23ad657
      PIN_V2_LEAVES: 0ca357bc54e8d997c1f3d12a3cbe697959d87c910f8ac257b9019febeb157349
      PIN_LOCK: 155699e9274f8890bc8c335669a62de48203ba315a33388a8f0caca71f0f7f37
      PIN_F0_PATCH: dab4a38f54fba616f9d789cd9e1b4853b09eee5229da91362b29be6aab686cde
      PIN_F0_LEAVES: a1fc172b35206dffedd1c593cc1f890dab6fda0b287420d8cf5bc1c531b64ac7
      PIN_RUSTC: 0ef1bc386059596dada8fb65b50425aab2ea637a
      RUST_TOOLCHAIN: "1.100.0"
      TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
    steps:
      - name: Check out candidate commit with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact B00 tree and source-only push, then authenticate emitted closure
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $PIN_B00"
          test "$(git rev-parse "$PIN_B00^{tree}")" = "$PIN_TREE"
          git merge-base --is-ancestor "$PIN_SOURCE" "$PIN_LEGACY_PARENT"
          git merge-base --is-ancestor "$PIN_RESEARCH" "$PIN_LEGACY_PARENT"
          git merge-base --is-ancestor "$PIN_LEGACY_PARENT" "$PIN_B00"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          workflow='.github/workflows/qualia-contact211-f0-check.yml'
          docs='docs/r41-saved-life'
          overlay="$docs/contact211-f0-source.patch"
          leaves="$docs/contact211-f0-source-pins.json"
          diff -u <(printf 'A\t%s\n' "$workflow" "$overlay" "$leaves" | sort) \
            <(git diff --name-status --no-renames "$PIN_B00" HEAD | sort)
          for path in "$workflow" "$overlay" "$leaves"; do
            test -f "$path" && test ! -L "$path"
            test "$(git ls-tree HEAD -- "$path" | cut -d' ' -f1)" = 100644
          done
          printf '%s  %s\n' "$PIN_F0_PATCH" "$overlay" "$PIN_F0_LEAVES" "$leaves" | sha256sum -c -

          exact="$RUNNER_TEMP/qualia-contact211-f0-exact"
          layer="$RUNNER_TEMP/qualia-contact211-f0-layers"
          evidence="$RUNNER_TEMP/qualia-contact211-f0-evidence"
          build="$RUNNER_TEMP/qualia-contact211-f0-target"
          mkdir "$layer" "$evidence"
          git show "$PIN_SOURCE:$docs/restore_source.py" > "$layer/restore_source.py"
          git show "$PIN_SOURCE:$docs/SOURCE.json" > "$layer/SOURCE.json"
          mapfile -t diffs < <(git ls-tree -r --name-only "$PIN_SOURCE" -- "$docs/patches" | sort)
          test "${#diffs[@]}" -eq 69
          for path in "${diffs[@]}"; do
            case "$path" in "$docs/patches/"*.patch) ;; *) exit 1;; esac
            rel="${path#"$docs"/}"
            mkdir -p "$layer/$(dirname "$rel")"
            git show "$PIN_SOURCE:$path" > "$layer/$rel"
          done
          git show "$PIN_RESEARCH:$docs/research-catalog-source-only.patch" > "$layer/research.patch"
          git show "$PIN_LEGACY_PARENT:$docs/sleep-boundary-repair-source.patch" > "$layer/repair.patch"
          git show "$PIN_LEGACY_PARENT:$docs/sleep-legacy-publication-source.patch" > "$layer/legacy.patch"
          git show "$PIN_B00:$docs/retained-language-pilot-source.patch" > "$layer/v2.patch"
          git show "$PIN_B00:$docs/retained-language-pilot-source-pins.json" > "$layer/v2-pins.json"
          printf '%s  %s\n' \
            "$PIN_RESTORE" "$layer/restore_source.py" "$PIN_SOURCE_MANIFEST" "$layer/SOURCE.json" \
            "$PIN_RESEARCH_PATCH" "$layer/research.patch" "$PIN_REPAIR_PATCH" "$layer/repair.patch" \
            "$PIN_LEGACY_PATCH" "$layer/legacy.patch" "$PIN_V2_PATCH" "$layer/v2.patch" \
            "$PIN_V2_LEAVES" "$layer/v2-pins.json" | sha256sum -c - | tee "$evidence/qualification.txt"
          printf 'head=%s\nprior=%s\nprior_tree=%s\nF0_patch_sha256=%s\n' \
            "$GITHUB_SHA" "$PIN_B00" "$PIN_TREE" "$PIN_F0_PATCH" | tee -a "$evidence/qualification.txt"
          python3 -I "$layer/restore_source.py" "$GITHUB_WORKSPACE" "$exact" | tee -a "$evidence/qualification.txt"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$PIN_ANCHOR")" = "$PIN_ANCHOR"
          cd "$exact"
          for patch in "$layer/research.patch" "$layer/repair.patch" "$layer/legacy.patch"; do
            git apply --check "$patch"
            git apply "$patch"
          done

          python3 -I - "$layer/v2-pins.json" "$layer/v2.patch" \
            "$GITHUB_WORKSPACE/$leaves" "$GITHUB_WORKSPACE/$overlay" "$layer/checked-tree.json" <<'PY' | tee -a "$evidence/qualification.txt"
          from hashlib import sha256
          import json, os, pathlib, re, subprocess, sys

          def require(condition, label):
              if not condition:
                  raise SystemExit(f'Contact211 F0 source check refused: {label}')

          root = pathlib.Path.cwd()
          v2_json, v2_patch, f0_json, f0_patch, checked_tree = map(pathlib.Path, sys.argv[1:])
          v2 = json.loads(v2_json.read_bytes())
          f0 = json.loads(f0_json.read_bytes())

          modified = {
              'crates/alife_game_app/Cargo.toml',
              'crates/alife_game_app/src/gpu_live_runtime.rs',
              'crates/alife_game_app/src/gpu_live_runtime/staged_tick.rs',
              'crates/alife_gpu_backend/Cargo.toml',
              'crates/alife_gpu_backend/src/closed_loop_pipeline.rs',
              'crates/alife_gpu_backend/src/closed_loop_runtime.rs',
              'crates/alife_gpu_backend/src/closed_loop_runtime/tick.rs',
              'crates/alife_gpu_backend/src/training_rollout.rs',
              'crates/alife_world/Cargo.toml',
              'crates/alife_world/src/candidate_enumerator.rs',
              'crates/alife_world/src/headless.rs',
          }
          added = {
              'crates/alife_game_app/src/gpu_live_runtime/contact211_f0_witness.rs',
              'crates/alife_world/src/headless/contact211_witness.rs',
          }
          shaders = {
              'crates/alife_gpu_backend/shaders/closed_loop_decode.wgsl',
              'crates/alife_gpu_backend/shaders/closed_loop_memory_context.wgsl',
              'crates/alife_gpu_backend/shaders/training_rollout.wgsl',
          }
          before = f0['overlaid_source_before_sha256']
          after = f0['overlaid_source_after_sha256']
          shader_pins = f0['unchanged_shaders_sha256']
          require(f0['schema'] == 'qualia.contact211_f0_compile_source.v1'
                  and f0['prior_commit'] == os.environ['PIN_B00']
                  and f0['prior_tree'] == os.environ['PIN_TREE']
                  and f0['forward_sha256'] == os.environ['PIN_F0_PATCH']
                  and f0['lock_sha256'] == os.environ['PIN_LOCK']
                  and f0['policy_or_native_result'] is False
                  and set(before) == modified and set(after) == modified | added
                  and set(shader_pins) == shaders, 'independent exact F0 leaf allowlist')
          require(sha256(f0_patch.read_bytes()).hexdigest() == os.environ['PIN_F0_PATCH'], 'overlay bytes')
          headers = [l for l in f0_patch.read_text().splitlines() if l.startswith('diff --git ')]
          path_pattern = re.compile(r'diff --git a/([a-zA-Z0-9_./-]+) b/([a-zA-Z0-9_./-]+)')
          names = []
          for line in headers:
              m = path_pattern.fullmatch(line)
              require(m is not None and m[1] == m[2], 'patch header shape')
              names.append(m[1])
          require(len(names) == 13 and set(names) == modified | added, 'patch target allowlist')

          def digest(rel):
              path = root / rel
              require(not path.is_symlink(), f'symlink {rel}')
              return sha256(path.read_bytes()).hexdigest() if path.is_file() else None

          def verify(pins, label):
              for path, want in sorted(pins.items()):
                  require(digest(path) == want, f'{label}: {path}')

          def apply(patch):
              subprocess.run(['git', 'apply', '--check', str(patch)], cwd=root, check=True)
              subprocess.run(['git', 'apply', str(patch)], cwd=root, check=True)

          v2_leaves = v2['changed_source_leaves']
          catalog = 'crates/alife_game_app/src/foundation_training_cycle/saved_life_retention/research_catalog.rs'
          require(len(v2_leaves) == 6 and sum(x['parent_sha256'] is None for x in v2_leaves.values()) == 1,
                  'v2 historical leaf shape')
          for phase in ('parent', 'result'):
              if phase == 'result':
                  apply(v2_patch)
              verify({path: pins[phase + '_sha256'] for path, pins in v2_leaves.items()}
                     | {catalog: v2['research_catalog_unchanged_sha256']}, f'v2 {phase}')
          verify(before | shader_pins | {'Cargo.lock': os.environ['PIN_LOCK']}, 'authentic B00 emitted preimage')
          require(all(digest(p) is None and not (root / p).exists() for p in added), 'F0 new files already present')

          def tree():
              nodes = list(root.rglob('*'))
              require(not any(p.is_symlink() for p in nodes), 'symlink in restored closure')
              return {p.relative_to(root).as_posix(): sha256(p.read_bytes()).hexdigest()
                      for p in nodes if p.is_file()}

          source_before = tree()
          apply(f0_patch)
          verify(after | shader_pins | {'Cargo.lock': os.environ['PIN_LOCK']}, 'exact F0 postimage')
          source_after = tree()
          changed = {p for p in source_before.keys() | source_after.keys() if source_before.get(p) != source_after.get(p)}
          require(changed == modified | added and set(source_after) - set(source_before) == added,
                  'whole reconstructed tree diff outside exact 13-leaf allowlist')
          subprocess.run(['git', 'apply', '--reverse', '--check', str(f0_patch)], cwd=root, check=True)
          checked_tree.write_text(json.dumps(source_after, sort_keys=True) + '\n')
          print('status=source+locks+three_shaders_authenticated; restored_827+historical_layers+exact_13_leaf_f0')
          PY
          printf 'EXACT_SRC=%s\nCARGO_TARGET_DIR=%s\nF0_LAYER=%s\nF0_EVIDENCE=%s\n' \
            "$exact" "$build" "$layer" "$evidence" >> "$GITHUB_ENV"

      - name: Check shared CLI in both feature configurations without executing it
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          version="$(rustc +"$RUST_TOOLCHAIN" -vV)"
          grep -Fqx "release: $RUST_TOOLCHAIN" <<< "$version"
          grep -Fqx "commit-hash: $PIN_RUSTC" <<< "$version"
          grep -Fqx "host: $TARGET" <<< "$version"
          printf '%s\n' "$version" | tee -a "$F0_EVIDENCE/qualification.txt"
          cd "$EXACT_SRC"
          timeout 8m cargo +"$RUST_TOOLCHAIN" fetch --locked --target "$TARGET"
          for mode in off on; do
            features=retained-language-pilot
            if [[ "$mode" == on ]]; then features=retained-language-pilot,contact211-witness; fi
            timeout 17m cargo +"$RUST_TOOLCHAIN" check --frozen --offline --no-default-features \
              --target "$TARGET" -j 1 -p alife_game_app --features "$features" \
              --bin evaluate_saved_life_retention
            printf 'cargo_check_%s=PASS features=%s\n' "$mode" "$features" | tee -a "$F0_EVIDENCE/qualification.txt"
          done
          python3 -I - "$F0_LAYER/checked-tree.json" <<'PY'
          from hashlib import sha256
          import json, pathlib, sys
          root = pathlib.Path.cwd()
          expected = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          nodes = list(root.rglob('*'))
          if any(p.is_symlink() for p in nodes):
              raise SystemExit('compile/check modified source symlinks')
          actual = {p.relative_to(root).as_posix(): sha256(p.read_bytes()).hexdigest()
                    for p in nodes if p.is_file()}
          if actual != expected:
              raise SystemExit('compile/check modified restored source; refusing qualification')
          PY
          printf 'authority=compile_only\ngame_binary_executed=false\nprivate_data_uploaded=false\n' \
            | tee -a "$F0_EVIDENCE/qualification.txt"

      - name: Retain only narrow source verification and Cargo check receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualia-contact211-f0-check-${{ github.sha }}
          path: ${{ runner.temp }}/qualia-contact211-f0-evidence/qualification.txt
          if-no-files-found: error
          retention-days: 5
