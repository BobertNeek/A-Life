name: Qualia Contact211 strict source qualification

"on":
  push:
    branches: ["bob/qualia-contact211-strict-check-20261127"]
    paths:
      - ".github/workflows/qualia-contact211-strict-check.yml"
      - "docs/r41-saved-life/contact211-strict-source.patch"
      - "docs/r41-saved-life/contact211-strict-source-pins.json"
      - "docs/r41-saved-life/contact211-strict-source-check.py"

permissions:
  contents: read

concurrency:
  group: qualia-contact211-strict-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-source-executable:
    if: github.repository == 'BobertNeek/A-Life' && github.ref == 'refs/heads/bob/qualia-contact211-strict-check-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 63
    defaults:
      run:
        shell: bash
    env:
      PIN_PARENT: 8aef03ea2608b82ce24261400961b3b16b04789c
      PIN_PARENT_TREE: b095273c292495b86e9409ac713f97c250a74888
      PIN_B00: b00de30b27b8d501c5e01f8df527ffa3471a2d10
      PIN_TREE: a1f474ce9feb2dd70356d93004698525fe7d2bad
      PIN_LEGACY_PARENT: 7a5061285be79275d914f3f8852eaace75c9af1b
      PIN_SOURCE: f466b83791cccb97568e6f718b92b052999cfb2b
      PIN_ANCHOR: c5d250178cb70a10f99f78ebcc974e0ad5533b41
      PIN_RESEARCH: 0cd14f12a8012a9b00119a7b33939ca5e3dbeb53
      PIN_SOURCE_MANIFEST: 16a63a8f3fb12262f7da2830e3721fc727e20073a8795e91ccfb0765913288ad
      PIN_RESTORE: bd554f6fa39054ddc08d17487e18ee4edc314c249eabfad2261bf8c1a53c3cef
      PIN_RESEARCH_PATCH: 3dcf657b2b1149a7da52e7867c3bdbc4c4dfe8d4785b53c95f429c78aa1cd490
      PIN_REPAIR_PATCH: c2815992c4e3e70a7b7bc42b307dc1d96e8c34483ea36cf2c98e06b9920282e6
      PIN_LEGACY_PATCH: 692ec25acc620f502581e7299d952471c039812646e41f85cdd1d6f87ed5c66d
      PIN_V2_PATCH: f0a836086d20e47e434eb947ebc9083f52dc50c344403d24e8ede08ae23ad657
      PIN_V2_LEAVES: 0ca357bc54e8d997c1f3d12a3cbe697959d87c910f8ac257b9019febeb157349
      PIN_LOCK: 155699e9274f8890bc8c335669a62de48203ba315a33388a8f0caca71f0f7f37
      PIN_F0_PATCH: dab4a38f54fba616f9d789cd9e1b4853b09eee5229da91362b29be6aab686cde
      PIN_F0_LEAVES: a1fc172b35206dffedd1c593cc1f890dab6fda0b287420d8cf5bc1c531b64ac7
      PIN_STRICT_PATCH: 18ac5322a3e41e2c6ff1e67cf4c9b7eb0d3d3a4cbfbb9f002add7b60e3b43c77
      PIN_STRICT_LEAVES: 87dac60cf9f540a60a400aa235d798716645cc778648d8ef85fb0b7cf8718791
      PIN_STRICT_CHECK: 907535345f3ab9c85ab7c7f78ee66cc3d680cecf974ce6c337f59a96d82dde84
      PIN_RUSTC: 0ef1bc386059596dada8fb65b50425aab2ea637a
      RUST_TOOLCHAIN: "1.100.0"
      TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
    steps:
      - name: Check out candidate commit with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify direct F0 parent and exact four-leaf push, then authenticate emitted closure
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $PIN_PARENT"
          test "$(git rev-parse "$PIN_PARENT^{tree}")" = "$PIN_PARENT_TREE"
          test "$(git rev-list --parents -n 1 "$PIN_PARENT")" = "$PIN_PARENT $PIN_B00"
          test "$(git rev-parse "$PIN_B00^{tree}")" = "$PIN_TREE"
          git merge-base --is-ancestor "$PIN_SOURCE" "$PIN_LEGACY_PARENT"
          git merge-base --is-ancestor "$PIN_RESEARCH" "$PIN_LEGACY_PARENT"
          git merge-base --is-ancestor "$PIN_LEGACY_PARENT" "$PIN_B00"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          workflow='.github/workflows/qualia-contact211-strict-check.yml'
          docs='docs/r41-saved-life'
          overlay="$docs/contact211-f0-source.patch"
          leaves="$docs/contact211-f0-source-pins.json"
          strict_overlay="$docs/contact211-strict-source.patch"
          strict_leaves="$docs/contact211-strict-source-pins.json"
          strict_check="$docs/contact211-strict-source-check.py"
          diff -u <(printf 'A\t%s\n' "$workflow" "$strict_overlay" "$strict_leaves" "$strict_check" | sort) \
            <(git diff --name-status --no-renames "$PIN_PARENT" HEAD | sort)
          for path in "$workflow" "$strict_overlay" "$strict_leaves" "$strict_check" "$overlay" "$leaves"; do
            test -f "$path" && test ! -L "$path"
            test "$(git ls-tree HEAD -- "$path" | cut -d' ' -f1)" = 100644
          done
          printf '%s  %s\n' \
            "$PIN_F0_PATCH" "$overlay" "$PIN_F0_LEAVES" "$leaves" \
            "$PIN_STRICT_PATCH" "$strict_overlay" "$PIN_STRICT_LEAVES" "$strict_leaves" "$PIN_STRICT_CHECK" "$strict_check" | sha256sum -c -

          exact="$RUNNER_TEMP/qualia-contact211-strict-exact"
          layer="$RUNNER_TEMP/qualia-contact211-strict-layers"
          evidence="$RUNNER_TEMP/qualia-contact211-strict-evidence"
          build="$RUNNER_TEMP/qualia-contact211-strict-target"
          mkdir "$layer" "$evidence"
          git show "$PIN_SOURCE:$docs/restore_source.py" > "$layer/restore_source.py"
          git show "$PIN_SOURCE:$docs/SOURCE.json" > "$layer/SOURCE.json"
          mapfile -t diffs < <(git ls-tree -r --name-only "$PIN_SOURCE" -- "$docs/patches" | sort)
          test "${#diffs[@]}" -eq 69
          for path in "${diffs[@]}"; do
            case "$path" in "$docs/patches/"*.patch) ;; *) exit 1;; esac
            rel="${path#"$docs"/}"
            mkdir -p "$layer/$(dirname "$rel")"
            git show "$PIN_SOURCE:$path" > "$layer/$rel"
          done
          git show "$PIN_RESEARCH:$docs/research-catalog-source-only.patch" > "$layer/research.patch"
          git show "$PIN_LEGACY_PARENT:$docs/sleep-boundary-repair-source.patch" > "$layer/repair.patch"
          git show "$PIN_LEGACY_PARENT:$docs/sleep-legacy-publication-source.patch" > "$layer/legacy.patch"
          git show "$PIN_B00:$docs/retained-language-pilot-source.patch" > "$layer/v2.patch"
          git show "$PIN_B00:$docs/retained-language-pilot-source-pins.json" > "$layer/v2-pins.json"
          printf '%s  %s\n' \
            "$PIN_RESTORE" "$layer/restore_source.py" "$PIN_SOURCE_MANIFEST" "$layer/SOURCE.json" \
            "$PIN_RESEARCH_PATCH" "$layer/research.patch" "$PIN_REPAIR_PATCH" "$layer/repair.patch" \
            "$PIN_LEGACY_PATCH" "$layer/legacy.patch" "$PIN_V2_PATCH" "$layer/v2.patch" \
            "$PIN_V2_LEAVES" "$layer/v2-pins.json" | sha256sum -c - | tee "$evidence/qualification.txt"
          printf 'head=%s\nactual_parent=%s\nactual_parent_tree=%s\nstrict_patch_sha256=%s\nstrict_pins_sha256=%s\n' \
            "$GITHUB_SHA" "$PIN_PARENT" "$PIN_PARENT_TREE" "$PIN_STRICT_PATCH" "$PIN_STRICT_LEAVES" | tee -a "$evidence/qualification.txt"
          printf 'head=%s\nprior=%s\nprior_tree=%s\nF0_patch_sha256=%s\n' \
            "$GITHUB_SHA" "$PIN_B00" "$PIN_TREE" "$PIN_F0_PATCH" | tee -a "$evidence/qualification.txt"
          python3 -I "$layer/restore_source.py" "$GITHUB_WORKSPACE" "$exact" | tee -a "$evidence/qualification.txt"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$PIN_ANCHOR")" = "$PIN_ANCHOR"
          cd "$exact"
          for patch in "$layer/research.patch" "$layer/repair.patch" "$layer/legacy.patch"; do
            git apply --check "$patch"
            git apply "$patch"
          done

          python3 -I - "$layer/v2-pins.json" "$layer/v2.patch" \
            "$GITHUB_WORKSPACE/$leaves" "$GITHUB_WORKSPACE/$overlay" \
            "$GITHUB_WORKSPACE/$strict_leaves" "$GITHUB_WORKSPACE/$strict_overlay" \
            "$layer/checked-tree.json" <<'PY' | tee -a "$evidence/qualification.txt"
          from hashlib import sha256
          import json, os, pathlib, re, subprocess, sys

          def require(condition, label):
              if not condition:
                  raise SystemExit(f'Contact211 F0 source check refused: {label}')

          root = pathlib.Path.cwd()
          v2_json, v2_patch, f0_json, f0_patch, strict_json, strict_patch, checked_tree = map(pathlib.Path, sys.argv[1:])
          v2 = json.loads(v2_json.read_bytes())
          f0 = json.loads(f0_json.read_bytes())

          modified = {
              'crates/alife_game_app/Cargo.toml',
              'crates/alife_game_app/src/gpu_live_runtime.rs',
              'crates/alife_game_app/src/gpu_live_runtime/staged_tick.rs',
              'crates/alife_gpu_backend/Cargo.toml',
              'crates/alife_gpu_backend/src/closed_loop_pipeline.rs',
              'crates/alife_gpu_backend/src/closed_loop_runtime.rs',
              'crates/alife_gpu_backend/src/closed_loop_runtime/tick.rs',
              'crates/alife_gpu_backend/src/training_rollout.rs',
              'crates/alife_world/Cargo.toml',
              'crates/alife_world/src/candidate_enumerator.rs',
              'crates/alife_world/src/headless.rs',
          }
          added = {
              'crates/alife_game_app/src/gpu_live_runtime/contact211_f0_witness.rs',
              'crates/alife_world/src/headless/contact211_witness.rs',
          }
          shaders = {
              'crates/alife_gpu_backend/shaders/closed_loop_decode.wgsl',
              'crates/alife_gpu_backend/shaders/closed_loop_memory_context.wgsl',
              'crates/alife_gpu_backend/shaders/training_rollout.wgsl',
          }
          before = f0['overlaid_source_before_sha256']
          after = f0['overlaid_source_after_sha256']
          shader_pins = f0['unchanged_shaders_sha256']
          require(f0['schema'] == 'qualia.contact211_f0_compile_source.v1'
                  and f0['prior_commit'] == os.environ['PIN_B00']
                  and f0['prior_tree'] == os.environ['PIN_TREE']
                  and f0['forward_sha256'] == os.environ['PIN_F0_PATCH']
                  and f0['lock_sha256'] == os.environ['PIN_LOCK']
                  and f0['policy_or_native_result'] is False
                  and set(before) == modified and set(after) == modified | added
                  and set(shader_pins) == shaders, 'independent exact F0 leaf allowlist')
          require(sha256(f0_patch.read_bytes()).hexdigest() == os.environ['PIN_F0_PATCH'], 'overlay bytes')
          headers = [l for l in f0_patch.read_text().splitlines() if l.startswith('diff --git ')]
          path_pattern = re.compile(r'diff --git a/([a-zA-Z0-9_./-]+) b/([a-zA-Z0-9_./-]+)')
          names = []
          for line in headers:
              m = path_pattern.fullmatch(line)
              require(m is not None and m[1] == m[2], 'patch header shape')
              names.append(m[1])
          require(len(names) == 13 and set(names) == modified | added, 'patch target allowlist')

          def digest(rel):
              path = root / rel
              require(not path.is_symlink(), f'symlink {rel}')
              return sha256(path.read_bytes()).hexdigest() if path.is_file() else None

          def verify(pins, label):
              for path, want in sorted(pins.items()):
                  require(digest(path) == want, f'{label}: {path}')

          def apply(patch):
              subprocess.run(['git', 'apply', '--check', str(patch)], cwd=root, check=True)
              subprocess.run(['git', 'apply', str(patch)], cwd=root, check=True)

          v2_leaves = v2['changed_source_leaves']
          catalog = 'crates/alife_game_app/src/foundation_training_cycle/saved_life_retention/research_catalog.rs'
          require(len(v2_leaves) == 6 and sum(x['parent_sha256'] is None for x in v2_leaves.values()) == 1,
                  'v2 historical leaf shape')
          for phase in ('parent', 'result'):
              if phase == 'result':
                  apply(v2_patch)
              verify({path: pins[phase + '_sha256'] for path, pins in v2_leaves.items()}
                     | {catalog: v2['research_catalog_unchanged_sha256']}, f'v2 {phase}')
          verify(before | shader_pins | {'Cargo.lock': os.environ['PIN_LOCK']}, 'authentic B00 emitted preimage')
          require(all(digest(p) is None and not (root / p).exists() for p in added), 'F0 new files already present')

          def tree():
              nodes = list(root.rglob('*'))
              require(not any(p.is_symlink() for p in nodes), 'symlink in restored closure')
              return {p.relative_to(root).as_posix(): sha256(p.read_bytes()).hexdigest()
                      for p in nodes if p.is_file()}

          source_before = tree()
          apply(f0_patch)
          verify(after | shader_pins | {'Cargo.lock': os.environ['PIN_LOCK']}, 'exact F0 postimage')
          source_after = tree()
          changed = {p for p in source_before.keys() | source_after.keys() if source_before.get(p) != source_after.get(p)}
          require(changed == modified | added and set(source_after) - set(source_before) == added,
                  'whole reconstructed tree diff outside exact 13-leaf allowlist')
          subprocess.run(['git', 'apply', '--reverse', '--check', str(f0_patch)], cwd=root, check=True)
          print('status=source+locks+three_shaders_authenticated; restored_827+historical_layers+exact_13_leaf_f0')

          strict = json.loads(strict_json.read_bytes())
          app = 'crates/alife_game_app/src/'
          strict_modified = {
              app + 'gpu_live_runtime.rs',
              app + 'gpu_live_runtime/contact211_f0_witness.rs',
              app + 'gpu_live_runtime/staged_tick.rs',
              app + 'foundation_training_cycle/saved_life_retention.rs',
              app + 'foundation_training_cycle/saved_life_retention/experiments.rs',
              'crates/alife_gpu_backend/src/closed_loop_runtime.rs',
          }
          strict_added = {app + 'foundation_training_cycle/saved_life_retention/contact211_parity.rs'}
          pre, post = strict['before_sha256'], strict['after_sha256']
          require(strict['official_or_native_ready'] is False and set(pre) == strict_modified
                  and set(post) == strict_modified | strict_added, 'independent exact strict source allowlist')
          require(sha256(strict_patch.read_bytes()).hexdigest() == os.environ['PIN_STRICT_PATCH']
                  and sha256(strict_json.read_bytes()).hexdigest() == os.environ['PIN_STRICT_LEAVES'],
                  'exact strict overlay and leaf bytes')
          headers = [path_pattern.fullmatch(l) for l in strict_patch.read_text().splitlines()
                     if l.startswith('diff --git ')]
          require(len(headers) == 7 and all(m is not None and m[1] == m[2] for m in headers)
                  and {m[1] for m in headers} == strict_modified | strict_added, 'strict patch target allowlist')
          verify(pre | shader_pins | {'Cargo.lock': os.environ['PIN_LOCK']}, 'exact strict preimage')
          require(all(digest(p) is None and not (root / p).exists() for p in strict_added), 'strict new file already present')
          apply(strict_patch)
          verify(post | shader_pins | {'Cargo.lock': os.environ['PIN_LOCK']}, 'exact strict postimage')
          strict_after = tree()
          changed = {p for p in source_after.keys() | strict_after.keys() if source_after.get(p) != strict_after.get(p)}
          require(changed == strict_modified | strict_added and set(strict_after) - set(source_after) == strict_added,
                  'whole reconstructed tree diff outside strict seven-leaf allowlist')
          subprocess.run(['git', 'apply', '--reverse', '--check', str(strict_patch)], cwd=root, check=True)
          checked_tree.write_text(json.dumps(strict_after, sort_keys=True) + '\n')
          print('status=strict_seven_leaf_source_and_exact_inverse_checked; frozen_lock+three_shaders_unchanged')
          PY
          python3 -I "$GITHUB_WORKSPACE/$strict_check" "$exact" | tee -a "$evidence/qualification.txt"
          test "$(grep -c '^DENIED ' "$evidence/qualification.txt")" = 7
          printf 'strict_source_negative_controls=7_PASS\n' | tee -a "$evidence/qualification.txt"
          printf 'EXACT_SRC=%s\nCARGO_TARGET_DIR=%s\nF0_LAYER=%s\nF0_EVIDENCE=%s\n' \
            "$exact" "$build" "$layer" "$evidence" >> "$GITHUB_ENV"

      - name: Check compile-time OFF, build exact observer-capable CLI once, never execute it
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          version="$(rustc +"$RUST_TOOLCHAIN" -vV)"
          grep -Fqx "release: $RUST_TOOLCHAIN" <<< "$version"
          grep -Fqx "commit-hash: $PIN_RUSTC" <<< "$version"
          grep -Fqx "host: $TARGET" <<< "$version"
          printf '%s\n' "$version" | tee -a "$F0_EVIDENCE/qualification.txt"
          cd "$EXACT_SRC"
          timeout 8m cargo +"$RUST_TOOLCHAIN" fetch --locked --target "$TARGET"
          timeout 18m cargo +"$RUST_TOOLCHAIN" check --frozen --offline --no-default-features \
            --target "$TARGET" -j 2 -p alife_game_app --features retained-language-pilot \
            --bin evaluate_saved_life_retention
          printf 'cargo_check_off=PASS features=retained-language-pilot binary_emitted=false\n' \
            | tee -a "$F0_EVIDENCE/qualification.txt"
          disk_available="$(df -PB1 "$CARGO_TARGET_DIR" | awk 'NR==2 {print $4}')"
          test "$disk_available" -ge 10737418240
          printf 'pre_observer_build_free_bytes=%s\n' "$disk_available" | tee -a "$F0_EVIDENCE/qualification.txt"
          timeout 38m cargo +"$RUST_TOOLCHAIN" build --frozen --offline --no-default-features \
            --target "$TARGET" -j 2 -p alife_game_app --features retained-language-pilot,contact211-witness \
            --bin evaluate_saved_life_retention
          printf 'cargo_build_on=PASS features=retained-language-pilot,contact211-witness profile=dev opt_level=1 debug=0 incremental=false\n' \
            | tee -a "$F0_EVIDENCE/qualification.txt"
          python3 -I - "$F0_LAYER/checked-tree.json" <<'PY'
          from hashlib import sha256
          import json, pathlib, sys
          root = pathlib.Path.cwd()
          expected = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          nodes = list(root.rglob('*'))
          if any(p.is_symlink() for p in nodes):
              raise SystemExit('compile/check modified source symlinks')
          actual = {p.relative_to(root).as_posix(): sha256(p.read_bytes()).hexdigest()
                    for p in nodes if p.is_file()}
          if actual != expected:
              raise SystemExit('compile/check modified restored source; refusing qualification')
          PY
          raw="$CARGO_TARGET_DIR/$TARGET/debug/evaluate_saved_life_retention"
          dst="$F0_EVIDENCE/evaluate_saved_life_retention"
          test -x "$raw" && test -f "$raw" && test ! -L "$raw" && test ! -e "$dst"
          bytes="$(stat -c %s "$raw")"
          test "$bytes" -ge 1048576 && test "$bytes" -le 268435456
          readelf -W -h "$raw" > "$F0_LAYER/elf-header.txt"
          grep -Eq 'Class:[[:space:]]+ELF64' "$F0_LAYER/elf-header.txt"
          grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' "$F0_LAYER/elf-header.txt"
          grep -Eq 'Type:[[:space:]]+(DYN|EXEC)' "$F0_LAYER/elf-header.txt"
          install -m 0755 "$raw" "$dst"
          cmp -s "$raw" "$dst"
          test -x "$dst" && test -f "$dst" && test ! -L "$dst"
          sha="$(sha256sum "$dst" | cut -d' ' -f1)"
          printf 'authority=source_build_only\ngame_binary_executed=false\nprivate_data_read_or_uploaded=false\n' \
            | tee -a "$F0_EVIDENCE/qualification.txt"
          printf 'executable_basename=evaluate_saved_life_retention\nexecutable_sha256=%s\nexecutable_bytes=%s\n' \
            "$sha" "$bytes" | tee -a "$F0_EVIDENCE/qualification.txt"
          printf 'source_tree_manifest_sha256=%s\nhost_%s\n' \
            "$(sha256sum "$F0_LAYER/checked-tree.json" | cut -d' ' -f1)" "$(getconf GNU_LIBC_VERSION)" \
            | tee -a "$F0_EVIDENCE/qualification.txt"
          readelf -W -n "$dst" | awk '/Build ID:/ {print "elf_build_id=" $NF}' | tee -a "$F0_EVIDENCE/qualification.txt"
          readelf -W -d "$dst" | awk '/NEEDED/ {print "elf_needed=" $NF}' | tee -a "$F0_EVIDENCE/qualification.txt"
          diff -u <(printf '%s\n' evaluate_saved_life_retention qualification.txt | sort) \
            <(find "$F0_EVIDENCE" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          printf 'runtime_off_parity=not_run; same_compiled_binary_stock_path_required_before_private_B\n' \
            | tee -a "$F0_EVIDENCE/qualification.txt"

      - name: Retain exactly the qualified source-build executable and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualia-contact211-strict-source-executable-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qualia-contact211-strict-evidence/qualification.txt
            ${{ runner.temp }}/qualia-contact211-strict-evidence/evaluate_saved_life_retention
          if-no-files-found: error
          compression-level: 3
          retention-days: 5
