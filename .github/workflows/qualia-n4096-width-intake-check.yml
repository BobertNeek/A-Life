            'patch_sha256':os.environ['PIN_H_FRAME_PATCH'],
            'source_pins_sha256':os.environ['PIN_H_FRAME_PINS'],
            'writer_predecessor_patch_sha256':os.environ['PIN_H_WRITER_PATCH'],
            'owned_prefix_predecessor_patch_sha256':os.environ['PIN_OWNER_PREFIX_PATCH'],
            'rust_release':os.environ['RUST_TOOLCHAIN'],
            'rust_commit':os.environ['PIN_RUSTC_COMMIT'],
            'default_off_checked':True, 'passed_cpu_tests':sorted(want),
            'naga_reflection_both_modules':True,
            'game_executable_or_device_or_private_input':False,
            'runnable_resident_or_save_or_score':False,
            'real_gpu_upload_or_native_submission':False,
          }
          (evidence/'proof.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          PY
          cd "$EVIDENCE"
          sha256sum build.log h-ordered-frame-tests.log proof.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(find . -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Retain only CPU qualification text
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualia-n4096-h-ordered-frame-cpu-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qualia-n4096-h-ordered-frame-evidence/build.log
            ${{ runner.temp }}/qualia-n4096-h-ordered-frame-evidence/h-ordered-frame-tests.log
            ${{ runner.temp }}/qualia-n4096-h-ordered-frame-evidence/proof.json
            ${{ runner.temp }}/qualia-n4096-h-ordered-frame-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 5
          compression-level: 3
