name: Qualia detached parked N4096 real H-only compiler and registry CPU qualification
on:
  push:
    branches: ["bob/qualia-n4096-parked-h-only-registry-source-20261128"]
    paths: [".github/workflows/qualia-n4096-width-intake-check.yml"]

permissions:
  contents: read

concurrency:
  group: qualia-n4096-width-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-only:
    if: github.ref == 'refs/heads/bob/qualia-n4096-parked-h-only-registry-source-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PIN_TRANSPORT_HEAD: a84098b683ff37067e7b79c090a93ab212ee5ce1
      PIN_H_ONLY_META: ede42cb6103512f488bee1cf0e80a1c114d1d1f60a9e3ffa177d8750c49972d7
      PIN_REGISTRY_META: 6f663d878e8a62a66ed24ce8c4f2d76dda2e1365fedbc8177dbc4fc966861b4b
      PIN_EXACT_EMITTED_WIDTH: d31f45d1f6b0157493080be9b89e45337d7cc4a7
      PIN_EXACT_EMITTED_WIDTH_TREE: 61dc2bf5226e87f3a3b92312708e254ff36d5d28
      PIN_PARKED_META: 63e7fc70c3b4ccbe9fbde78e2fe8d8efd05a31a33ddbb176608b14675024df56
      PIN_WIDTH_PARENT: 0319c7f76a4d6e60c62c93ec2558b197b94e139d
      PIN_WIDTH_PARENT_TREE: e4abafe0669bc503add8d455204acd0d1f1edd9e
      PIN_ORDINARY_META: c69bf0fee0d6c745d11937ca8aca06314d9db10f992211ebd7a15a41d03907ad
      PIN_V3_HOST: 8d90e0853cfbf991ac75e02c9ee55ee4cedc3c99
      PIN_V3_PARENT: befddaeaf1a96cf6fb9f3c70244b7970281222c8
      PIN_V3_FIRST: 5f0f31ad10a507a9e2c9d0352b39ef5fe3b87020
      PIN_V3_PARENT_TREE: 2ae2c3b2a8537c8039dcb53b8e7d0d87f5607e38
      PIN_V2_HOST: b00de30b27b8d501c5e01f8df527ffa3471a2d10
      PIN_V2_TREE: a1f474ce9feb2dd70356d93004698525fe7d2bad
      PIN_RESTORE_PARENT: 7a5061285be79275d914f3f8852eaace75c9af1b
      PIN_RESTORE_SOURCE: f466b83791cccb97568e6f718b92b052999cfb2b
      PIN_RESEARCH_COMMIT: 0cd14f12a8012a9b00119a7b33939ca5e3dbeb53
      PIN_RESEARCH_PATCH: 3dcf657b2b1149a7da52e7867c3bdbc4c4dfe8d4785b53c95f429c78aa1cd490
      PIN_REPAIR_PATCH: c2815992c4e3e70a7b7bc42b307dc1d96e8c34483ea36cf2c98e06b9920282e6
      PIN_LEGACY_PATCH: 692ec25acc620f502581e7299d952471c039812646e41f85cdd1d6f87ed5c66d
      PIN_V2_ADAPTER: f0a836086d20e47e434eb947ebc9083f52dc50c344403d24e8ede08ae23ad657
      PIN_V2_ADAPTER_GIT_BLOB: caadc6a85c1a3b9f0b8ae78b2ed8772211b8974d
      PIN_V2_LEAVES_GIT_BLOB: f5262a7072d2ff6ba35fc5d9cf14b7a3507fbb24
      PIN_V3_ADAPTER: fb5ae988ad61a8173dccb60f693ddb362d3984d5e7396c5ff7ac9906a5366970
      PIN_V3_LEAVES: 729e81c65d9f278a613d25ae78422fa8711fca15d85ca5bbe1e9162e51e869b0
      PIN_WIDTH_META: fdca7649342ca6b1f994aa25509f8d1a44e4c42d36ea86593278441df7463194
      PIN_LOCK: 155699e9274f8890bc8c335669a62de48203ba315a33388a8f0caca71f0f7f37
      PIN_RUSTC_COMMIT: 0ef1bc386059596dada8fb65b50425aab2ea637a
      RUST_TOOLCHAIN: "1.100.0"
      TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_INCREMENTAL: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact source-only event
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact Git parent, restored source, v2 and reversible v3 patches
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$PIN_TRANSPORT_HEAD"
          test "$(git show -s --format=%P "$PIN_TRANSPORT_HEAD")" = "$PIN_EXACT_EMITTED_WIDTH"
          diff -u <(printf '%s\n' \
            $'M\t.github/workflows/qualia-n4096-width-intake-check.yml' \
            $'A\tdocs/r41-saved-life/N4096-PARKED-H-ONLY-COMPILER.patch' \
            $'A\tdocs/r41-saved-life/H-ONLY-COMPILER-PINS.json' \
            $'A\tdocs/r41-saved-life/N4096-PARKED-NATIVE-REGISTRY.patch' \
            $'A\tdocs/r41-saved-life/NATIVE-REGISTRY-PINS.json' | LC_ALL=C sort) \
            <(git diff --name-status --no-renames "$PIN_TRANSPORT_HEAD" HEAD | LC_ALL=C sort)
          test "$(git rev-parse "$PIN_EXACT_EMITTED_WIDTH^{tree}")" = "$PIN_EXACT_EMITTED_WIDTH_TREE"
          test "$(git show -s --format=%P "$PIN_EXACT_EMITTED_WIDTH")" = "$PIN_WIDTH_PARENT"
          diff -u <(printf '%s\n' \
            $'M\t.github/workflows/qualia-n4096-width-intake-check.yml' \
            $'A\tdocs/r41-saved-life/N4096-PARKED-LIVE-TRANSPORT.patch' \
            $'A\tdocs/r41-saved-life/n4096-parked-transport-source-pins.v1.json' | LC_ALL=C sort) \
            <(git diff --name-status --no-renames "$PIN_EXACT_EMITTED_WIDTH" "$PIN_TRANSPORT_HEAD" | LC_ALL=C sort)
          test "$(git rev-parse "$PIN_WIDTH_PARENT^{tree}")" = "$PIN_WIDTH_PARENT_TREE"
          test "$(git show -s --format=%P "$PIN_WIDTH_PARENT")" = "$PIN_V3_HOST"
          diff -u <(printf '%s\n' \
            $'M\t.github/workflows/qualia-n4096-width-intake-check.yml' \
            $'A\tdocs/r41-saved-life/N4096-ORDINARY-ZERO-PROOF-SOURCE.patch' \
            $'A\tdocs/r41-saved-life/n4096-ordinary-zero-proof-pins.v1.json' \
            $'A\tscripts/check_n4096_ordinary_proof_device_free.py' | LC_ALL=C sort) \
            <(git diff --name-status --no-renames "$PIN_WIDTH_PARENT" "$PIN_EXACT_EMITTED_WIDTH" | LC_ALL=C sort)
          test "$(git show -s --format=%P "$PIN_V3_HOST")" = "$PIN_V3_PARENT"
          test "$(git rev-parse "$PIN_V3_PARENT^{tree}")" = "$PIN_V3_PARENT_TREE"
          test "$(git show -s --format=%P "$PIN_V3_PARENT")" = "$PIN_V3_FIRST"
          test "$(git show -s --format=%P "$PIN_V3_FIRST")" = "$PIN_V2_HOST"
          test "$(git rev-parse "$PIN_V2_HOST^{tree}")" = "$PIN_V2_TREE"
          git merge-base --is-ancestor "$PIN_RESTORE_PARENT" "$PIN_V2_HOST"
          git merge-base --is-ancestor "$PIN_RESTORE_SOURCE" "$PIN_RESTORE_PARENT"
          git merge-base --is-ancestor "$PIN_RESEARCH_COMMIT" "$PIN_RESTORE_PARENT"
          git diff --exit-code "$PIN_RESTORE_SOURCE" HEAD -- docs/r41-saved-life/{restore_source.py,SOURCE.json,patches}
          diff -u <(printf '%s\n' \
            $'A\t.github/workflows/qualia-n4096-width-intake-check.yml' \
            $'A\tdocs/r41-saved-life/N4096-NATIVE-AUXILIARY-FIRST-SLICE.patch' \
            $'A\tdocs/r41-saved-life/N4096-NATIVE-CLASS4-SHAPE.patch' \
            $'A\tdocs/r41-saved-life/N4096-ORDINARY-ZERO-PROOF-SOURCE.patch' \
            $'A\tdocs/r41-saved-life/N4096-SHARED-APP-ZERO-INTAKE.patch' \
            $'A\tdocs/r41-saved-life/n4096-ordinary-zero-proof-pins.v1.json' \
            $'A\tdocs/r41-saved-life/n4096-width-hosted-pins.v1.json' \
            $'A\tscripts/check_n4096_app_device_free.py' \
            $'A\tscripts/check_n4096_ordinary_proof_device_free.py' | LC_ALL=C sort) \
            <(git diff --name-status --no-renames "$PIN_V3_HOST" "$PIN_EXACT_EMITTED_WIDTH" | LC_ALL=C sort)
          export EXACT_SRC="$RUNNER_TEMP/qualia-n4096-width-intake-source"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/qualia-n4096-width-intake-target"
          export EVIDENCE="$RUNNER_TEMP/qualia-n4096-width-intake-evidence"
          printf 'EXACT_SRC=%s\nCARGO_TARGET_DIR=%s\nEVIDENCE=%s\n' \
            "$EXACT_SRC" "$CARGO_TARGET_DIR" "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir "$EVIDENCE"
          research="$RUNNER_TEMP/pinned-research.patch"
          repair="$RUNNER_TEMP/pinned-sleep-boundary-repair.patch"
          legacy="$RUNNER_TEMP/pinned-sleep-legacy-publication.patch"
          v2="$RUNNER_TEMP/pinned-v2.patch"
          v2_blob=docs/r41-saved-life/retained-language-pilot-source.patch
          test "$(git rev-parse "$PIN_V2_HOST:$v2_blob")" = "$PIN_V2_ADAPTER_GIT_BLOB"
          test "$(git rev-parse "$PIN_V2_HOST:docs/r41-saved-life/retained-language-pilot-source-pins.json")" = "$PIN_V2_LEAVES_GIT_BLOB"
          git show "$PIN_RESEARCH_COMMIT:docs/r41-saved-life/research-catalog-source-only.patch" > "$research"
          git show "$PIN_RESTORE_PARENT:docs/r41-saved-life/sleep-boundary-repair-source.patch" > "$repair"
          git show "$PIN_RESTORE_PARENT:docs/r41-saved-life/sleep-legacy-publication-source.patch" > "$legacy"
          git show "$PIN_V2_HOST:$v2_blob" > "$v2"
          v3="$GITHUB_WORKSPACE/docs/r41-saved-life/retained-language-composition-v3-source.patch"
          pins="$GITHUB_WORKSPACE/docs/r41-saved-life/retained-language-composition-v3-pins.json"
          printf '%s  %s\n' "$PIN_RESEARCH_PATCH" "$research" "$PIN_REPAIR_PATCH" "$repair" \
            "$PIN_LEGACY_PATCH" "$legacy" "$PIN_V2_ADAPTER" "$v2" "$PIN_V3_ADAPTER" "$v3" \
            "$PIN_V3_LEAVES" "$pins" | sha256sum -c - | tee "$EVIDENCE/build.log"
          printf 'event_commit=%s\nexact_v2_parent=%s\nsigned_closure=%s\nv3_overlay=%s\n' \
            "$GITHUB_SHA" "$PIN_V2_HOST" "$PIN_RESTORE_SOURCE" "$PIN_V3_ADAPTER" | tee -a "$EVIDENCE/build.log"
          python3 docs/r41-saved-life/restore_source.py "$GITHUB_WORKSPACE" "$EXACT_SRC" | tee -a "$EVIDENCE/build.log"
          cd "$EXACT_SRC"
          for p in "$research" "$repair" "$legacy" "$v2"; do
            git apply --check "$p"
            git apply "$p"
          done
          python3 - "$pins" "$v3" <<'PY' | tee -a "$EVIDENCE/build.log"
          import hashlib, json, os, pathlib, subprocess, sys
          pins = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          assert pins["preceding_v3_hosted_git"] == os.environ["PIN_V3_PARENT"]
          assert pins["exact_v2_git_parent"] == os.environ["PIN_V2_HOST"]
          assert pins["reviewed_v3_patch_sha256"] == os.environ["PIN_V3_ADAPTER"]
          assert pins["cargo_lock_sha256"] == os.environ["PIN_LOCK"]
          assert pins["rust_release"] == os.environ["RUST_TOOLCHAIN"]
          def digest_file(p):
              p = pathlib.Path(p)
              if p.is_symlink() or (p.exists() and not p.is_file()):
                  raise RuntimeError(f"nonregular allowlisted leaf: {p}")
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
          for name, expected in pins["public_b00_support_leaves"].items():
              assert digest_file(pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / name) == expected, name
          leaves = pins["exact_before_after"]
          expected_paths = {
            "crates/alife_game_app/Cargo.toml",
            "crates/alife_game_app/src/foundation_training_cycle/saved_life_retention.rs",
            "crates/alife_game_app/src/foundation_training_cycle/saved_life_retention/experiments.rs",
            "crates/alife_game_app/src/foundation_training_cycle/saved_life_retention/language_composition_v3.rs",
            "crates/alife_world/Cargo.toml",
            "crates/alife_world/src/headless.rs",
          }
          assert set(leaves) == expected_paths and sum(x["before"] is None for x in leaves.values()) == 1
          stats = subprocess.check_output(["git", "apply", "--numstat", "-z", sys.argv[2]])
          assert {x.decode().split("\t",2)[2] for x in stats.rstrip(b"\0").split(b"\0")} == expected_paths
          def verify(k):
              expected = {n: pair[k] for n,pair in leaves.items()}
              expected.update(pins["unchanged_source"], **{"Cargo.lock":pins["cargo_lock_sha256"]})
              for n,want in expected.items():
                  got=digest_file(n)
                  assert got == want, f"{k}: {n} expected {want} actual {got}"
              print(f"{k}: exact six approved leaves plus unchanged v2, catalog and lock")
          def apply(*flags):
              for checks in (("--check",), ()):
                  subprocess.run(["git","apply","--whitespace=error",*flags,*checks,sys.argv[2]],check=True)
          verify("before"); apply(); verify("after"); apply("--reverse"); verify("before"); apply(); verify("after")
          PY

      - name: Compose exact reviewed width and ordinary proof source only
        run: |
          set -euo pipefail
          cd "$EXACT_SRC"
          python3 -IB - "$GITHUB_WORKSPACE" <<'PY' | tee -a "$EVIDENCE/build.log"
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path(sys.argv[1])
          src=root/'docs/r41-saved-life'
          info=src/'n4096-width-hosted-pins.v1.json'
          def sh(path):
              p=pathlib.Path(path)
              assert not p.is_symlink() and (not p.exists() or p.is_file()),p
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          assert sh(info)==os.environ['PIN_WIDTH_META']
          record=json.loads(info.read_bytes())
          assert record['basis_exact_shared_source']==os.environ['PIN_V3_HOST']
          assert sh(root/'scripts/check_n4096_app_device_free.py')==record['cli_harness_sha256']
          assert sh('Cargo.lock')==os.environ['PIN_LOCK']
          before,after = record['exact_before'],record['exact_after']
          assert set(before)==set(after) and len(before)==10
          assert {k:sh(k) for k in before}==before
          patch_names=['N4096-NATIVE-CLASS4-SHAPE.patch','N4096-NATIVE-AUXILIARY-FIRST-SLICE.patch','N4096-SHARED-APP-ZERO-INTAKE.patch']
          assert set(patch_names)==set(record['patches'])
          seen=set()
          for file in patch_names:
              p=src/file
              assert sh(p)==record['patches'][file]
              names={l.decode().split('\t',2)[2] for l in subprocess.check_output(['git','apply','--numstat','-z',p]).rstrip(b'\0').split(b'\0')}
              assert names and names.issubset(before)
              seen.update(names)
              for extra in (['--check'],[]):
                  subprocess.run(['git','apply','--whitespace=error',*extra,p],check=True)
          assert seen==set(before) and {k:sh(k) for k in after}==after
          assert sh('Cargo.lock')==os.environ['PIN_LOCK']
          ordinary_path=src/'n4096-ordinary-zero-proof-pins.v1.json'
          assert sh(ordinary_path)==os.environ['PIN_ORDINARY_META']
          op=json.loads(ordinary_path.read_bytes())
          assert op['base_hosted_source_head']==os.environ['PIN_WIDTH_PARENT']
          assert not op['compiled'] and not op['private_current_consumed'] and not op['game_or_device_run']
          proof_patch=src/'N4096-ORDINARY-ZERO-PROOF-SOURCE.patch'
          proof_harness=root/'scripts/check_n4096_ordinary_proof_device_free.py'
          ps=op['files_for_source_review_only']
          assert ps=={p.name:sh(p) for p in (proof_patch,proof_harness)}
          exact=op['leaf_before_after_sha256']
          names={l.decode().split('\t',2)[2] for l in
            subprocess.check_output(['git','apply','--numstat','-z',proof_patch]).rstrip(b'\0').split(b'\0')}
          approved_paths={
              'crates/alife_game_app/src/foundation_training_cycle/saved_life_retention.rs',
              'crates/alife_game_app/src/foundation_training_cycle/saved_life_retention/experiments.rs',
              'crates/alife_game_app/src/foundation_training_cycle/saved_life_retention/n4096_auxiliary_intake.rs',
              'crates/alife_game_app/src/gpu_live_runtime.rs',
              'crates/alife_gpu_backend/src/research_n4096_auxiliary.rs',
          }
          assert set(exact)==names==approved_paths and names.issubset(after)
          assert all(exact[k]['before']==after[k] for k in names)
          final={**after,**{k:ex['after'] for k,ex in exact.items()}}
          def check_all(expected):
              assert {k:sh(k) for k in expected}==expected
              assert sh('Cargo.lock')==os.environ['PIN_LOCK']
          def apply_proof(*flags):
              for extra in (['--check'],[]):
                  subprocess.run(['git','apply','--whitespace=error',*flags,*extra,proof_patch],check=True)
          check_all(after); apply_proof(); check_all(final)
          apply_proof('--reverse'); check_all(after)
          apply_proof(); check_all(final)
          pathlib.Path('n4096-final-source-pins.json').write_text(json.dumps(final,sort_keys=True))
          print('full signed source reconstructed; all ten exact width leaves plus five-leaf proof overlay forward/reverse/forward')
          PY


      - name: Authenticated reversible parked transport source
        run: |
          set -euo pipefail
          cd "$EXACT_SRC"
          python3 -IB - "$GITHUB_WORKSPACE" <<'PY' | tee -a "$EVIDENCE/build.log"
          import hashlib,json,os,pathlib,subprocess,sys
          docs=pathlib.Path(sys.argv[1])/'docs/r41-saved-life'
          meta=docs/'n4096-parked-transport-source-pins.v1.json'
          patch=docs/'N4096-PARKED-LIVE-TRANSPORT.patch'
          def digest(ref):
              f=pathlib.Path(ref)
              assert not f.is_symlink() and (not f.exists() or f.is_file()),f
              return hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None
          assert digest(meta)==os.environ['PIN_PARKED_META']
          pins=json.loads(meta.read_bytes())
          assert pins['parent_git']==os.environ['PIN_EXACT_EMITTED_WIDTH']
          assert pins['parent_tree']==os.environ['PIN_EXACT_EMITTED_WIDTH_TREE']
          assert not pins['device_or_private_current'] and not pins['build_licenses_native']
          assert digest(patch)==pins['patch_sha256']
          allowed={
              'crates/alife_core/Cargo.toml',
              'crates/alife_core/src/structural_plasticity.rs',
              'crates/alife_gpu_backend/Cargo.toml',
              'crates/alife_gpu_backend/src/lib.rs',
              'crates/alife_gpu_backend/src/research_n4096_parked_transport.rs',
          }
          paths=pins['paths']
          assert set(paths)==allowed
          names={x.decode().split('\t',2)[2] for x in subprocess.check_output(
            ['git','apply','--numstat','-z',patch]).rstrip(b'\0').split(b'\0')}
          assert names==allowed
          def verify(mode):
              assert digest('Cargo.lock')==os.environ['PIN_LOCK']
              for k,v in paths.items():
                  assert digest(k)==v[mode],(mode,k,digest(k),v[mode])
          def apply(*flags):
              for check in (['--check'],[]):
                  subprocess.run(['git','apply','--whitespace=error',*flags,*check,patch],check=True)
          verify('before'); apply(); verify('after')
          apply('--reverse'); verify('before'); apply(); verify('after')
          print('exact parked transport source, five leaves and forward/inverse/forward verified')
          PY


      - name: Exact independently testable H-only compiler then registry overlays
        run: |
          set -euo pipefail
          cd "$EXACT_SRC"
          python3 -IB - "$GITHUB_WORKSPACE" <<'PY' | tee -a "$EVIDENCE/build.log"
          from hashlib import sha256
          from pathlib import Path
          import json,os,subprocess,sys
          docs=Path(sys.argv[1])/'docs/r41-saved-life'
          def digest(path):
              p=Path(path)
              assert not p.is_symlink() and (not p.exists() or p.is_file()),p
              return sha256(p.read_bytes()).hexdigest() if p.exists() else None
          def approved(name,meta,want,allowed):
              p=docs/(name+'.patch'); m=docs/meta
              assert digest(m)==os.environ[want]
              info=json.loads(m.read_bytes())
              assert info['base_emitted_carrier_git']==os.environ['PIN_EXACT_EMITTED_WIDTH']
              transport=json.loads((docs/'n4096-parked-transport-source-pins.v1.json').read_bytes())
              assert info['composes_after_exact_transport_sha256']==transport['patch_sha256']
              assert digest(p)==info['forward'] and not info['compiled_or_native']
              assert set(info['leaves'])==allowed
              paths={x.decode().split('\t',2)[2] for x in subprocess.check_output(
                  ['git','apply','--numstat','-z',p]).rstrip(b'\0').split(b'\0')}
              assert paths==allowed
              def verify(k):
                  assert digest('Cargo.lock')==os.environ['PIN_LOCK']
                  for path,d in info['leaves'].items():assert digest(path)==d[k],(k,path,digest(path),d[k])
              def apply(*args):
                  for check in (['--check'], []):
                      subprocess.run(['git','apply','--whitespace=error',*args,*check,p],check=True)
              verify('before');apply();verify('after')
              apply('--reverse');verify('before');apply();verify('after')
              return info
          compiler=approved('N4096-PARKED-H-ONLY-COMPILER','H-ONLY-COMPILER-PINS.json','PIN_H_ONLY_META',{
              'crates/alife_core/src/phenotype/record.rs','crates/alife_core/tests/n4096_parked_h_only.rs',
              'crates/alife_gpu_backend/src/closed_loop_runtime.rs',
          })
          registry=approved('N4096-PARKED-NATIVE-REGISTRY','NATIVE-REGISTRY-PINS.json','PIN_REGISTRY_META',{
              'crates/alife_gpu_backend/src/closed_loop_runtime.rs','crates/alife_gpu_backend/src/closed_loop_checkpoint.rs',
              'crates/alife_gpu_backend/src/closed_loop_runtime/research_n4096_parked.rs',
              'crates/alife_gpu_backend/src/research_n4096_auxiliary.rs',
              'crates/alife_gpu_backend/src/research_n4096_parked_transport.rs',
          })
          target='crates/alife_gpu_backend/src/closed_loop_runtime.rs'
          assert registry['composes_after_h_only_compiler_sha256']==compiler['forward']
          assert registry['leaves'][target]['before']==compiler['leaves'][target]['after']
          print('exact 3- and 5-leaf source-only compiler and real registry overlays each forward/inverse/forward')
          PY

      - name: Locked Rust and real typed compiler + native plan CPU tests
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          version="$(rustc +"$RUST_TOOLCHAIN" -vV)"
          grep -Fqx "release: $RUST_TOOLCHAIN" <<< "$version"
          grep -Fqx "commit-hash: $PIN_RUSTC_COMMIT" <<< "$version"
          grep -Fqx "host: $TARGET" <<< "$version"
          printf '%s\n' "$version" | tee -a "$EVIDENCE/build.log"
          cd "$EXACT_SRC"
          mkdir -p -- "$CARGO_TARGET_DIR"
          test "$(df -PB1 "$CARGO_TARGET_DIR" | awk 'NR==2 {print $4}')" -ge 10737418240
          timeout 8m cargo +"$RUST_TOOLCHAIN" fetch --locked --target "$TARGET" 2>&1 | tee -a "$EVIDENCE/build.log"
          timeout 18m cargo +"$RUST_TOOLCHAIN" check --frozen --offline --target "$TARGET" --no-default-features \
            -p alife_gpu_backend --lib 2>&1 | tee "$EVIDENCE/parked-off-check.log"
          timeout 20m cargo +"$RUST_TOOLCHAIN" test --frozen --offline --target "$TARGET" --no-default-features \
            -p alife_core --test n4096_parked_h_only --features research-n4096-parked-transport \
            -- --nocapture 2>&1 | tee "$EVIDENCE/parked-h-only-cpu.log"
          grep -Fq 'actual_compiler_emits_4096_h_only_layout_with_no_extra_decoder_or_recurrent_rows ... ok' "$EVIDENCE/parked-h-only-cpu.log"
          grep -Fq 'parked_marker_is_never_promoted_or_imported_and_legacy_class4_stays_exact ... ok' "$EVIDENCE/parked-h-only-cpu.log"
          grep -Eq '^test result: ok. 2 passed; 0 failed; 0 ignored;' "$EVIDENCE/parked-h-only-cpu.log"
          timeout 25m cargo +"$RUST_TOOLCHAIN" test --frozen --offline --target "$TARGET" --no-default-features \
            -p alife_gpu_backend --lib --features research-n4096-parked-transport parked_ -- --nocapture \
            2>&1 | tee "$EVIDENCE/parked-registry-cpu.log"
          for t in parked_transport_preserves_csr_v11_and_complete_learned_bank_roundtrip parked_transport_rejects_q_alias_order_and_bad_ordered_readback parked_terminal_refuses_offline_device_and_queue_lending parked_compiled_fixed_layout_matches_live_semantic_map_without_q_rows; do
            grep -Fq "$t ... ok" "$EVIDENCE/parked-registry-cpu.log"
          done
          grep -Eq '^test result: ok. 4 passed; 0 failed; 0 ignored;' "$EVIDENCE/parked-registry-cpu.log"
          cd "$EVIDENCE"
          sha256sum build.log parked-off-check.log parked-h-only-cpu.log parked-registry-cpu.log > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain exact source/test logs only, never a runnable executable or saved life
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualia-n4096-parked-registry-cpu-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qualia-n4096-width-intake-evidence/build.log
            ${{ runner.temp }}/qualia-n4096-width-intake-evidence/parked-off-check.log
            ${{ runner.temp }}/qualia-n4096-width-intake-evidence/parked-h-only-cpu.log
            ${{ runner.temp }}/qualia-n4096-width-intake-evidence/parked-registry-cpu.log
            ${{ runner.temp }}/qualia-n4096-width-intake-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 5
          compression-level: 3
