name: Qualia formatted orchard App CPU review

# Review only. Do not merge this workflow or its review-enabled candidate.
on:
  push:
    branches: ['qualia-ci/orchard-pr-format-app-review']
    paths: ['.github/workflows/qualia-orchard-pr-format-app-review.yml']

permissions:
  contents: read

jobs:
  app-cpu-review:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.ref == 'refs/heads/qualia-ci/orchard-pr-format-app-review' &&
      github.event.before == '8429f54f29e0569a699b3766d70e62bac2c92225' &&
      github.run_attempt == '1' &&
      !github.event.created && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
      RUST_MIN_STACK: '33554432'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout the exact public candidate only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          lfs: false
          submodules: false

      - name: Verify the sealed source, parent and exact code-only tree
