          test ! -e "$QUALIA_MODE_REVIEW_STAGE/target"
          CARGO_TARGET_DIR="$fetch_target" cargo +1.100.0 fetch --locked --target x86_64-unknown-linux-gnu
          export CARGO_TARGET_DIR="$QUALIA_MODE_REVIEW_STAGE/target"
          mkdir -m 700 "$CARGO_TARGET_DIR"
          python3 - <<'PY'
          """Review-only inlined body for a separately authorized single hosted job.

          Requires the exact verified hosted source/apt/fetch stage. Does not set up a
          workflow or choose or write a branch. Never execute on the local worker.
          """
          from hashlib import file_digest
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import signal
          import subprocess
          import sys
          import time

          GIB=1024**3
          INNER_SECONDS=1560                 # after locked fetch; outer hosted job is 30m
          BUILD_SOFT_MAX=1030
          TERM_SLACK=5
          CASE_LIMIT=20
          PIN_SHA='ae36b78d11dfdbe21266d4da52a17b18a71ad64aaf390a02123b7197c0adfa45'
          REVIEW='qualia-village-review'


          def sha(path):
              with path.open('rb') as f:
                  return file_digest(f,'sha256').hexdigest()


          def canonical(path):
              p=Path(path)
              assert p.is_absolute() and not p.is_symlink()
              return p.resolve(strict=True)


          def git(*args):
              return subprocess.check_output(['git','--no-replace-objects',*args])


          def command(args,out,err,seconds):
              clock=time.monotonic()
              status=None
              with out.open('xb') as raw, err.open('xb') as log:
                  proc=subprocess.Popen(args,stdout=raw,stderr=log,start_new_session=True)
                  try:
                      status=proc.wait(timeout=seconds)
                  except subprocess.TimeoutExpired:
                      status=124
                  finally:
                      if proc.poll() is None:
                          try:
                              os.killpg(proc.pid,signal.SIGTERM)
                          except ProcessLookupError:
                              pass
                          try:
                              proc.wait(timeout=TERM_SLACK)
                          except subprocess.TimeoutExpired:
                              try:
                                  os.killpg(proc.pid,signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
                              proc.wait()
              return {'command':args,'status':status,'seconds':round(time.monotonic()-clock,3),
                      'stdout_sha256':sha(out),'stderr_sha256':sha(err)}


          def emit(tag,s):
              print(tag,json.dumps(s,sort_keys=True),flush=True)


          def main():
              assert os.environ.get('GITHUB_ACTIONS')=='true'
              assert os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'
              assert os.environ.get('GITHUB_REPOSITORY')=='BobertNeek/A-Life'
              assert os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
              for name in ('DISPLAY','WAYLAND_DISPLAY','XAUTHORITY'):
                  os.environ.pop(name,None)
              runner=canonical(os.environ['RUNNER_TEMP'])
              stage=canonical(os.environ['QUALIA_MODE_REVIEW_STAGE'])
              target=canonical(os.environ['CARGO_TARGET_DIR'])
              cache=canonical(os.environ['CARGO_HOME'])
              fetch=canonical(stage/'fetch-target')
              tmp=canonical(os.environ['TMPDIR'])
              assert stage.parent==runner and cache.parent==fetch.parent==target.parent==tmp.parent==stage
              assert (cache,fetch,target,tmp)==tuple(stage/p for p in ('cargo-home','fetch-target','target','tmp'))
              assert len({cache,fetch,target,tmp})==4 and not list(target.iterdir()) and not list(tmp.iterdir())
              assert shutil.disk_usage(stage).free>=8*GIB
              assert os.environ.get('CARGO_BUILD_JOBS')=='1'
              assert os.environ.get('CARGO_INCREMENTAL')=='0'
              assert os.environ.get('CARGO_PROFILE_TEST_DEBUG')=='0'
              assert os.environ.get('CARGO_PROFILE_TEST_INCREMENTAL')=='false'
              pins_path=stage/'sealed-pins.json'
              assert sha(pins_path)==PIN_SHA
              pins=json.loads(pins_path.read_bytes())
              assert not git('status','--porcelain','--untracked-files=all')
              head=git('rev-parse','HEAD').decode().strip()
              assert head==os.environ['GITHUB_SHA']
              assert git('rev-list','--parents','-n','1','HEAD').decode().split()==[head,pins['pinned_main']]
              # The enclosing hosted identity step must have separately checked exact
              # stripped workflow tree and branch/push policy. Here bind raw leafs again.
              for p,val in pins['immutable_inputs'].items():
                  assert sha(Path(p))==val['sha256']
              for p,val in pins['exact_changed_public_paths'].items():
                  assert sha(Path(p))==val['sha256']
              app=Path(pins['app_manifest']).resolve(strict=True)
              world=Path(pins['world_manifest']).resolve(strict=True)
              want_src=(app.parent/'src/lib.rs').resolve(strict=True)
              world_src=(world.parent/'src/lib.rs').resolve(strict=True)
              feature_arg='production-voxel-frontend,qualia-village-review'
              expect_app=set(pins['app_features_exact_base'])|{REVIEW}
              cases=pins['cases']['review-on']
              assert cases==['production_voxel_renderer::orchard::court::tests::signed_viewport_chime_preview_garden_return_and_late_seat_refusal', 'production_voxel_renderer::god_hand::tests::reopened_chime_real_follow_shift_retains_unless_the_new_ray_is_explicitly_aimed']
              assert pins['feature_choices']==[feature_arg] and set(pins['cases'])=={'review-on'}
              deadline=time.monotonic()+INNER_SECONDS
              summary={'head':head,'tree':pins['source_successor_tree'],'expected_cases':cases,'case_results':[],
                       'expected_app_features':sorted(expect_app),'expected_world_features':['default',REVIEW],
                       'actual_passes':0,'hard_job_minutes':30,'internal_after_fetch_s':INNER_SECONDS,
                       'cpu_libtest_only_no_full_app':True,'never_retries':True}
              fatal=None
              try:
                  assert deadline-time.monotonic()>BUILD_SOFT_MAX+TERM_SLACK+len(cases)*(CASE_LIMIT+TERM_SLACK)+12
                  args=['cargo','+1.100.0','test','--frozen','--target','x86_64-unknown-linux-gnu',
                        '-j','1','-p','alife_game_app','--no-default-features','--features',feature_arg,
                        '--lib','--no-run','--message-format=json-render-diagnostics']
                  raw,err=stage/'review-on.build.jsonl',stage/'review-on.build.stderr'
                  emit('COMPILER_COMMAND',{'args':args,'soft_seconds':BUILD_SOFT_MAX})
                  summary['build']=command(args,raw,err,BUILD_SOFT_MAX)
                  emit('COMPILE_RESULT',summary['build'])
                  sys.stderr.buffer.write(err.read_bytes())
                  sys.stderr.buffer.flush()
                  apps=[]; worlds=[]
                  with raw.open(encoding='utf-8') as f:
                      for line in f:
                          row=json.loads(line)
                          if row.get('reason')=='compiler-message':
                              if rendered:=row['message'].get('rendered'):
                                  print(rendered,file=sys.stderr,flush=True,end='')
                          if row.get('reason')!='compiler-artifact':
                              continue
                          manifest=Path(row['manifest_path']).resolve()
                          dest=row['target']
                          kind,name,code=dest['kind'],dest['name'],Path(dest['src_path']).resolve()
                          if manifest==world and kind==['lib'] and name=='alife_world' and code==world_src:
                              worlds.append(row)
                          if manifest==app and kind==['lib'] and name=='alife_game_app' and code==want_src and row.get('executable'):
                              apps.append(row)
                  assert summary['build']['status']==0, 'No test eligible after a failed or timed-out compile'
                  w,=worlds
                  a,=apps
                  assert set(w['features'])=={'default',REVIEW} and w['fresh'] is False and w['profile']['test'] is False
                  world_path,=(Path(f).resolve(strict=True) for f in w['filenames'] if f.endswith('.rlib'))
                  assert world_path.is_file() and world_path.is_relative_to(target)
                  summary['world']={'features':sorted(w['features']),'relative':str(world_path.relative_to(target)),
                                    'sha256':sha(world_path),'fresh':w['fresh']}
                  emit('WORLD_LIB_FINGERPRINT',summary['world'])
                  assert set(a['features'])==expect_app and a['fresh'] is False
                  assert a['profile']['test'] is True and a['profile']['debug_assertions'] is True
                  binary=Path(a['executable']).resolve(strict=True)
                  assert binary.is_file() and binary.is_relative_to(target) and os.access(binary,os.X_OK)
                  summary['artifact']={'features':sorted(a['features']),'relative':str(binary.relative_to(target)),
                                       'sha256':sha(binary),'fresh':a['fresh']}
                  emit('APP_LIBTEST',summary['artifact'])
                  for number,case in enumerate(cases,1):
                      if deadline-time.monotonic()<=CASE_LIMIT+TERM_SLACK+4 or shutil.disk_usage(stage).free<8*GIB:
                          summary['case_results'].append({'case':case,'passed':False,'status':'not run; resource guard'})
                          continue
                      assert sha(binary)==summary['artifact']['sha256'] and sha(world_path)==summary['world']['sha256']
                      assert sha(Path('Cargo.lock'))==pins['immutable_inputs']['Cargo.lock']['sha256']
                      stdout,stderr=stage/(f'review-on.case-{number}.stdout'),stage/(f'review-on.case-{number}.stderr')
                      run=command([str(binary),case,'--exact','--test-threads=1','--format=pretty','--color=never'],
                                  stdout,stderr,CASE_LIMIT)
                      sys.stdout.buffer.write(stdout.read_bytes())
                      sys.stdout.buffer.flush()
                      sys.stderr.buffer.write(stderr.read_bytes())
                      sys.stderr.buffer.flush()
                      out=stdout.read_text()
                      rows=[s for s in out.splitlines() if s.startswith('test ') and ' ... ' in s]
                      passed=(run['status']==0 and rows==[f'test {case} ... ok']
                              and len(re.findall(r'^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;',out,re.M))==1)
                      receipt={'case':case,'passed':passed,**run}
                      summary['case_results'].append(receipt)
                      summary['actual_passes']+=int(passed)
                      emit('EXACT_CASE_RESULT',receipt)
                  assert sha(binary)==summary['artifact']['sha256'] and sha(world_path)==summary['world']['sha256']
              except Exception as e:
                  fatal=e
              finally:
                  summary['first_error']=None if fatal is None else repr(fatal)
                  summary['passed']=summary['actual_passes']==len(cases)==len(summary['case_results']) and fatal is None
                  summary['remaining_seconds']=round(deadline-time.monotonic(),3)
                  with (stage/'orchard-formatted-two-case-result.json').open('x') as f:
                      f.write(json.dumps(summary,indent=2,sort_keys=True)+'\n')
                  emit('FINAL_FORMATTED_ORCHARD_TWO_CASE_RESULT',summary)
              if fatal is not None:
                  raise fatal
              if not summary['passed']:
                  raise SystemExit('Both exact formatted opt-in cases are required; preserve raw, no retry')

          if __name__=='__main__':main()
          PY

      - name: Retain only raw compiler and named-test logs
        if: always() && env.QUALIA_MODE_REVIEW_STAGE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualia-orchard-formatted-app-raw-attempt-1
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/rustfmt.stdout
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/rustfmt.stderr
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.build.jsonl
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.build.stderr
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.case-1.stdout
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.case-1.stderr
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.case-2.stdout
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.case-2.stderr
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/orchard-formatted-two-case-result.json
