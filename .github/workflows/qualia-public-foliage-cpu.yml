name: Qualia public foliage CPU gate

# One deliberately published witness branch; not a PR/main/review trigger.
on:
  push:
    branches: ["qualia-ci/foliage-cpu-67e3500"]
    paths: [".github/workflows/qualia-public-foliage-cpu.yml"]

permissions:
  contents: read

jobs:
  public-foliage-cpu:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.event.before == '56cb0f46e7393cf8f0e6924040ea5c00aa4ab339' &&
      !github.event.created && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_MIN_STACK: '33554432'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout the immutable public review, not the workflow branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # stock v4
        with:
          ref: 67e350001b9756366702de74d1a7ee8829e4fb1d
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Confirm exact publicly tracked input
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 67e350001b9756366702de74d1a7ee8829e4fb1d
          test "$(git rev-parse 'HEAD^{tree}')" = 186901a8212666fbc8ca619a1ef5bed551a90f44
          test -z "$(git status --porcelain)"
          git rev-parse HEAD "HEAD^{tree}"
          grep -E '^(NAME|VERSION_ID)=' /etc/os-release
      - name: Install the Rust release observed on the stock CPU gate
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.100.0'
      - name: Install the stock Linux controller build dependency
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Compile the library test binary once and run four exact CPU checks
        shell: bash
        run: |
          case "$RUNNER_TEMP" in
            /*) ;;
            *) printf '%s\n' 'RUNNER_TEMP must be an absolute runner path' >&2; exit 1 ;;
          esac
          export CARGO_TARGET_DIR="$RUNNER_TEMP/qualia-foliage-cpu"
          export TMPDIR="$RUNNER_TEMP"
          rustc --version --verbose
          cargo --version
          metadata="$RUNNER_TEMP/qualia-foliage-cargo.jsonl"
          cargo test --locked -p alife_game_app --features production-voxel-frontend \
            --lib --no-run --message-format=json-render-diagnostics > "$metadata"
          python3 - "$metadata" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          workspace = Path.cwd().resolve()
          manifest = workspace / "crates/alife_game_app/Cargo.toml"
          source = manifest.parent / "src/lib.rs"
          target_dir = Path(os.environ["CARGO_TARGET_DIR"]).resolve()
          library = []
          with open(sys.argv[1], encoding="utf-8") as messages:
              for line in messages:
                  if not line.startswith("{"):
                      continue
                  row = json.loads(line)
                  target = row.get("target", {})
                  if (row.get("reason") == "compiler-artifact"
                      and Path(row["manifest_path"]).resolve() == manifest
                      and target.get("name") == "alife_game_app"
                      and target.get("kind") == ["lib"]
                      and Path(target["src_path"]).resolve() == source
                      and row.get("profile", {}).get("test") is True
                      and "production-voxel-frontend" in row.get("features", [])
                      and row.get("executable")):
                      library.append(Path(row["executable"]).resolve())
          if len(library) != 1:
              raise SystemExit(f"expected one public library test executable, got {len(library)}")
          binary, = library
          if not binary.is_relative_to(target_dir) or not binary.is_file():
              raise SystemExit("unexpected Cargo executable location")
          with binary.open("rb") as handle:
              print("Library test executable SHA-256", hashlib.file_digest(handle, "sha256").hexdigest(), flush=True)

          menu = "production_voxel_renderer::menu::load_tests::"
          island = "production_voxel_renderer::island::update_tests::"
          tests = (
              menu + "graphics_adjustment_is_live_when_paused_and_a_closed_control_cannot_reapply",
              menu + "failed_foliage_write_retries_the_same_explicit_notch_without_an_idle_write",
              menu + "foliage_focus_return_repeats_cannot_change_or_save_a_notch",
              island + "same_view_off_hides_only_the_stock_decorative_entities_and_preserves_ownership",
          )
          for test in tests:
              run = subprocess.run([str(binary), test, "--exact", "--test-threads=1",
                                    "--format=pretty", "--color=never"], check=False,
                                   cwd=manifest.parent, text=True, stdout=subprocess.PIPE,
                                   stderr=subprocess.STDOUT)
              print(run.stdout, end="", flush=True)
              lines = run.stdout.splitlines()
              if (run.returncode != 0
                  or lines.count(f"test {test} ... ok") != 1
                  or len([line for line in lines if line.startswith("test ") and " ... " in line]) != 1
                  or not re.search(r"^test result: ok\. 1 passed; 0 failed; 0 ignored;", run.stdout, re.M)):
                  raise SystemExit(f"not exactly one real named pass: {test}")
          PY
