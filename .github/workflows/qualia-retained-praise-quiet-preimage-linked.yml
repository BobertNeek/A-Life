name: Qualia retained Quiet preimage witness asset-only native byte link
on:
  push:
    branches: ["bob/qualia-retained-praise-quiet-preimage-linked-20261128"]
    paths: [".github/workflows/qualia-retained-praise-quiet-preimage-linked.yml"]

permissions:
  contents: read

concurrency:
  group: qualia-retained-praise-quiet-preimage-linked-${{ github.ref }}
  cancel-in-progress: false

jobs:
  asset-only-link:
    if: github.ref == 'refs/heads/bob/qualia-retained-praise-quiet-preimage-linked-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PIN_WITNESS_COMPILER_HEAD: "67f6526583e26144add0ff95bde2ad1c127baf27"
      PIN_WITNESS_COMPILER_TREE: "e2a71992616ae1458ceed5f43aeb22d5404f9050"
      PIN_WITNESS_COMPILER_WORKFLOW_BLOB: "b275716cd12255c2cc7c9ec650bc514dc5c5c963"
      PIN_WITNESS_COMPILER_WORKFLOW_SHA256: "cf9f5bf9fe9507524e67a3c0f3f54885677c336ce26e3f4d0a2e9af86ea5d1d5"
      PIN_WITNESS_COMPILER_RUN: "46130830249"
      PIN_WITNESS_COMPILER_JOB: "140935366477"
      PIN_LINKED_HEAD: 8521e9f5103dadd4d0afe972360661cd5195c097
      PIN_LINKED_TREE: b3455af13242832ebfbbfa055b1313d0f116ab5a
      PIN_LINKED_WORKFLOW_BLOB: 8a0ed9822676bffee64fe9c1fe2898517d25e629
      PIN_LINKED_WORKFLOW_SHA256: 63b4364d8dddac8839b9a483665362b293404ec5882a26912dcb7ebf641cfb68
      PIN_LINKED_RUN: "46124865300"
      PIN_WITNESS_FORWARD: 1e024f79219b566a854b79d5055e2dd010596d53acfe686dd3fd1eacac10f430
      PIN_WITNESS_FORWARD_BLOB: 1df3af86dcccdf06e76da22bdd6b4cfbca939969
      PIN_WITNESS_INVERSE: 42aad825939b27e403840eec12e34dac069df84347e4d8f4753ed7aa7c2d8950
      PIN_WITNESS_INVERSE_BLOB: a4ceb8f2d22ad3de5103039dce9e77c4c2ea7b04
      PIN_WITNESS_PINS: 2da5900b3fbe500aeb6e555e9ec8c256a1c84a0fd86313d05e65baca922c358b
      PIN_WITNESS_PINS_BLOB: cbb02c2af389c4d10a911418e21338236f02c67b
      PIN_COMPILER_HEAD: 73245d82462c3a2d3b3c08532e45fc315bdc2f2b
      PIN_COMPILER_TREE: 835225362dd55ed6709c3b16fbf99612e9c11f0e
      PIN_COMPILER_WORKFLOW_BLOB: be1a77014f168018b97a7d882bf312f857ee7575
      PIN_COMPILER_WORKFLOW_SHA256: 859072660282e88e9988437adeb941441b1a3638901a55a5f4a7f21d4b049d58
      PIN_COMPILER_RUN: "46124165223"
      PIN_COMPILER_JOB: "140914920186"
      PIN_COMPILER_TEXT_ARTIFACT: "15254449357"
      PIN_COMPILER_TEXT_ZIP_SHA256: 1a3c3185588b40dfcdb5259e0c8d9862a8a92213dce0b58df48e0f5d6892657c
      PIN_MATCH_FORWARD_BLOB: c1a6f52ba27f98a66058315061c4a4922d22ec30
      PIN_MATCH_INVERSE_BLOB: 6622bb863a88aa4ea33ad9dbfaa468c2db038dc2
