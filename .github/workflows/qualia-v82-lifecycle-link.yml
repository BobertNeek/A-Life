              'crates/alife_gpu_backend/src/closed_loop_runtime.rs',
          }
          strict_added = {app + 'foundation_training_cycle/saved_life_retention/contact211_parity.rs'}
          pre, post = strict['before_sha256'], strict['after_sha256']
          require(strict['official_or_native_ready'] is False and set(pre) == strict_modified
                  and set(post) == strict_modified | strict_added, 'independent exact strict source allowlist')
          require(sha256(strict_patch.read_bytes()).hexdigest() == os.environ['PIN_STRICT_PATCH']
                  and sha256(strict_json.read_bytes()).hexdigest() == os.environ['PIN_STRICT_LEAVES'],
                  'exact strict overlay and leaf bytes')
          headers = [path_pattern.fullmatch(l) for l in strict_patch.read_text().splitlines()
                     if l.startswith('diff --git ')]
          require(len(headers) == 7 and all(m is not None and m[1] == m[2] for m in headers)
                  and {m[1] for m in headers} == strict_modified | strict_added, 'strict patch target allowlist')
          verify(pre | shader_pins | {'Cargo.lock': os.environ['PIN_LOCK']}, 'exact strict preimage')
          require(all(digest(p) is None and not (root / p).exists() for p in strict_added), 'strict new file already present')
          apply(strict_patch)
          verify(post | shader_pins | {'Cargo.lock': os.environ['PIN_LOCK']}, 'exact strict postimage')
          strict_after = tree()
          changed = {p for p in source_after.keys() | strict_after.keys() if source_after.get(p) != strict_after.get(p)}
          require(changed == strict_modified | strict_added and set(strict_after) - set(source_after) == strict_added,
                  'whole reconstructed tree diff outside strict seven-leaf allowlist')
          subprocess.run(['git', 'apply', '--reverse', '--check', str(strict_patch)], cwd=root, check=True)
