          run(reverse); assert snapshot()==wanted
          run(forward); assert snapshot()==expected and expected["Cargo.lock"]==os.environ["PIN_LOCK"]
          published.write_text(json.dumps(expected,sort_keys=True,indent=2)+"\n")
          print("v82_exact_rust_overlay_and_inverse=PASS")
          PY

      - name: Link the exact final schema82 ON ELF once without executing it
        run: |
          set -euo pipefail
          umask 077
          cd "$EXACT_SRC"
          mkdir -p -- "$CARGO_TARGET_DIR"
          floor() {
            local free
            free="$(df -PB1 "$CARGO_TARGET_DIR" | awk 'NR==2 {print $4}')"
            [[ "$free" =~ ^[0-9]+$ ]]
            test "$free" -ge "$1"
          }
          floor 8589934592
          timeout --kill-after=10s 10m rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          version="$(rustc +"$RUST_TOOLCHAIN" -vV)"
          grep -Fqx "commit-hash: $PIN_RUSTC" <<< "$version"
          grep -Fqx "host: $TARGET" <<< "$version"
          timeout --kill-after=10s 12m cargo +"$RUST_TOOLCHAIN" fetch --locked --target "$TARGET"
          floor 8589934592
          features='contact211-rank32-crossed,retained-word-local-grounding-v1,retained-ordinary-ingress-observer-v1,retained-prefork-timing-diagnostic-v1'
          raw="$CARGO_TARGET_DIR/$TARGET/debug/evaluate_saved_life_retention"
          test ! -e "$raw" && test ! -L "$raw"
          # One exact ON link, two build jobs, per-process address/file limits,
          # bounded time/kill grace, offline locked dependency closure.
          (
            ulimit -v 7340032
            ulimit -f 4194304
            exec timeout --kill-after=10s 38m cargo +"$RUST_TOOLCHAIN" build --frozen --offline               --target "$TARGET" -j 2 --no-default-features -p alife_game_app               --features "$features" --bin evaluate_saved_life_retention
          )
          floor 4294967296
          out="$RUNNER_TEMP/qualia-v82-linked-public"
          mkdir -- "$out"
          dst="$out/evaluate_saved_life_retention"
          test -x "$raw" && test -f "$raw" && test ! -L "$raw" && test ! -e "$dst" && test ! -L "$dst"
          size="$(stat -c %s -- "$raw")"
          test "$size" -gt 1048576 && test "$size" -lt 134217728
          # Retained copy is not executable in CI. Never invoke raw/dst,
          # ldd, the legacy CLI harness, tests or any native evaluator flag.
          install -m 0400 -- "$raw" "$dst"
          cmp -- "$raw" "$dst"
          LC_ALL=C readelf -W -h "$dst" > "$out/elf-header.txt"
          grep -E 'Class:[[:space:]]+ELF64' "$out/elf-header.txt"
          grep -E 'Data:[[:space:]]+2.s complement, little endian' "$out/elf-header.txt"
          grep -E 'Machine:[[:space:]]+Advanced Micro Devices X86-64' "$out/elf-header.txt"
          grep -E 'Type:[[:space:]]+DYN' "$out/elf-header.txt"
          dynamic="$(LC_ALL=C readelf -W -d "$dst")"
          if grep -Eq '\((RPATH|RUNPATH)\)' <<< "$dynamic"; then exit 7; fi
          python3 -IB - "$dst" "$F0_LAYER/v82-link-checked-tree.json" "$out/qualification.json" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json,mmap,os,sys
          elf,tree,proof=map(Path,sys.argv[1:])
          e=os.environ
          assert elf.is_file() and not elf.is_symlink() and 2**20<elf.stat().st_size<2**27
          digest=lambda b:sha256(b).hexdigest()
          with elf.open('rb') as f, mmap.mmap(f.fileno(),0,access=mmap.ACCESS_READ) as m:
              assert m[:6]==b'\x7fELF\x02\x01'
              markers=(
                b'ordinary_ingress_persisted_continuation_v1',
                b'qualia.private.note19.stock_v11_profile.v1',
                b'qualia.private.note19.sealed_same_case_actual_v5_timing_parents.v1',
                b'Note19 bounded canonical private regular input required',
              )
              assert all(m.find(marker)>=0 for marker in markers)
              elf_sha=digest(m)
          before=tree.read_bytes()
          nodes=list(Path('.').rglob('*'))
          assert not any(x.is_symlink() for x in nodes)
          now={x.as_posix():digest(x.read_bytes()) for x in nodes if x.is_file()}
          assert now==json.loads(before) and now['Cargo.lock']==e['PIN_LOCK']
          workflow=Path(e['GITHUB_WORKSPACE'])/'.github/workflows/qualia-v82-lifecycle-link.yml'
          info=dict(schema='qualia.v82_lifecycle.public_link_only_qualification.v1',
              exact_head=e['GITHUB_SHA'],workflow_sha256=digest(workflow.read_bytes()),
              exact_compiler_parent=e['PIN_LINK_PARENT'],exact_compiler_parent_tree=e['PIN_LINK_PARENT_TREE'],
              compiler_parent_workflow_sha256=e['PIN_LINK_PARENT_WF'],
              prior_compiler_only_run=46123774130,prior_compiler_only_job=140913733304,
              two_leaf_forward_sha256=e['PIN_V82_FWD'],two_leaf_inverse_sha256=e['PIN_V82_INV'],
              source_pin_sha256=e['PIN_V82_PINS'],compiled_tree_manifest_sha256=digest(before),
              dependency_lock_sha256=e['PIN_LOCK'],rustc_commit=e['PIN_RUSTC'],target=e['TARGET'],
              on_elf_sha256=elf_sha,on_elf_bytes=elf.stat().st_size,final_on_link_count=1,
              linked_markers_checked=True,only_static_elf_inspection=True,public_asset_free=True,
              evaluator_executed=False,device_free_cli_refusals_run=False,app_tests_run=False,
              current_accessed=False,device_used=False,private_data_used=False,real_prefork_export=False,
              native_launch=False,runtime_parity_proven=False,continuation_equivalent=False,
              same_new_elf_controls_completed=False,protected_controller_or_descriptor_authorized=False,
              scorecard_eligible=False,authorizes_next=False)
          proof.write_text(json.dumps(info,sort_keys=True,indent=2)+'\n')
          PY
          cd "$out"
          sha256sum evaluate_saved_life_retention qualification.json elf-header.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
          diff -u <(printf '%s\n' SHA256SUMS elf-header.txt evaluate_saved_life_retention qualification.json | sort) \
             <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test "$(find . -mindepth 1 -maxdepth 1 -type f -links 1 -printf '%f\n' | wc -l)" = 4
          test ! -x evaluate_saved_life_retention

      - name: Retain only exact ON ELF and asset-free static text proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualia-v82-lifecycle-linked-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qualia-v82-linked-public/evaluate_saved_life_retention
            ${{ runner.temp }}/qualia-v82-linked-public/qualification.json
            ${{ runner.temp }}/qualia-v82-linked-public/elf-header.txt
            ${{ runner.temp }}/qualia-v82-linked-public/SHA256SUMS
          if-no-files-found: error
          retention-days: 5
          compression-level: 3
