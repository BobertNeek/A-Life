          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tempfile

          def git(*a, env=None, data=None):
              return subprocess.check_output(["git","--no-replace-objects",*a],env=env,input=data)

          def word(*a, env=None):
              return git(*a,env=env).decode().strip()

          def sha(b):
              return hashlib.sha256(b).hexdigest()

          stage=Path(os.environ["QUALIA_MODE_REVIEW_STAGE"]).resolve(strict=True)
          runner=Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          assert stage.parent==runner and os.environ["RUNNER_ENVIRONMENT"]=="github-hosted"
          assert os.environ["GITHUB_REPOSITORY"]=="BobertNeek/A-Life"
          assert os.environ["GITHUB_EVENT_NAME"]=="push" and os.environ["GITHUB_RUN_ATTEMPT"]=="1"
          assert os.environ["GITHUB_REF"]=="refs/heads/qualia-ci/village-explicit-activation-two-mode-review"
          pin_bytes=(stage/"sealed-pins.json").read_bytes()
          assert sha(pin_bytes)=="03ada528c27e8e9632700a6a59a4745064d829220f36214c67a5097331f320da"
          pin=json.loads(pin_bytes)
          base=pin["pinned_main"]
          head=os.environ["GITHUB_SHA"]
          assert re.fullmatch("[0-9a-f]{40}",head) and word("rev-parse","HEAD")==head
          assert word("rev-list","--parents","-n","1","HEAD").split()==[head,base]
          assert word("rev-parse",base+"^{tree}")==pin["root_stock_tree"]
          assert not git("status","--porcelain","--untracked-files=all")
          path=".github/workflows/qualia-village-explicit-activation-two-mode-review.yml"
          paths=pin["exact_changed_public_paths"]
          assert len(paths)==18
          delta=git("diff","--name-status","--no-renames","-z",base,head).decode().split("\0")
          assert len(delta)==2*(len(paths)+1)+1 and delta[-1]==""
          got=dict(zip(delta[1:-1:2],delta[0:-1:2]))
          assert got=={path:"A",**{k:v["status"] for k,v in paths.items()}}
          for k,r in paths.items():
              assert word("ls-tree",head,"--",k)==f'100644 blob {r["postimage"]}\t{k}'
              if r["status"]=="A":
                  assert r["preimage"] is None and not git("ls-tree",base,"--",k)
              else:
                  assert r["status"]=="M" and word("rev-parse",base+":"+k)==r["preimage"]
              contents=Path(k).read_bytes()
              assert sha(contents)==r["sha256"] and contents==git("show",head+":"+k)
          for k,r in pin["immutable_inputs"].items():
              assert word("rev-parse",head+":"+k)==word("rev-parse",base+":"+k)==r["blob"]
              assert sha(Path(k).read_bytes())==r["sha256"]
          workflow=word("rev-parse",head+":"+path)
          assert word("ls-tree",head,"--",path)==f"100644 blob {workflow}\t{path}"
          assert Path(path).read_bytes()==git("show",head+":"+path)
          assert shutil.disk_usage(stage).free>=8*1024**3
          with tempfile.TemporaryDirectory(dir=stage,prefix="identity-index.") as index:
              env=dict(os.environ,GIT_INDEX_FILE=str(Path(index)/"index"),GIT_OPTIONAL_LOCKS="0")
              git("read-tree",head,env=env)
              git("update-index","--index-info",env=env,data=f"0 {'0'*40}\t{path}\n".encode())
              assert word("write-tree",env=env)==pin["source_successor_tree"]
          assert not git("status","--porcelain","--untracked-files=all")
          print("EXACT_PUBLIC_CODE_AND_WORKFLOW",json.dumps({
              "run":os.environ["GITHUB_RUN_ID"],"attempt":1,"head":head,
              "sole_parent":base,"head_tree":word("rev-parse","HEAD^{tree}"),
              "code_only_tree":pin["source_successor_tree"],"workflow_oid":workflow,
              "workflow_sha256":sha(Path(path).read_bytes()),"source_changed_paths":len(paths),
              "source_pins_sha256":sha(pin_bytes),
              "unchanged_assets_lock":pin["immutable_inputs"],
              "initial_free_bytes":shutil.disk_usage(stage).free,
          },sort_keys=True),flush=True)
          PY

      - name: Use the exact previously observed official Rust release
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.100.0'

      - name: Install the exact signed Ubuntu libudev development package
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rustc +1.100.0 --version --verbose
          cargo +1.100.0 --version
          keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          test -r "$keyring"
          stage="$QUALIA_MODE_REVIEW_STAGE"
          sources="$stage/official-ubuntu.list"
          printf '%s\n' \
            "deb [signed-by=$keyring] https://azure.archive.ubuntu.com/ubuntu resolute main" \
            "deb [signed-by=$keyring] https://azure.archive.ubuntu.com/ubuntu resolute-updates main" \
            "deb [signed-by=$keyring] https://azure.archive.ubuntu.com/ubuntu resolute-security main" > "$sources"
          apt_flags=(-o "Dir::Etc::sourcelist=$sources" -o 'Dir::Etc::sourceparts=-'
            -o 'Acquire::https::Timeout=20' -o 'Acquire::Retries=1' -o 'APT::Update::Error-Mode=any')
          sudo apt-get "${apt_flags[@]}" update
          sudo apt-get "${apt_flags[@]}" install -y --no-install-recommends 'libudev-dev=259.9-0ubuntu0.1'
          test "$(dpkg-query -W -f='${Version}' libudev-dev:amd64)" = 259.9-0ubuntu0.1
          test "$(dpkg-query -W -f='${Version}' libudev1:amd64)" = 259.9-0ubuntu0.1
          dpkg-query -W libudev-dev:amd64 libudev1:amd64
          pkg-config --exists libudev
          pkg-config --modversion --libs libudev

      - name: Build two frozen feature configurations and run three exact App CPU cases
        run: |
          set -euo pipefail
          unset DISPLAY WAYLAND_DISPLAY XAUTHORITY
          export CARGO_HOME="$QUALIA_MODE_REVIEW_STAGE/cargo-home"
          export TMPDIR="$QUALIA_MODE_REVIEW_STAGE/tmp"
          fetch_target="$QUALIA_MODE_REVIEW_STAGE/fetch-target"
          mkdir -m 700 "$fetch_target" "$CARGO_HOME" "$TMPDIR"
          test ! -e "$QUALIA_MODE_REVIEW_STAGE/target"
          CARGO_TARGET_DIR="$fetch_target" cargo +1.100.0 fetch --locked --target x86_64-unknown-linux-gnu
          export CARGO_TARGET_DIR="$QUALIA_MODE_REVIEW_STAGE/target"
          mkdir -m 700 "$CARGO_TARGET_DIR"
          python3 - <<'PY'
          """Review-only inlined body for a separately authorized single hosted job.

          Requires the exact verified hosted source/apt/fetch stage. Does not set up a
          workflow or choose or write a branch. Never execute on the local worker.
          """
          from hashlib import file_digest
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import signal
          import subprocess
          import sys
          import time

          GIB=1024**3
          INNER_SECONDS=1560                 # after locked fetch; outer hosted job is 30m
          BUILD_SOFT_MAX=1030
          TERM_SLACK=5
          CASE_LIMIT=20
          MIN_REVIEW_BUILD_SECONDS=120
          PIN_SHA='03ada528c27e8e9632700a6a59a4745064d829220f36214c67a5097331f320da'
          REVIEW='qualia-village-review'


          def sha(path):
              with path.open('rb') as f:
                  return file_digest(f,'sha256').hexdigest()


          def canonical(path):
              p=Path(path)
              assert p.is_absolute() and not p.is_symlink()
              return p.resolve(strict=True)


          def git(*args):
              return subprocess.check_output(['git','--no-replace-objects',*args])


          def command(args,out,err,seconds):
              clock=time.monotonic()
              status=None
              with out.open('xb') as raw, err.open('xb') as log:
                  proc=subprocess.Popen(args,stdout=raw,stderr=log,start_new_session=True)
                  try:
                      status=proc.wait(timeout=seconds)
                  except subprocess.TimeoutExpired:
                      status=124
                  finally:
                      if proc.poll() is None:
                          try:
                              os.killpg(proc.pid,signal.SIGTERM)
                          except ProcessLookupError:
                              pass
                          try:
                              proc.wait(timeout=TERM_SLACK)
                          except subprocess.TimeoutExpired:
                              try:
                                  os.killpg(proc.pid,signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
                              proc.wait()
              return {'command':args,'status':status,'seconds':round(time.monotonic()-clock,3),
                      'stdout_sha256':sha(out),'stderr_sha256':sha(err)}


          def emit(tag,s):
              print(tag,json.dumps(s,sort_keys=True),flush=True)


          def main():
              assert os.environ.get('GITHUB_ACTIONS')=='true'
              assert os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'
              assert os.environ.get('GITHUB_REPOSITORY')=='BobertNeek/A-Life'
              assert os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
              for name in ('DISPLAY','WAYLAND_DISPLAY','XAUTHORITY'):
                  os.environ.pop(name,None)
              runner=canonical(os.environ['RUNNER_TEMP'])
              stage=canonical(os.environ['QUALIA_MODE_REVIEW_STAGE'])
              target=canonical(os.environ['CARGO_TARGET_DIR'])
              cache=canonical(os.environ['CARGO_HOME'])
              fetch=canonical(stage/'fetch-target')
              tmp=canonical(os.environ['TMPDIR'])
              assert stage.parent==runner and cache.parent==fetch.parent==target.parent==tmp.parent==stage
              assert (cache,fetch,target,tmp)==tuple(stage/p for p in ('cargo-home','fetch-target','target','tmp'))
              assert len({cache,fetch,target,tmp})==4 and not list(target.iterdir()) and not list(tmp.iterdir())
              assert shutil.disk_usage(stage).free>=8*GIB
              assert os.environ.get('CARGO_BUILD_JOBS')=='1'
              assert os.environ.get('CARGO_INCREMENTAL')=='0'
              assert os.environ.get('CARGO_PROFILE_TEST_DEBUG')=='0'
              assert os.environ.get('CARGO_PROFILE_TEST_INCREMENTAL')=='false'
              pins_path=stage/'sealed-pins.json'
              assert sha(pins_path)==PIN_SHA
              pins=json.loads(pins_path.read_bytes())
              assert not git('status','--porcelain','--untracked-files=all')
              head=git('rev-parse','HEAD').decode().strip()
              assert head==os.environ['GITHUB_SHA']
              assert git('rev-list','--parents','-n','1','HEAD').decode().split()==[head,pins['pinned_main']]
              # The enclosing hosted identity step must have separately checked exact
              # stripped workflow tree and branch/push policy. Here bind raw leafs again.
              for p,val in pins['immutable_inputs'].items():
                  assert sha(Path(p))==val['sha256']
              for p,val in pins['exact_changed_public_paths'].items():
                  assert sha(Path(p))==val['sha256']
              app=Path(pins['app_manifest']).resolve(strict=True)
              world=Path(pins['world_manifest']).resolve(strict=True)
              want_src=(app.parent/'src/lib.rs').resolve(strict=True)
              world_src=(world.parent/'src/lib.rs').resolve(strict=True)
              on_app=set(pins['app_features_exact_base'])|{REVIEW}
              off_app=set(pins['app_features_exact_base'])
              deadline=time.monotonic()+INNER_SECONDS
              plan=list(zip(('legacy-off','review-on'),pins['feature_choices'],(off_app,on_app)))
              summary={'head':head,'tree':pins['source_successor_tree'],'output_modes':{},'actual_passes':0,
                       'workflow_lane':'single host, no App/device runtime', 'hard_job_minutes':30,
                       'internal_after_fetch_s':INNER_SECONDS,'app_artifact_shas':{}}
              stock_artifact=None
              stock_elf=None
              stock_world=None
              stock_registry=set()
              fatal=None

              def tests_left(index):
                  return sum(len(pins['cases'][m]) for m, *_ in plan[index:])

              try:
                  for index,(mode,feature_arg,expect) in enumerate(plan):
                      arm={'feature_arg':feature_arg,'expected_app_features':sorted(expect),
                           'planned_exact_cases':pins['cases'][mode],'case_results':[]}
                      summary['output_modes'][mode]=arm
                      if index and stock_artifact is None:
                          arm.update(build_skipped='default mode never sealed a feature-off App libtest')
                          continue
                      remaining=int(deadline-time.monotonic())
                      seconds=min(BUILD_SOFT_MAX,remaining-(CASE_LIMIT+TERM_SLACK)*tests_left(index)-TERM_SLACK-10)
                      arm.update(free_before_build_bytes=shutil.disk_usage(stage).free,soft_build_limit_s=seconds)
                      if seconds<MIN_REVIEW_BUILD_SECONDS or arm['free_before_build_bytes']<8*GIB:
                          arm.update(build_skipped='remaining clock or free-space floor insufficient; not a pass')
                          continue
                      assert not git('status','--porcelain','--untracked-files=all')
                      assert sha(Path('Cargo.lock'))==pins['immutable_inputs']['Cargo.lock']['sha256']
                      args=['cargo','+1.100.0','test','--frozen','--target','x86_64-unknown-linux-gnu',
                            '-j','1','-p','alife_game_app','--no-default-features','--features',feature_arg,
                            '--lib','--no-run','--message-format=json-render-diagnostics']
                      raw=stage/(mode+'.build.jsonl')
                      err=stage/(mode+'.build.stderr')
                      emit('COMPILER_COMMAND',{'mode':mode,'args':args,'soft_seconds':seconds})
                      arm['build']=command(args,raw,err,seconds)
                      emit('COMPILE_RESULT',{'mode':mode,**arm['build']})
                      sys.stderr.buffer.write(err.read_bytes())
                      sys.stderr.buffer.flush()
                      apps=[]; worlds=[]; registry={}
                      with raw.open(encoding='utf-8') as f:
                          for line in f:
                              row=json.loads(line)
                              if row.get('reason')=='compiler-message':
                                  if rendered:=row['message'].get('rendered'):
                                      print(rendered,file=sys.stderr,flush=True,end='')
                              if row.get('reason')!='compiler-artifact':
                                  continue
                              if row['package_id'].startswith('registry+'):
                                  identity=(row['package_id'],row['target']['name'],
                                            tuple(row['target']['kind']),tuple(sorted(row['features'])),
                                            json.dumps(row['profile'],sort_keys=True))
                                  registry.setdefault(identity,[]).append(row['fresh'])
                              manifest=Path(row['manifest_path']).resolve()
                              kind=row['target']['kind']
                              name=row['target']['name']
                              code=Path(row['target']['src_path']).resolve()
                              if manifest==world and kind==['lib'] and name=='alife_world' and code==world_src:
                                  worlds.append(row)
                              if manifest==app and kind==['lib'] and name=='alife_game_app' and code==want_src and row.get('executable'):
                                  apps.append(row)
                      if arm['build']['status']!=0:
                          continue
                      artifact,=apps
                      assert artifact['profile']['test'] is True and artifact['profile']['debug_assertions'] is True
                      assert artifact['fresh'] is False
                      assert set(artifact['features'])==expect
                      w,=worlds
                      assert (REVIEW in w['features'])==(index==1) and w['fresh'] is False
                      assert w['profile']['test'] is False
                      path,=(Path(f).resolve(strict=True) for f in w['filenames'] if f.endswith('.rlib'))
                      assert path.is_file() and path.is_relative_to(target)
                      world_hash=sha(path)
                      emit('WORLD_LIB_FINGERPRINT',{
                          'mode':mode,'sha256':world_hash,'target_relative':str(path.relative_to(target)),
                          'feature_flags':sorted(w['features']),'fresh':w['fresh'],
                      })
                      current=set(registry)
                      shared=current & stock_registry
                      arm['registry_common_vs_off_fresh_rows']=sum(all(registry[k]) for k in shared)
                      arm['registry_common_vs_off_rows']=len(shared)
                      binary=Path(artifact['executable']).resolve(strict=True)
                      assert binary.is_file() and binary.is_relative_to(target) and os.access(binary,os.X_OK)
                      sig=sha(binary)
                      if not index:
                          stock_artifact=sig
                          stock_elf=binary
                          stock_world=(path,world_hash)
                          stock_registry=current
                      else:
                          assert stock_artifact!=sig and stock_elf!=binary and sha(stock_elf)==stock_artifact
                          assert stock_world is not None and stock_world[0]!=path and stock_world[1]!=world_hash
                          assert sha(stock_world[0])==stock_world[1]
                      summary['app_artifact_shas'][mode]=sig
                      arm['binary']={'sha256':sig,'target_relative':str(binary.relative_to(target)),
                                     'features':sorted(artifact['features']), 'fresh':artifact['fresh'],
                                     'world_features':sorted(w['features']),
                                     'world_lib_sha256':world_hash, 'world_lib_relative':str(path.relative_to(target))}
                      emit('APP_LIBTEST',{'mode':mode,**arm['binary']})
                      for number,name in enumerate(pins['cases'][mode],1):
                          if deadline-time.monotonic()<(CASE_LIMIT+TERM_SLACK+4):
                              arm['case_results'].append({'case':name,'status':'not run; insufficient remaining budget','passed':False})
                              continue
                          assert sha(binary)==sig and sha(Path('Cargo.lock'))==pins['immutable_inputs']['Cargo.lock']['sha256']
                          stdout=stage/(f'{mode}.case-{number}.stdout')
                          stderr=stage/(f'{mode}.case-{number}.stderr')
                          # stdin/action controls are all in authored Bevy CPU fixtures.
                          # Run the exact executable, never invoke cargo test discovery.
                          run=command([str(binary),name,'--exact','--test-threads=1','--format=pretty','--color=never'],
                                      stdout,stderr,CASE_LIMIT)
                          out=stdout.read_text()
                          captured=stdout.read_bytes()
                          sys.stdout.buffer.write(captured)
                          sys.stdout.buffer.flush()
                          sys.stderr.buffer.write(stderr.read_bytes())
                          sys.stderr.buffer.flush()
                          rows=[x for x in out.splitlines() if x.startswith('test ') and ' ... ' in x]
                          passed=(run['status']==0 and rows==[f'test {name} ... ok']
                                   and len(re.findall(r'^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;',out,re.M))==1)
                          row={'case':name,'passed':passed,**run}
                          arm['case_results'].append(row)
                          summary['actual_passes']+=int(passed)
                          emit('EXACT_CASE_RESULT',{'mode':mode,**row})
                      assert sha(binary)==sig
              except Exception as e:
                  fatal=e
              finally:
                  summary['first_error']=None if fatal is None else repr(fatal)
                  summary['passed']=set(summary['app_artifact_shas'])==set(pins['cases']) and summary['actual_passes']==3 and fatal is None
                  summary['remaining_seconds']=round(deadline-time.monotonic(),3)
                  summary['cpu_libtests_only_no_full_app']=True
                  with (stage/'two-mode-result.json').open('x') as f:
                      f.write(json.dumps(summary,indent=2,sort_keys=True)+'\n')
                  emit('FINAL_TWO_MODE_RESULT',summary)
              if fatal is not None:
                  raise fatal
              if not summary['passed']:
                  raise SystemExit('Exact two-mode proof incomplete; keep all raw receipts, no retry')

          if __name__=='__main__':main()
          PY

      - name: Retain only raw compiler and named-test logs
        if: always() && env.QUALIA_MODE_REVIEW_STAGE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualia-explicit-village-two-mode-raw-attempt-1
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/legacy-off.build.jsonl
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/legacy-off.build.stderr
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/legacy-off.case-1.stdout
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/legacy-off.case-1.stderr
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.build.jsonl
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.build.stderr
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.case-1.stdout
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.case-1.stderr
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.case-2.stdout
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/review-on.case-2.stderr
            ${{ env.QUALIA_MODE_REVIEW_STAGE }}/two-mode-result.json
