name: Qualia signed Chime Follow fixture CPU review

# Review only. Do not merge this workflow or its review-enabled candidate.
on:
  push:
    branches: ['qualia-ci/village-signed-follow-fixture-review']
    paths: ['.github/workflows/qualia-village-signed-follow-fixture-review.yml']

permissions:
  contents: read

jobs:
  app-cpu-review:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.ref == 'refs/heads/qualia-ci/village-signed-follow-fixture-review' &&
      github.event.before == '8429f54f29e0569a699b3766d70e62bac2c92225' &&
      github.run_attempt == '1' &&
      !github.event.created && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
      RUST_MIN_STACK: '33554432'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout the exact public candidate only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          lfs: false
          submodules: false

      - name: Verify the sealed source, parent and exact code-only tree
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$VERSION_CODENAME" = resolute
          test "$(uname -m)" = x86_64
          printf 'runner_image=%s runner_version=%s os=%s\n' "${ImageOS:-unreported}" "${ImageVersion:-unreported}" "$PRETTY_NAME"
          stage="$(mktemp -d "$RUNNER_TEMP/qualia-signed-follow.XXXXXX")"
          export QUALIA_MODE_REVIEW_STAGE="$stage"
          printf 'QUALIA_MODE_REVIEW_STAGE=%s\n' "$stage" >> "$GITHUB_ENV"
          cat > "$stage/sealed-pins.json" <<'QUALIA_ACTIVATION_PINS'
