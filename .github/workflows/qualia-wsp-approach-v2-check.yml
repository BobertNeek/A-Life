name: Qualia detached WSP Approach V2 source qualification
on:
  push:
    branches: ["bob/qualia-wsp-approach-v2-20261127"]
    paths: [".github/workflows/qualia-wsp-approach-v2-check.yml"]

permissions:
  contents: read

concurrency:
  group: qualia-wsp-approach-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-only:
    if: github.ref == 'refs/heads/bob/qualia-wsp-approach-v2-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PIN_V3_HOST: 8d90e0853cfbf991ac75e02c9ee55ee4cedc3c99
      PIN_V3_PARENT: befddaeaf1a96cf6fb9f3c70244b7970281222c8
      PIN_V3_FIRST: 5f0f31ad10a507a9e2c9d0352b39ef5fe3b87020
      PIN_V3_PARENT_TREE: 2ae2c3b2a8537c8039dcb53b8e7d0d87f5607e38
      PIN_V2_HOST: b00de30b27b8d501c5e01f8df527ffa3471a2d10
      PIN_V2_TREE: a1f474ce9feb2dd70356d93004698525fe7d2bad
      PIN_RESTORE_PARENT: 7a5061285be79275d914f3f8852eaace75c9af1b
      PIN_RESTORE_SOURCE: f466b83791cccb97568e6f718b92b052999cfb2b
      PIN_RESEARCH_COMMIT: 0cd14f12a8012a9b00119a7b33939ca5e3dbeb53
      PIN_RESEARCH_PATCH: 3dcf657b2b1149a7da52e7867c3bdbc4c4dfe8d4785b53c95f429c78aa1cd490
      PIN_REPAIR_PATCH: c2815992c4e3e70a7b7bc42b307dc1d96e8c34483ea36cf2c98e06b9920282e6
      PIN_LEGACY_PATCH: 692ec25acc620f502581e7299d952471c039812646e41f85cdd1d6f87ed5c66d
      PIN_V2_ADAPTER: f0a836086d20e47e434eb947ebc9083f52dc50c344403d24e8ede08ae23ad657
      PIN_V2_ADAPTER_GIT_BLOB: caadc6a85c1a3b9f0b8ae78b2ed8772211b8974d
      PIN_V2_LEAVES_GIT_BLOB: f5262a7072d2ff6ba35fc5d9cf14b7a3507fbb24
      PIN_V3_ADAPTER: fb5ae988ad61a8173dccb60f693ddb362d3984d5e7396c5ff7ac9906a5366970
      PIN_V3_LEAVES: 729e81c65d9f278a613d25ae78422fa8711fca15d85ca5bbe1e9162e51e869b0
      PIN_LOCK: 155699e9274f8890bc8c335669a62de48203ba315a33388a8f0caca71f0f7f37
      PIN_RUSTC_COMMIT: 0ef1bc386059596dada8fb65b50425aab2ea637a
      RUST_TOOLCHAIN: "1.100.0"
      TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_INCREMENTAL: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact source-only event
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact Git parent, restored source, v2 and reversible v3 patches
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$PIN_V3_HOST" HEAD
          test -z "$(git rev-list --merges "$PIN_V3_HOST..HEAD")"
          test "$(git show -s --format=%P "$PIN_V3_HOST")" = "$PIN_V3_PARENT"
          test "$(git rev-parse "$PIN_V3_PARENT^{tree}")" = "$PIN_V3_PARENT_TREE"
          test "$(git show -s --format=%P "$PIN_V3_PARENT")" = "$PIN_V3_FIRST"
          test "$(git show -s --format=%P "$PIN_V3_FIRST")" = "$PIN_V2_HOST"
          test "$(git rev-parse "$PIN_V2_HOST^{tree}")" = "$PIN_V2_TREE"
          git merge-base --is-ancestor "$PIN_RESTORE_PARENT" "$PIN_V2_HOST"
          git merge-base --is-ancestor "$PIN_RESTORE_SOURCE" "$PIN_RESTORE_PARENT"
          git merge-base --is-ancestor "$PIN_RESEARCH_COMMIT" "$PIN_RESTORE_PARENT"
          git diff --exit-code "$PIN_RESTORE_SOURCE" HEAD -- docs/r41-saved-life/{restore_source.py,SOURCE.json,patches}
          diff -u <(printf '%s\n' \
            $'A\t.github/workflows/qualia-wsp-approach-v2-check.yml' \
            $'A\tdocs/r41-saved-life/wsp-approach-v2-source-pins.json' \
            $'A\tdocs/r41-saved-life/wsp-approach-v2-source.patch' \
            $'A\tdocs/r41-saved-life/wsp-approach-witness-source-pins.json' \
            $'A\tdocs/r41-saved-life/wsp-approach-witness-source.patch' \
            $'A\tscripts/check_wsp_approach_v2_cli.py' \
            $'A\tscripts/wsp_approach_v2_world_cpu.rs' \
            | LC_ALL=C sort) <(git diff --name-status --no-renames "$PIN_V3_HOST" HEAD | LC_ALL=C sort)
          export EXACT_SRC="$RUNNER_TEMP/qualia-wsp-approach-v2-source"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/qualia-wsp-approach-v2-target"
          export EVIDENCE="$RUNNER_TEMP/qualia-wsp-approach-v2-evidence"
          printf 'EXACT_SRC=%s\nCARGO_TARGET_DIR=%s\nEVIDENCE=%s\n' \
            "$EXACT_SRC" "$CARGO_TARGET_DIR" "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir "$EVIDENCE"
          research="$RUNNER_TEMP/pinned-research.patch"
          repair="$RUNNER_TEMP/pinned-sleep-boundary-repair.patch"
          legacy="$RUNNER_TEMP/pinned-sleep-legacy-publication.patch"
          v2="$RUNNER_TEMP/pinned-v2.patch"
          v2_blob=docs/r41-saved-life/retained-language-pilot-source.patch
          test "$(git rev-parse "$PIN_V2_HOST:$v2_blob")" = "$PIN_V2_ADAPTER_GIT_BLOB"
          test "$(git rev-parse "$PIN_V2_HOST:docs/r41-saved-life/retained-language-pilot-source-pins.json")" = "$PIN_V2_LEAVES_GIT_BLOB"
          git show "$PIN_RESEARCH_COMMIT:docs/r41-saved-life/research-catalog-source-only.patch" > "$research"
          git show "$PIN_RESTORE_PARENT:docs/r41-saved-life/sleep-boundary-repair-source.patch" > "$repair"
          git show "$PIN_RESTORE_PARENT:docs/r41-saved-life/sleep-legacy-publication-source.patch" > "$legacy"
          git show "$PIN_V2_HOST:$v2_blob" > "$v2"
          v3="$GITHUB_WORKSPACE/docs/r41-saved-life/retained-language-composition-v3-source.patch"
          pins="$GITHUB_WORKSPACE/docs/r41-saved-life/retained-language-composition-v3-pins.json"
          printf '%s  %s\n' "$PIN_RESEARCH_PATCH" "$research" "$PIN_REPAIR_PATCH" "$repair" \
            "$PIN_LEGACY_PATCH" "$legacy" "$PIN_V2_ADAPTER" "$v2" "$PIN_V3_ADAPTER" "$v3" \
            "$PIN_V3_LEAVES" "$pins" | sha256sum -c - | tee "$EVIDENCE/build.log"
          printf 'event_commit=%s\nexact_v2_parent=%s\nsigned_closure=%s\nv3_overlay=%s\n' \
            "$GITHUB_SHA" "$PIN_V2_HOST" "$PIN_RESTORE_SOURCE" "$PIN_V3_ADAPTER" | tee -a "$EVIDENCE/build.log"
          python3 docs/r41-saved-life/restore_source.py "$GITHUB_WORKSPACE" "$EXACT_SRC" | tee -a "$EVIDENCE/build.log"
          cd "$EXACT_SRC"
          for p in "$research" "$repair" "$legacy" "$v2"; do
            git apply --check "$p"
            git apply "$p"
          done
          python3 - "$pins" "$v3" <<'PY' | tee -a "$EVIDENCE/build.log"
          import hashlib, json, os, pathlib, subprocess, sys
          pins = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          assert pins["preceding_v3_hosted_git"] == os.environ["PIN_V3_PARENT"]
          assert pins["exact_v2_git_parent"] == os.environ["PIN_V2_HOST"]
          assert pins["reviewed_v3_patch_sha256"] == os.environ["PIN_V3_ADAPTER"]
          assert pins["cargo_lock_sha256"] == os.environ["PIN_LOCK"]
          assert pins["rust_release"] == os.environ["RUST_TOOLCHAIN"]
          def digest_file(p):
              p = pathlib.Path(p)
              if p.is_symlink() or (p.exists() and not p.is_file()):
                  raise RuntimeError(f"nonregular allowlisted leaf: {p}")
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
          for name, expected in pins["public_b00_support_leaves"].items():
              assert digest_file(pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / name) == expected, name
          leaves = pins["exact_before_after"]
          expected_paths = {
            "crates/alife_game_app/Cargo.toml",
            "crates/alife_game_app/src/foundation_training_cycle/saved_life_retention.rs",
            "crates/alife_game_app/src/foundation_training_cycle/saved_life_retention/experiments.rs",
            "crates/alife_game_app/src/foundation_training_cycle/saved_life_retention/language_composition_v3.rs",
            "crates/alife_world/Cargo.toml",
            "crates/alife_world/src/headless.rs",
          }
          assert set(leaves) == expected_paths and sum(x["before"] is None for x in leaves.values()) == 1
          stats = subprocess.check_output(["git", "apply", "--numstat", "-z", sys.argv[2]])
          assert {x.decode().split("\t",2)[2] for x in stats.rstrip(b"\0").split(b"\0")} == expected_paths
          def verify(k):
              expected = {n: pair[k] for n,pair in leaves.items()}
              expected.update(pins["unchanged_source"], **{"Cargo.lock":pins["cargo_lock_sha256"]})
              for n,want in expected.items():
                  got=digest_file(n)
                  assert got == want, f"{k}: {n} expected {want} actual {got}"
              print(f"{k}: exact six approved leaves plus unchanged v2, catalog and lock")
          def apply(*flags):
              for checks in (("--check",), ()):
                  subprocess.run(["git","apply","--whitespace=error",*flags,*checks,sys.argv[2]],check=True)
          verify("before"); apply(); verify("after"); apply("--reverse"); verify("before"); apply(); verify("after")
          PY

      - name: Exact witness predecessor then independently reviewed guarded V2 source
        run: |
          set -euo pipefail
          cd "$EXACT_SRC"
          python3 -I - "$GITHUB_WORKSPACE" <<'PY' | tee -a "$EVIDENCE/build.log"
          from hashlib import sha256
          import json,pathlib,subprocess,sys
          root=pathlib.Path(sys.argv[1])
          m=root/'docs/r41-saved-life'
          assert sha256((root/'docs/r41-saved-life/wsp-approach-v2-source-pins.json').read_bytes()).hexdigest()=='6aa10727260c0d8fefa95c8c06fbba7e46c676dccd367ac79c4aca554bb6c14d', 'docs/r41-saved-life/wsp-approach-v2-source-pins.json'
          assert sha256((root/'docs/r41-saved-life/wsp-approach-v2-source.patch').read_bytes()).hexdigest()=='e05e637e24254a6509095acf049588265dd920e8c8376079e6453b8746d8526d', 'docs/r41-saved-life/wsp-approach-v2-source.patch'
          assert sha256((root/'docs/r41-saved-life/wsp-approach-witness-source-pins.json').read_bytes()).hexdigest()=='a16ac1107a98ff0488c14808be9fa03c60a7bf5cb189dbd381e707e7a2d2e51a', 'docs/r41-saved-life/wsp-approach-witness-source-pins.json'
          assert sha256((root/'docs/r41-saved-life/wsp-approach-witness-source.patch').read_bytes()).hexdigest()=='7be53715718e68c10e9d04dc373882bfb1caaff3eaa170cbe62366d66a0e61c1', 'docs/r41-saved-life/wsp-approach-witness-source.patch'
          assert sha256((root/'scripts/check_wsp_approach_v2_cli.py').read_bytes()).hexdigest()=='6d9882038ab9d345064102cc1e773bebba5f69ed91d0b589419a66d07f3a382f', 'scripts/check_wsp_approach_v2_cli.py'
          assert sha256((root/'scripts/wsp_approach_v2_world_cpu.rs').read_bytes()).hexdigest()=='0bf469bb7247da1613af86e121ab9d81deff333fabb0077b1bdd51f0da4c2855', 'scripts/wsp_approach_v2_world_cpu.rs'
          def actual(p):
              f=pathlib.Path(p)
              assert not f.is_symlink() and (not f.exists() or f.is_file()), p
              return sha256(f.read_bytes()).hexdigest() if f.is_file() else None
          combined={}
          for patch,before,after in [('wsp-approach-witness','before','after'),('wsp-approach-v2','source_before','source_after')]:
              meta=json.loads((m/f'{patch}-source-pins.json').read_bytes())
              p=m/f'{patch}-source.patch'
              assert sha256(p.read_bytes()).hexdigest()==meta['forward_sha256']
              old,new=meta[before],meta[after]
              assert {k:actual(k) for k in new}=={k:old.get(k) for k in new}, 'preimage mismatch'
              assert len(new) in (5,15)
              for extra in (['--check'],[],['--reverse','--check'],['--reverse'],['--check'],[]):
                  subprocess.run(['git','apply','--whitespace=error',*extra,str(p)],check=True)
              assert {k:actual(k) for k in new}==new, 'postimage mismatch'
              combined.update(new)
              print('checked exact reversible layer',patch,len(new),'source-only leaves')
          pathlib.Path('wsp-approach-source-checked.json').write_text(json.dumps(combined,sort_keys=True))
          PY

      - name: Actual same CLI OFF and CPU World/lossless guard tests; no private fixture
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustc +"$RUST_TOOLCHAIN" -vV | tee -a "$EVIDENCE/build.log"
          rustc +"$RUST_TOOLCHAIN" -vV | grep -Fqx "commit-hash: $PIN_RUSTC_COMMIT"
          rustc +"$RUST_TOOLCHAIN" -vV | grep -Fqx "host: $TARGET"
          cd "$EXACT_SRC"
          mkdir -p "$CARGO_TARGET_DIR"
          test "$(df -PB1 "$CARGO_TARGET_DIR" | awk 'NR==2 {print $4}')" -ge 10737418240
          timeout 8m cargo +"$RUST_TOOLCHAIN" fetch --locked --target "$TARGET" 2>&1 | tee -a "$EVIDENCE/build.log"
          timeout 30m cargo +"$RUST_TOOLCHAIN" build --frozen --offline --no-default-features --target "$TARGET" \
            -p alife_game_app --features retained-wsp-approach-witness --bin evaluate_saved_life_retention 2>&1 | tee -a "$EVIDENCE/build.log"
          install -m 0700 "$CARGO_TARGET_DIR/$TARGET/debug/evaluate_saved_life_retention" "$RUNNER_TEMP/wsp-original-off"
          check=crates/alife_game_app/tests/wsp_approach_v2_world_cpu.rs
          test ! -e "$check"
          install -m 0644 "$GITHUB_WORKSPACE/scripts/wsp_approach_v2_world_cpu.rs" "$check"
          timeout 17m cargo +"$RUST_TOOLCHAIN" test --frozen --offline --no-default-features --target "$TARGET" \
            -p alife_game_app --features retained-wsp-approach-v2 --test wsp_approach_v2_world_cpu -- --nocapture 2>&1 | tee "$EVIDENCE/native-world-cpu.log"
          grep -Fq 'real_world_produces_silence_one_word_and_ordered_pair_without_dispatch ... ok' "$EVIDENCE/native-world-cpu.log"
          grep -Eq '^test result: ok. 1 passed; 0 failed; 0 ignored;' "$EVIDENCE/native-world-cpu.log"
          rm -- "$check"
          timeout 17m cargo +"$RUST_TOOLCHAIN" test --frozen --offline --no-default-features --target "$TARGET" \
            -p alife_gpu_backend --lib --features wsp-approach-v2,gpu-tests wsp_approach -- --nocapture 2>&1 | tee "$EVIDENCE/wsp-naga-capture-cpu.log"
          grep -Fq 'wsp_approach_v2_shader_validates_device_free ... ok' "$EVIDENCE/wsp-naga-capture-cpu.log"
          grep -Fq 'wsp_approach_capture_rejects_wrong_stock_and_nonlocal_change ... ok' "$EVIDENCE/wsp-naga-capture-cpu.log"
          grep -Eq '^test result: ok. 2 passed; 0 failed; 0 ignored;' "$EVIDENCE/wsp-naga-capture-cpu.log"

      - name: Final explicit single ON ELF, immediately seal before any other command can rewrite it
        run: |
          set -euo pipefail
          cd "$EXACT_SRC"
          test "$(df -PB1 "$CARGO_TARGET_DIR" | awk 'NR==2 {print $4}')" -ge 8589934592
          timeout 17m cargo +"$RUST_TOOLCHAIN" build --frozen --offline --no-default-features --target "$TARGET" \
            -p alife_game_app --features retained-wsp-approach-v2 --bin evaluate_saved_life_retention 2>&1 | tee -a "$EVIDENCE/build.log"
          raw="$CARGO_TARGET_DIR/$TARGET/debug/evaluate_saved_life_retention"
          test -f "$raw" && test -x "$raw" && test ! -L "$raw"
          install -m 0700 "$raw" "$EVIDENCE/evaluate_saved_life_retention"
          python3 -I - "$EVIDENCE/wsp-source-authenticated.json" "$EVIDENCE/evaluate_saved_life_retention" "$RUNNER_TEMP/wsp-original-off" <<'PY'
          from hashlib import sha256
          import json,pathlib,os,sys
          pins=json.loads(pathlib.Path('wsp-approach-source-checked.json').read_bytes())
          for k,v in pins.items():
              p=pathlib.Path(k)
              assert p.is_file() and not p.is_symlink() and sha256(p.read_bytes()).hexdigest()==v,k
          assert sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest()==os.environ['PIN_LOCK']
          dst,on,off=map(pathlib.Path,sys.argv[1:])
          b,a=on.read_bytes(),off.read_bytes()
          assert b[:4]==a[:4]==b'\x7fELF' and len(b)<268435456
          marker=b'wsp_approach_v2_opening_receipt'
          assert marker in b and marker not in a and sha256(a).digest()!=sha256(b).digest()
          dst.write_text(json.dumps({'schema':'qualia.compiled_wsp_approach_v2_source_only.v1',
              'event_head':os.environ['GITHUB_SHA'],'source_leaves':pins,'binary_sha256':sha256(b).hexdigest(),
              'off_binary_sha256':sha256(a).hexdigest(),'native_game_run':False,'checkpoint':False,
              'neural_weights_or_private_fixtures_in_artifact':False},sort_keys=True,indent=2)+'\n')
          PY
          python3 -IB "$GITHUB_WORKSPACE/scripts/check_wsp_approach_v2_cli.py" \
            "$RUNNER_TEMP/wsp-original-off" "$EVIDENCE/evaluate_saved_life_retention" \
            "$GITHUB_WORKSPACE/scripts/check_retained_language_composition_v3_cli.py" \
            "$EXACT_SRC/crates/alife_game_app/src/foundation_training_cycle/saved_life_retention/language_pilot.rs" \
            | tee "$EVIDENCE/cli-boundaries.log"
          cd "$EVIDENCE"
          sha256sum evaluate_saved_life_retention build.log native-world-cpu.log wsp-naga-capture-cpu.log cli-boundaries.log wsp-source-authenticated.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain exact ON executable and source-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualia-wsp-approach-v2-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qualia-wsp-approach-v2-evidence/evaluate_saved_life_retention
            ${{ runner.temp }}/qualia-wsp-approach-v2-evidence/*.log
            ${{ runner.temp }}/qualia-wsp-approach-v2-evidence/wsp-source-authenticated.json
            ${{ runner.temp }}/qualia-wsp-approach-v2-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 5
          compression-level: 3
