name: Training artifact storage

on:
  pull_request:
    paths:
      - '.github/workflows/training-artifact-store.yml'
      - 'scripts/*care_serial.py'
      - 'scripts/*held_food_night.py'
      - 'scripts/*training_artifact_store.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/training-artifact-store.yml'
      - 'scripts/*care_serial.py'
      - 'scripts/*held_food_night.py'
      - 'scripts/*training_artifact_store.py'

permissions:
  contents: read

jobs:
  storage:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify immutable reuse and scheduler recovery
        run: |
          python -B -m unittest discover -s scripts -p test_training_artifact_store.py -v
          python -B -m unittest discover -s scripts -p test_cpu_care_serial.py -v
