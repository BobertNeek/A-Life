name: Experimental Windows resident learner
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Native artifact build profile (PR checks remain dev)
        type: choice
        options: [dev, release]
        default: release
      source_revision:
        description: Exact 40-character source commit; empty uses this workflow ref
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/windows-resident-experimental.yml'
      - 'crates/alife_game_app/src/foundation_training_cycle/resident.rs'
      - 'crates/alife_game_app/src/foundation_training_cycle/resident/**'
      - 'scripts/run_continuous_care.py'
      - 'scripts/test_run_continuous_care.py'
permissions:
  contents: read
concurrency:
  group: resident-experimental-${{ github.ref }}-${{ inputs.profile || 'dev' }}-${{ inputs.source_revision || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  focused-native:
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.profile == 'release' && 75 || 35 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '33554432'
      RUST_TEST_THREADS: '1'
      EXPECTED_SOURCE: ${{ inputs.source_revision || github.event.pull_request.head.sha || github.sha }}
      BUILD_PROFILE: ${{ inputs.profile || 'dev' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate exact build request
        run: |
          if ($env:EXPECTED_SOURCE -notmatch '^[0-9a-f]{40}$') { throw 'Exact lowercase source commit required' }
          if ($env:BUILD_PROFILE -notin @('dev','release')) { throw 'Unknown native build profile' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-foundation-native
      - name: Device-free resident loss recovery and ownership contracts
        run: |
          cargo test --locked -p alife_game_app --features foundation-training --lib resident -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Resident contracts failed' }
          cargo test --locked -p alife_game_app --features foundation-training --lib deterministic_nonrich_priming -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic non-rich prior contract failed' }
      - name: Finite continuous-session host lifecycle contracts
        run: |
          python -B -m unittest discover -s scripts -p test_run_continuous_care.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Continuous-session host contracts failed' }
      - name: Compile experimental CLI and full-state inspector
        run: |
          $residentBuildArgs = @('build','--locked','-p','alife_game_app','--features','foundation-training','--bin','train_n2048_care','--bin','export_native_training_handoff','--bin','inspect_archived_success')
          if ($env:BUILD_PROFILE -eq 'release') { $residentBuildArgs += '--release' }
          cargo @residentBuildArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native compile failed' }
          $residentBinaryRoot = if ($env:BUILD_PROFILE -eq 'release') { 'target/release' } else { 'target/debug' }
          & (Join-Path $residentBinaryRoot 'train_n2048_care.exe') --resident-contract
          if ($LASTEXITCODE -ne 0) { throw 'Native capability query failed' }
      - name: Bind artifact to exact source and executable bytes
        id: bind
        run: |
          $residentRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $residentRevision -ne $env:EXPECTED_SOURCE) { throw 'Unexpected compiled source revision' }
          if (git status --porcelain --untracked-files=no) { throw 'Compiled source changed' }
          $residentTree = git rev-parse 'HEAD^{tree}'
          $residentOutputName = 'resident-experimental-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          $residentOutput = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP $residentOutputName)
          $residentHashes = [ordered]@{}
          $residentBinaryRoot = if ($env:BUILD_PROFILE -eq 'release') { 'target/release' } else { 'target/debug' }
          foreach ($residentName in @('train_n2048_care.exe','export_native_training_handoff.exe','inspect_archived_success.exe')) {
            $residentFile = Join-Path $residentBinaryRoot $residentName
            $residentHashes[$residentName] = (Get-FileHash -LiteralPath $residentFile -Algorithm SHA256).Hash.ToLowerInvariant()
            Copy-Item -LiteralPath $residentFile -Destination $residentOutput.FullName
          }
          $residentContractJson = & (Join-Path $residentBinaryRoot 'train_n2048_care.exe') --resident-contract
          if ($LASTEXITCODE -ne 0) { throw 'Built producer capability query failed' }
          $residentContract = $residentContractJson | ConvertFrom-Json
          if ($residentContract.finite_continuous_feeding -ne $true -or $residentContract.temporary_budget_enforced_during_writes -ne $true -or $residentContract.bound_run_cleanup -ne $true) {
            throw 'Built producer lacks the finite-session/quota/cleanup contract'
          }
          $residentReceipt = [ordered]@{
            schema=1; kind='experimental-resident-build-v1'; source_revision=$residentRevision; source_tree=$residentTree
            executables=$residentHashes; rustc=(rustc --version); target='x86_64-pc-windows-msvc'
            features=@('foundation-training'); build_profile=$env:BUILD_PROFILE; gpu_training_executed=$false
            experimental=$true; production_qualified=$false
            resident_producer_contract=$residentContract
            workflow_run="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          $residentReceiptJson = $residentReceipt | ConvertTo-Json -Depth 8 -Compress
          $residentReceiptJson | Set-Content -LiteralPath (Join-Path $residentOutput.FullName 'build-receipt.json') -Encoding utf8
          Write-Output $residentReceiptJson
          "artifact_path=$($residentOutput.FullName)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: windows-resident-${{ env.BUILD_PROFILE }}-${{ env.EXPECTED_SOURCE }}
          path: ${{ steps.bind.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 2
