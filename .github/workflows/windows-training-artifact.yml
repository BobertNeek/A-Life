name: Windows training artifact

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "codex/experimental-frozen-gradient-cache"]
    paths:
      - ".gitattributes"
      - ".github/workflows/windows-training-artifact.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/alife_gpu_backend/**"
      - "crates/alife_runtime/**"
      - "crates/alife_game_app/src/foundation*.rs"
      - "crates/alife_game_app/src/foundation_training/**"
      - "crates/alife_game_app/src/foundation_training_cycle/**"
      - "crates/alife_game_app/src/bin/export_native_training_handoff.rs"
      - "crates/alife_game_app/src/foundation_cpu_care/**"
      - "crates/alife_game_app/src/gpu_live_runtime/semantic_prior.rs"
      - "crates/alife_game_app/src/bin/train_cpu_care_round.rs"
      - "crates/alife_game_app/tests/cpu_care_round.rs"
      - "scripts/compare_cpu_care_rounds.py"
      - "scripts/test_compare_cpu_care_rounds.py"
      - "scripts/check_current_checkpoint_native.py"
      - "scripts/current_checkpoint_store.py"
      - "scripts/run_current_care.py"
      - "crates/alife_game_app/Cargo.toml"
      - "crates/alife_world/src/headless.rs"
      - "crates/alife_world/src/organism.rs"
      - "crates/alife_world/tests/*signature.rs"
      - "crates/alife_world/tests/fresh_foundation_checkpoint_comparison.rs"
      - "crates/alife_game_app/src/gpu_live_runtime/newborn_admission_tests.rs"
      - "scripts/testdata/foundation_probe_sensory_v1.json"
      - "crates/alife_game_app/src/bin/train_n2048_care.rs"
      - "crates/alife_game_app/tests/actor_advantage_centering_cli.rs"
      - "crates/alife_training/**"
  push:
    branches: ["main"]
    paths:
      - ".gitattributes"
      - ".github/workflows/windows-training-artifact.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/alife_gpu_backend/**"
      - "crates/alife_runtime/**"
      - "crates/alife_game_app/src/foundation*.rs"
      - "crates/alife_game_app/src/foundation_training/**"
      - "crates/alife_game_app/src/foundation_training_cycle/**"
      - "crates/alife_game_app/src/bin/export_native_training_handoff.rs"
      - "crates/alife_game_app/src/foundation_cpu_care/**"
      - "crates/alife_game_app/src/gpu_live_runtime/semantic_prior.rs"
      - "crates/alife_game_app/src/bin/train_cpu_care_round.rs"
      - "crates/alife_game_app/tests/cpu_care_round.rs"
      - "scripts/compare_cpu_care_rounds.py"
      - "scripts/test_compare_cpu_care_rounds.py"
      - "scripts/check_current_checkpoint_native.py"
      - "scripts/current_checkpoint_store.py"
      - "scripts/run_current_care.py"
      - "crates/alife_game_app/Cargo.toml"
      - "crates/alife_world/src/headless.rs"
      - "crates/alife_world/src/organism.rs"
      - "crates/alife_world/tests/*signature.rs"
      - "crates/alife_world/tests/fresh_foundation_checkpoint_comparison.rs"
      - "crates/alife_game_app/src/gpu_live_runtime/newborn_admission_tests.rs"
      - "scripts/testdata/foundation_probe_sensory_v1.json"
      - "crates/alife_game_app/src/bin/train_n2048_care.rs"
      - "crates/alife_game_app/tests/actor_advantage_centering_cli.rs"
      - "crates/alife_training/**"

permissions:
  contents: read

concurrency:
  group: windows-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serial-care-round:
    name: Serial CPU care round
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '33554432'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Comparison admission across Windows path aliases
        run: python -B -m unittest discover -s scripts -p test_compare_cpu_care_rounds.py -v
      - name: Rooted and canonical output admission before filesystem mutation
        run: cargo test --locked -p alife_training --features cpu-backend --lib output_resolution_tests
      - name: Serial real-care continuation and matched assessment without a live prior
        run: cargo test --locked -p alife_game_app --features cpu-training --test cpu_care_round -- --nocapture
  build:
    name: Build and check Windows training CLI
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Training shader composition across line endings
        run: cargo test --locked -p alife_gpu_backend --features training-rollout --lib training_rollout::tests
      - name: Collect-only durable publication CPU contracts
        run: cargo test --locked -p alife_training --features cpu-backend --lib cpu::collector_output::tests -- --test-threads=1
      - name: Cooperative round durable recovery CPU contracts
        run: cargo test --locked -p alife_training --features cpu-backend --lib cpu::round_output::tests -- --test-threads=1
      - name: Cooperative round central learner CPU contracts
        env:
          RUST_MIN_STACK: '33554432'
        run: cargo test --locked -p alife_training --features cpu-backend --test cpu_cooperative_round -- --test-threads=1
      - name: Acquisition rehearsal CPU tests
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_acquisition_rehearsal::tests
      - name: Next-cohort archive run ID CPU boundary regressions
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_cycle::founder_refresh_tests::next_cohort_run_id -- --test-threads=1
      - name: Actor-centering CLI CPU admission tests
        run: cargo test --locked -p alife_game_app --features foundation-training --test actor_advantage_centering_cli -- --test-threads=1
      - name: Native comparison identity CPU provenance binding
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training::comparison_identity::tests -- --test-threads=1
      - name: Fresh foundation checkpoint metadata inertness CPU regression
        run: cargo test --locked -p alife_game_app --features foundation-training --lib fresh_foundation_checkpoint_metadata_does_not_change_initial_cognition -- --test-threads=1
      - name: Exact cached replay compiler private-state and RAM admission CPU contracts
        run: |
          cargo test --locked -p alife_training --features receipt-lineage --lib backend_handoff::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p alife_training --features receipt-lineage --lib cache_codec_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p alife_training --features receipt-lineage --lib trainer::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p alife_game_app --features foundation-training --lib replay_io_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p alife_game_app --features foundation-training --lib throughput_ -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p alife_game_app --features foundation-training --lib replay_window_cache -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p alife_game_app --features foundation-training --lib critic_residual::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native sensory serialization matches the shared Python admission fixture
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training::lesson_trace::tests::native_sensory_json_matches_comparison_fixture -- --exact
      - name: Relocated-food physical outcome and backward receipt CPU regressions
        run: cargo test --locked -p alife_game_app --features foundation-training --lib relocated_food -- --test-threads=1
      - name: Relocated-food native CLI admission
        run: cargo test --locked -p alife_game_app --features foundation-training --bin train_n2048_care relocated_food -- --test-threads=1
      - name: Need-driven initialization and retained-source admission CPU contracts
        run: |
          cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training::food_need::tests -- --test-threads=1
          cargo test --locked -p alife_game_app --features foundation-training --lib prospective_food_need_cycle_requires_source_before_any_world_or_gpu_work -- --test-threads=1
      - name: Need condition native CLI controls CPU contracts
        run: cargo test --locked -p alife_game_app --features foundation-training --bin train_n2048_care food_need -- --test-threads=1
      - name: Check opt-in final private life capture controls without a GPU
        run: |
          cargo test --locked -p alife_game_app --features foundation-training --lib final_private_life -- --test-threads=1
          cargo test --locked -p alife_game_app --features foundation-training --bin train_n2048_care final_private_life -- --test-threads=1
      - name: Canonical and policy-weight comparison world identity CPU regressions
        run: cargo test --locked -p alife_world --test headless_world_signature --test policy_weight_comparison_signature --test fresh_foundation_checkpoint_comparison -- --test-threads=1
      - name: Build matching training and checkpoint inspection executables
        run: cargo build --locked -p alife_game_app --features foundation-training --bin train_n2048_care --bin inspect_archived_success --bin export_native_training_handoff
      - name: Single-current compiler Adam private recovery and legacy migration contracts
        env:
          ALIFE_CURRENT_FIXTURE_OUTPUT: ${{ runner.temp }}/current-synthetic-${{ github.run_id }}.alife-checkpoint
        run: cargo test --locked -p alife_game_app --features foundation-training --lib foundation_training_cycle::portable_handoff -- --nocapture --test-threads=1
      - name: Admit publish relocate and extract the synthetic current checkpoint through native CLI
        run: python -B scripts/check_current_checkpoint_native.py target/debug/export_native_training_handoff.exe "${{ runner.temp }}/current-synthetic-${{ github.run_id }}.alife-checkpoint"
      - name: Check rehearsal admission before runtime creation
        run: |
          $taskBinary = (Resolve-Path 'target/debug/train_n2048_care.exe').Path
          $taskMissing = Join-Path $env:RUNNER_TEMP 'missing-rehearsal-source'
          $taskOutput = Join-Path $env:RUNNER_TEMP 'unused-rehearsal-output'
          if ((Test-Path -LiteralPath $taskMissing) -or (Test-Path -LiteralPath $taskOutput)) {
            throw 'Admission checks require absent source and output paths'
          }
          foreach ($taskEpochs in @(0, 512, 513)) {
            $taskStdout = Join-Path $env:RUNNER_TEMP "admission-$taskEpochs.stdout"
            $taskStderr = Join-Path $env:RUNNER_TEMP "admission-$taskEpochs.stderr"
            $taskArgs = @('--resume-cycle', $taskMissing, $taskOutput, '1', '--lesson', 'grab_food', '--acquisition-rehearsal-epochs', "$taskEpochs")
            $taskProcess = Start-Process -FilePath $taskBinary -ArgumentList $taskArgs -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $taskStdout -RedirectStandardError $taskStderr
            $taskError = Get-Content -LiteralPath $taskStderr -Raw
            $taskExpected = if ($taskEpochs -eq 512) { 'existing sealed GrabFood continuation' } else { 'requires 1..=512 offline epochs' }
            if ($taskProcess.ExitCode -eq 0 -or -not $taskError.Contains($taskExpected)) {
              throw "Unexpected admission result for $taskEpochs epochs: $taskError"
            }
            if (Test-Path -LiteralPath $taskOutput) { throw 'Rejected admission created output' }
          }
      - name: Compile opt-in PPO controller without GPU execution
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo test --locked -p alife_training --features receipt-lineage,gpu-tests --test software_ppo_controller --no-run
      - name: Seal artifact metadata
        run: |
          $taskBinary = 'target/debug/train_n2048_care.exe'
          $taskInspector = 'target/debug/inspect_archived_success.exe'
          $taskCheckpoint = 'target/debug/export_native_training_handoff.exe'
          $taskRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $taskRevision -ne $env:GITHUB_SHA) { throw 'Checked-out revision mismatch' }
          $taskTree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the compiled source tree' }
          $taskArtifact = New-Item -ItemType Directory -Path 'target/windows-training-artifact'
          Copy-Item -LiteralPath $taskBinary -Destination $taskArtifact.FullName
          Copy-Item -LiteralPath $taskInspector -Destination $taskArtifact.FullName
          Copy-Item -LiteralPath $taskCheckpoint -Destination $taskArtifact.FullName
          [ordered]@{
            schema = 1
            source_revision = $taskRevision
            source_tree = $taskTree
            executable_sha256 = (Get-FileHash -LiteralPath $taskBinary -Algorithm SHA256).Hash.ToLowerInvariant()
            executables = [ordered]@{
              'train_n2048_care.exe' = (Get-FileHash -LiteralPath $taskBinary -Algorithm SHA256).Hash.ToLowerInvariant()
              'inspect_archived_success.exe' = (Get-FileHash -LiteralPath $taskInspector -Algorithm SHA256).Hash.ToLowerInvariant()
              'export_native_training_handoff.exe' = (Get-FileHash -LiteralPath $taskCheckpoint -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            rustc = (rustc --version)
            target = 'x86_64-pc-windows-msvc'
            features = @('foundation-training')
            build_profile = 'dev'
            cpu_checks = @('training shader composition across line endings', 'acquisition rehearsal', 'next-cohort archive run identity', 'actor-centering CLI admission', 'native policy/executable comparison identity', 'native sensory serialization', 'relocated-food physical outcomes, bounds and backward receipts', 'relocated-food CLI admission', 'world and policy-weight comparison identities', 'CLI bounds 0 and 513 rejected; 512 reaches sealed-source admission', 'rejected admission preserves absent output', 'single-current full-state migration, corruption, relocation and native publication/extraction')
            gpu_training_executed = $false
            founder_promoted = $false
            workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $taskArtifact.FullName 'build-receipt.json') -Encoding utf8
      - name: Upload executable and receipt
        uses: actions/upload-artifact@v4
        with:
          name: windows-training-${{ github.sha }}
          path: target/windows-training-artifact
          if-no-files-found: error
          retention-days: 7
