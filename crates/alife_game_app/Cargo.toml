[package]
name = "alife_game_app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "train_cpu_care"
path = "src/bin/train_cpu_care.rs"
required-features = ["cpu-training"]

[[bin]]
name = "train_cpu_care_round"
path = "src/bin/train_cpu_care_round.rs"
required-features = ["cpu-training"]

[[bin]]
name = "export_native_training_handoff"
path = "src/bin/export_native_training_handoff.rs"
required-features = ["foundation-training"]

[[bin]]
name = "train_n2048_care"
path = "src/bin/train_n2048_care.rs"
required-features = ["foundation-training"]

[[bin]]
name = "rehearse_n2048_care"
path = "src/bin/rehearse_n2048_care.rs"
required-features = ["foundation-training"]

[[bin]]
name = "train_n2048_group50"
path = "src/bin/train_n2048_group50.rs"
required-features = ["foundation-training"]

[[bin]]
name = "inspect_archived_success"
path = "src/bin/inspect_archived_success.rs"
required-features = ["foundation-training"]

[[bin]]
name = "qualify_critic_residual"
path = "src/bin/qualify_critic_residual.rs"
required-features = ["foundation-training"]

[[example]]
name = "inspect_saved_policy"
required-features = ["foundation-training"]

[dependencies]
alife_storage.workspace = true
accesskit = { version = "=0.21.1", optional = true }
alife_core = { path = "../alife_core" }
alife_archive = { path = "../alife_archive", optional = true }
alife_gpu_backend = { path = "../alife_gpu_backend", optional = true }
alife_runtime = { path = "../alife_runtime", optional = true }
alife_school = { path = "../alife_school" }
alife_semantic = { path = "../alife_semantic", features = ["fake-semantic-provider", "local-llamacpp"] }
alife_training = { path = "../alife_training", optional = true }
alife_world = { path = "../alife_world" }
blake3.workspace = true
bincode.workspace = true
bytemuck = { workspace = true, optional = true }
bevy = { workspace = true, optional = true }
bevy_hanabi = { version = "=0.18.0", default-features = false, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "=0.10.9", optional = true }
thiserror.workspace = true
zstd.workspace = true
wgpu = { version = "=27.0.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
default = []
bevy-app = [
    "dep:accesskit",
    "dep:bevy",
    "bevy/default_app",
    "bevy/default_platform",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_render",
    "bevy/bevy_pbr",
    "bevy/bevy_gltf",
    "bevy/gltf_animation",
    "bevy/bevy_picking",
    "bevy/bevy_sprite",
    "bevy/bevy_sprite_render",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_input_focus",
    "bevy/bevy_ui_render",
    "bevy/mesh_picking",
    "bevy/png",
    "bevy/sprite_picking",
    "bevy/tonemapping_luts",
    "bevy/ui_picking",
    # Keep zstd-compressed KTX2/tonemapping support on the existing C backend.
    "bevy/zstd_c",
    "dep:wgpu",
]
gpu-runtime = ["dep:alife_archive", "dep:alife_gpu_backend", "dep:alife_runtime"]
foundation-training = ["gpu-runtime", "dep:alife_training", "alife_training/receipt-lineage", "alife_runtime/training-rollout", "dep:sha2", "dep:bytemuck"]
cpu-training = ["foundation-training", "alife_training/cpu-backend"]
gpu-tests = [
    "gpu-runtime",
    "dep:alife_training",
    "alife_gpu_backend/gpu-tests",
    "alife_runtime/gpu-tests",
]
vfx-hanabi = ["bevy-app", "dep:bevy_hanabi", "bevy_hanabi/3d"]
production-voxel-frontend = [
    "bevy-app",
    "gpu-runtime",
    "vfx-hanabi",
]
