[package]
name = "alife_gpu_backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alife_core.workspace = true
bytemuck.workspace = true
naga = { version = "29.0.3", features = ["wgsl-in"] }
pollster.workspace = true
serde.workspace = true
wgpu.workspace = true

[dev-dependencies]
serde_json.workspace = true
naga = { version = "29.0.3", features = ["spv-out", "hlsl-out"] }
sha2 = "0.10.9"
log = "0.4.32"
profiling = { version = "1.0.18", features = ["profile-with-tracing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }

[features]
default = []
test-support = []
gpu-tests = ["test-support"]
training-rollout = []
# Explicit compiler breadcrumbs only; does not alter shader source or execution.
pipeline-diagnostics = []
