[package]
name = "alife_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alife_core.workspace = true
alife_gpu_backend = { path = "../alife_gpu_backend" }
alife_world = { path = "../alife_world" }
