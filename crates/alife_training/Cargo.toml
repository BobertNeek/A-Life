[package]
name = "alife_training"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alife_core.workspace = true
alife_gpu_backend = { path = "../alife_gpu_backend", features = ["training-rollout"] }
alife_runtime = { path = "../alife_runtime", features = ["training-rollout"] }
alife_world = { path = "../alife_world" }
bytemuck.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { version = "=0.10.9", optional = true }
base64 = { version = "=0.22.1", optional = true }
thiserror.workspace = true
wgpu.workspace = true
zstd = { workspace = true, optional = true }

[dev-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in"] }
serde_json.workspace = true

[features]
default = []
receipt-lineage = ["dep:serde_json", "dep:sha2", "dep:base64", "serde_json/unbounded_depth"]
cpu-backend = ["receipt-lineage", "dep:zstd"]
gpu-tests = ["alife_gpu_backend/gpu-tests", "alife_runtime/gpu-tests"]

[[bin]]
name = "train_cpu_foundation"
path = "src/bin/train_cpu_foundation.rs"
required-features = ["cpu-backend"]

[[bin]]
name = "merge_founder_inference"
path = "src/bin/merge_founder_inference.rs"
required-features = ["receipt-lineage"]
