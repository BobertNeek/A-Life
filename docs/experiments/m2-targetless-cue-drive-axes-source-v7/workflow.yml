name: M2 source-only named-axis diagnostic v7
on:
  push:
    branches: [qualification/m2-targetless-cue-drive-axes-source-v7]
    paths: [docs/experiments/m2-targetless-cue-drive-axes-source-v7/ACTIVATE.json]
permissions:
  contents: read
concurrency:
  group: m2-targetless-cue-drive-axes-source-v7
  cancel-in-progress: false
jobs:
  fixed-qualification:
    if: >-
      github.repository == 'BobertNeek/A-Life' &&
      github.ref == 'refs/heads/qualification/m2-targetless-cue-drive-axes-source-v7' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SEAL_SHA256: fe7374e3ae364c21f1252eba392a6f1b0a85280e56f00aaab1a64d314e5c5ff8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read exact activation and prepared parents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: bundle
          persist-credentials: false
          fetch-depth: 3
          lfs: false
          submodules: false
      - name: Read exact research source base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3aec16df33861f1316d127736f5f60eea327ede
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Admit and run frozen disposable qualification once
        shell: bash
        run: python3 bundle/docs/experiments/m2-targetless-cue-drive-axes-source-v7/run_hosted.py
